- aid: chartmetric:chartmetric-artist-api
  name: Chartmetric Artist API
  description: >-
    Artists, the core entity in Chartmetric, identified by a Chartmetric artist ID. Endpoints cover metadata
    and platform URLs, cross-platform ID lookup, fan metrics and cached stat trends, artist rank and Cross-Platform
    Performance (CPP), catalog data (tracks, albums, chart appearances, playlists), audience demographics
    for Instagram, TikTok and YouTube plus Spotify listener geography, discovery lists (A&R, similar,
    related and neighboring artists), and career context such as milestones, news, live events, venues
    and TV appearances.
  humanURL: https://apidocs.chartmetric.com/
  baseURL: https://api.chartmetric.com/api
  tags:
  - Artists
  tags_raw:
