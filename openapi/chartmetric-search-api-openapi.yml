  /api/search/social:
    get:
      summary: Chartmetric Social Search
      tags:
      - Search
      operationId: searchSocial
      description: Search artists, curators, radio/SiriusXM stations, and songwriters by their social media URLs. DSP links (Spotify, Apple Music, etc.) should be resolved via `/api/{entity}/{type}/{id}/get-ids` instead.
      parameters:
      - name: url
        in: query
        schema:
          type: string
          description: Social media URL to resolve (Instagram, TikTok, X/Twitter, YouTube, Facebook, etc.). DSP links should be resolved via `/api/{entity}/{type}/{id}/get-ids` instead.
        required: true
        description: Social media URL to resolve (Instagram, TikTok, X/Twitter, YouTube, Facebook, etc.). DSP links should be resolved via `/api/{entity}/{type}/{id}/get-ids` instead.
        examples:
          default:
            value: https://example.com
      - name: type
        in: query
        schema:
          type: string
          enum:
          - all
          - artists
          - radio
          - siriusxm
          - songwriters
          - curators
          description: Restrict the search to a single entity type. One of `all`, `artists`, `radio`, `siriusxm`, `songwriters`, `curators`. Defaults to `all`.
          default: all
        required: false
        description: Restrict the search to a single entity type. One of `all`, `artists`, `radio`, `siriusxm`, `songwriters`, `curators`. Defaults to `all`.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          anyOf:
                          - type: string
                          - type: number
                            format: float
                          description: Chartmetric ID of the resolved entity. Numeric for artist/curator, string for platform-native IDs (e.g. SiriusXM channel slug).
                        type:
                          type:
                          - string
                          - 'null'
                          description: Entity type of the match (e.g. `artist`, `curator`, `radio`, `siriusxm`, `songwriter`).
                        name:
                          type:
                          - string
                          - 'null'
                          description: Entity name. Currently populated reliably only for artists.
                        image_url:
                          type:
                          - string
                          - 'null'
                          description: Entity image URL. Currently populated reliably only for artists.
                      required:
                      - id
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - id: 2762
                      type: artist
                      name: Taylor Swift
                      image_url: https://i.scdn.co/image/ab67616100005174f173136b94ae2f75f49f8b2b
