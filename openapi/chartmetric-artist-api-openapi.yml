  /api/artist/{id}/tiktok/refresh:
    post:
      summary: Refresh Artist TikTok Followers On Demand
      tags:
      - Artist
      operationId: refreshArtistTiktokFollowers
      description: 'Fetch the artist''s TikTok follower count from the source now, then return `{ refresh, followers }`: how the refresh ended, and the updated follower series. Priced separately from `GET /api/artist/{id}/stat/tiktok`, which shows the refreshed value afterwards too.


        Only `followers` are refreshed. One refresh per artist per hour: inside that window nothing is fetched, `refresh.status` is `already_fetched` and the call is not charged. A call that has nothing to refresh (`not_in_catalog`) is not charged either. A refresh that could not run is reported under `refresh`, not as an HTTP error. The request stays open until the refresh finishes, which can take a minute or more.'
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 2
          maximum: 2147483647
          not:
            enum:
            - 1
          description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        required: true
        description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        examples:
          default:
            value: 2
      - name: since
        in: query
        schema:
          type: string
          format: date
          description: Start of the follower series returned after the refresh, in `YYYY-MM-DD` format. Defaults to 20 days ago. Does not change what is refreshed.
          default: '2026-09-29'
        required: false
        description: Start of the follower series returned after the refresh, in `YYYY-MM-DD` format. Defaults to 20 days ago. Does not change what is refreshed.
      - name: until
        in: query
        schema:
          type: string
          format: date
          description: End of the follower series returned after the refresh, in `YYYY-MM-DD` format. Defaults to today.
          default: '2026-10-19'
        required: false
        description: End of the follower series returned after the refresh, in `YYYY-MM-DD` format. Defaults to today.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      refresh:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                            - done
                            - already_fetched
                            - already_refreshing
                            - not_in_catalog
                            - skipped
                            - error
                            description: 'How the refresh ended. `done`: fresh data was fetched and written, and `followers` includes it. `already_fetched`: this artist was refreshed within the last hour; stored data is returned. `already_refreshing`: another refresh of this account is running right now. `not_in_catalog`: no TikTok account is linked to this artist. `skipped` / `error`: see `skip_reason` / `error_code`.'
                          run_id:
                            type:
                            - string
                            - 'null'
                            description: Identifier of the refresh run, for support requests.
                          ts:
                            type:
                            - string
                            - 'null'
                            description: When the outcome was reported (ISO 8601).
                          cm_artist_id:
                            type: integer
                            description: Chartmetric artist ID that was refreshed.
                          platform:
                            type: string
                            description: 'Source that was refreshed: `tiktok`.'
                          account_id:
                            type: integer
                            description: Internal id of the refreshed account.
                          handle:
                            type:
                            - string
                            - 'null'
                            description: Handle of the refreshed account on the platform.
                          fetched_at:
                            type:
                            - string
                            - 'null'
                            description: 'On `done`: when the source data was obtained (ISO 8601). Can predate the request when the source served a same-day snapshot.'
                          partial:
                            type: boolean
                            description: 'On `done`: true when some steps of the run did not complete.'
                          steps:
                            type: object
                            properties: {}
                            description: 'On `done`: the pipeline''s own counters and flags for the run.'
                          last_refreshed_at:
                            type:
                            - string
                            - 'null'
                            description: 'On `already_fetched`: when the current refresh window started (ISO 8601).'
                          next_allowed_at:
                            type:
                            - string
                            - 'null'
                            description: 'On `already_fetched`: when the next refresh is allowed (ISO 8601).'
                          skip_reason:
                            type:
                            - string
                            - 'null'
                            description: 'On `skipped` / `already_refreshing`: why nothing was written, e.g. `chartex_untracked`, `lock_busy`.'
                          error_code:
                            type:
                            - string
                            - 'null'
                            description: 'On `error`: a short machine-readable cause, e.g. `upstream_unavailable`, `timeout`, `pipeline_error`.'
                        required:
                        - status
                        description: Outcome of the on-demand refresh.
                      followers:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              anyOf:
                              - type: number
                                format: float
                              - type: string
                              nullable: true
                              description: Metric value at this timestamp. May arrive as string for some uncast aggregates.
                            timestp:
                              anyOf:
                              - type: string
                              - type: string
                                format: date-time
                              nullable: true
                              description: Timestamp of the data point (ISO 8601).
                            flags:
                              type:
                              - boolean
                              - 'null'
                              description: Internal source-data flag for the point.
                            diff:
                              anyOf:
                              - type: number
                                format: float
                              - type: string
                              nullable: true
                              description: Daily change in `value` since the previous data point.
                            weekly_diff:
                              anyOf:
                              - type: number
                                format: float
                              - type: string
                              nullable: true
                              description: Change in `value` versus 7 days ago.
                            weekly_diff_percent:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Percentage change in `value` versus 7 days ago.
                            monthly_diff:
                              anyOf:
                              - type: number
                                format: float
                              - type: string
                              nullable: true
                              description: Change in `value` versus 28 days ago.
                            monthly_diff_percent:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Percentage change in `value` versus 28 days ago.
                            daily_diff:
                              anyOf:
                              - type: number
