      description: Time-series of Instagram / TikTok / YouTube audience stats. Pass `domain` (`instagram`, `tiktok`, `youtube`), `audienceType` (`followers`, `likes`, `commenters`), and `statsType` (`stat`, `demographic`, `country`, `city`, `language`, `brand`, `interest`) plus `since` / `until`. Each item's keys depend on the requested `statsType` — e.g. `stat` rows carry engagement counters, `country` rows carry `code2` + `rank` + `weights`, `city` rows add `city_id` + `city_name` + `city_affinity`. Data is daily historical and may differ slightly from the web app's near-real-time view.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 2
          maximum: 2147483647
          not:
            enum:
            - 1
          description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        required: true
        description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        examples:
          default:
            value: 2
      - name: domain
        in: query
        schema:
          type: string
          enum:
          - instagram
          - youtube
          - tiktok
          description: Social platform. One of `instagram`, `youtube`, `tiktok`. Different platforms support different `audienceType` and `statsType` combinations.
        required: true
        description: Social platform. One of `instagram`, `youtube`, `tiktok`. Different platforms support different `audienceType` and `statsType` combinations.
        examples:
          default:
            value: instagram
      - name: audienceType
        in: query
        schema:
          type: string
          description: Audience subset. One of `followers`, `likes`, `commenters`. Valid combinations with `domain` are platform-specific.
        required: true
        description: Audience subset. One of `followers`, `likes`, `commenters`. Valid combinations with `domain` are platform-specific.
        examples:
          default:
            value: example
      - name: statsType
        in: query
        schema:
          type: string
          description: Audience metric kind. One of `country`, `city`, `interest`, `brand`, `language`, `stat`, `demographic`. Valid combinations with `domain` are platform-specific.
