  /api/artist/{id}/relatedartists:
    get:
      summary: Related Artists
      tags:
      - Artist
      operationId: listArtistRelatedArtists
      description: Related artists ("fans also listen to") for the given Chartmetric artist. Base response returns only metadata + `cm_artist_score`; pass `fromDaysAgo` + `toDaysAgo` to additionally hydrate per-artist `preview_url`, `preview_track_id`, `rank_stats` (array of `{rank, timestp}` over the requested date range), `rank_diff`, and `genres`. Apidoc types `rank_stats` as a single object — in reality it's an array from `getRankStatBatch`.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 2
          maximum: 2147483647
          not:
            enum:
            - 1
          description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        required: true
        description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        examples:
          default:
            value: 2
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 50
          description: Maximum number of related artists to return. Defaults to 10, max 50.
          default: 10
        required: true
        description: Maximum number of related artists to return. Defaults to 10, max 50.
        examples:
          default:
            value: 10
      - name: fromDaysAgo
        in: query
        schema:
          type: integer
          minimum: 0
          description: Start of a date range in days ago from today. When set with `toDaysAgo`, returns extra per-artist enrichments (`preview_url`, `preview_track_id`, `rank_stats`, `rank_diff`, `genres`).
        required: false
        description: Start of a date range in days ago from today. When set with `toDaysAgo`, returns extra per-artist enrichments (`preview_url`, `preview_track_id`, `rank_stats`, `rank_diff`, `genres`).
      - name: toDaysAgo
        in: query
        schema:
          type: integer
          minimum: 0
          description: Optional end of a date range in days ago from today. Defaults to 0 (today). When set together with `fromDaysAgo`, additional per-artist enrichments are returned.
        required: false
        description: Optional end of a date range in days ago from today. Defaults to 0 (today). When set together with `fromDaysAgo`, additional per-artist enrichments are returned.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          maximum: 2147483647
                          description: Chartmetric artist ID of the related artist.
                        name:
                          type:
                          - string
                          - 'null'
                          description: Related artist name.
                        code2:
                          type:
                          - string
                          - 'null'
                          description: Related artist country (ISO 3166-1 alpha-2).
                        cm_artist_rank:
                          type:
                          - integer
                          - 'null'
                          description: Related artist's Chartmetric rank.
                        cm_artist_score:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Related artist's Chartmetric score (0–100).
                        image_url:
                          type:
                          - string
                          - 'null'
                          description: Related artist image URL.
                        sp_followers:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          description: Spotify follower count.
                        popularity:
                          type:
                          - integer
                          - 'null'
                          description: Spotify popularity score (0–100).
                        rank_diff:
                          type:
                          - integer
                          - 'null'
                          description: Change in `cm_artist_rank` between the `toDaysAgo` date and the previous date.
                        preview_url:
                          type:
                          - string
                          - 'null'
                          description: Preview audio URL (only present when date range provided).
                        preview_track_id:
                          anyOf:
                          - type: integer
                            minimum: 0
                            maximum: 2147483647
                          - type: string
                          nullable: true
                          description: Chartmetric ID of the preview track.
                        genres:
                          type:
                          - object
                          - 'null'
                          properties:
                            primary:
                              type:
                              - object
                              - 'null'
                              properties:
                                id:
                                  type:
                                  - integer
                                  - 'null'
                                  minimum: 0
                                  maximum: 2147483647
                                  description: Chartmetric genre ID.
                                name:
                                  type:
                                  - string
                                  - 'null'
                                  description: Genre name.
                                link_type:
                                  type:
                                  - string
                                  - 'null'
                                  description: Genre link type (e.g. `cm_artist_genre`, `cm_artist_sub_genre`).
                                score:
                                  type:
                                  - number
                                  - 'null'
                                  format: float
                                  description: Internal genre relevance score.
                              description: Related artist's primary genre.
                            secondary:
                              type:
                              - array
                              - 'null'
                              items:
                                type: object
                                properties:
                                  id:
                                    type:
                                    - integer
                                    - 'null'
                                    minimum: 0
                                    maximum: 2147483647
                                    description: Chartmetric genre ID.
