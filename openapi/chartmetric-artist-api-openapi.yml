  /api/artist/{type}/{id}/get-ids:
    get:
      summary: Get Cross-Platform Artist IDs
      tags:
      - Artist
      operationId: getArtistIds
      description: Resolve cross-platform artist IDs from any single source. `type` accepts `chartmetric`, `spotify`, `itunes`, `deezer`, `amazon`, `youtube` (or `youtube-channel`), and `instagram`. When `aggregate=true`, domain arrays are pre-aggregated into a single row; otherwise one row per linked id is returned.
      parameters:
      - name: type
        in: path
        schema:
          type: string
          enum:
          - chartmetric
          - spotify
          - itunes
          - deezer
          - amazon
          - youtube
          description: Source identifier type. One of `chartmetric`, `spotify`, `itunes`, `deezer`, `amazon`, `youtube`. `youtube` expects the channel ID, not the artist ID.
        required: true
        description: Source identifier type. One of `chartmetric`, `spotify`, `itunes`, `deezer`, `amazon`, `youtube`. `youtube` expects the channel ID, not the artist ID.
        examples:
          default:
            value: chartmetric
      - name: id
        in: path
        schema:
          anyOf:
          - type: integer
            minimum: 2
            maximum: 2147483647
            not:
              enum:
              - 1
            description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
            x-required: true
          - type: integer
            x-required: true
          - type: string
            pattern: ^[a-zA-Z0-9-_]+$
            x-required: true
          description: Artist identifier whose format depends on `type` — numeric for `chartmetric`/`deezer`/`itunes`, alphanumeric/dashed string for `amazon`/`spotify`/`youtube`.
        required: true
        description: Artist identifier whose format depends on `type` — numeric for `chartmetric`/`deezer`/`itunes`, alphanumeric/dashed string for `amazon`/`spotify`/`youtube`.
        examples:
          default:
            value: 2
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          description: Number of entries to skip. Applied only when `aggregate=false`.
        required: false
        description: Number of entries to skip. Applied only when `aggregate=false`.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          description: Maximum number of entries to return when `aggregate=false`. Defaults to 10000, max 10000. Has no effect when `aggregate=true`.
          default: 10000
        required: false
        description: Maximum number of entries to return when `aggregate=false`. Defaults to 10000, max 10000. Has no effect when `aggregate=true`.
      - name: aggregate
        in: query
        schema:
          type: boolean
          description: If true, returns a single row with platform IDs aggregated into arrays. Deprecated — preserved for backwards compatibility.
