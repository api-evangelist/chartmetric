    get:
      summary: News
      tags:
      - Artist
      operationId: listArtistNews
      description: Recent artist milestones formatted as news items. Each row carries a `summaryTemplate` (with `:placeholder` tokens) plus `summaryData` (token values) and `metadata` (entity ids for deep-linking). Items are selected from the last 90 days with importance `stars >= ceil(weight/2)`. `subType` indicates the underlying event kind (`album`, `track`, `chart`, `playlist`, `artist`) — `summaryData`/`metadata` shapes vary accordingly (kept permissive).
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 2
          maximum: 2147483647
          not:
            enum:
            - 1
          description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        required: true
        description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        examples:
          default:
            value: 2
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 50
          description: Maximum number of news items to return. Defaults to 10, max 50.
          default: 10
        required: false
        description: Maximum number of news items to return. Defaults to 10, max 50.
      - name: weight
        in: query
        schema:
          type: integer
          maximum: 10
          description: Minimum milestone weight (2 weights = 1 star; items with `stars >= ceil(weight/2)` are included). Defaults to 5, max 10.
          default: 5
        required: false
        description: Minimum milestone weight (2 weights = 1 star; items with `stars >= ceil(weight/2)` are included). Defaults to 5, max 10.
