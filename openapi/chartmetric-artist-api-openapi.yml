                        formattedDate:
                          anyOf:
                          - type: string
                          - type: string
                            format: date-time
                          nullable: true
                          description: Display-formatted date for the news item.
                        imageUrl:
                          type:
                          - string
                          - 'null'
                          description: Image URL associated with the news item.
                        summaryTemplate:
                          type:
                          - string
                          - 'null'
                          description: Summary string with `:placeholder` tokens to be filled from `summaryData`.
                        summaryData:
                          type:
                          - object
                          - 'null'
                          properties:
                            chartName:
                              type:
                              - string
                              - 'null'
                              description: Name of the chart (when `subType=chart`).
                            playlistName:
                              type:
                              - string
                              - 'null'
                              description: Name of the playlist (when `subType=playlist`).
                            trackName:
                              type:
                              - string
                              - 'null'
                              description: Name of the track (when `subType=track`).
                            albumName:
                              type:
                              - string
                              - 'null'
