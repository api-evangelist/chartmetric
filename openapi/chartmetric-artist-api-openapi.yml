  /api/artist/{id}/tracks:
    get:
      summary: List Tracks by Artist
      tags:
      - Artist
      operationId: listArtistTracks
      description: Tracks by this artist, including featured collaborations. Supports pagination via `offset`/`limit`, filtering by `artist_type` and by track `version_*` flags (`version_only`, `version_and`, `version_or`, `version_not`). Top-level `total` is the ES-backed artist track count. Mash-up tracks are currently treated as original tracks.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 2
          maximum: 2147483647
          not:
            enum:
            - 1
          description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        required: true
        description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        examples:
          default:
            value: 2
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
        required: false
        description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          description: Maximum number of tracks to return. Defaults to 10, max 200.
          default: 10
        required: false
        description: Maximum number of tracks to return. Defaults to 10, max 200.
      - name: artist_type
        in: query
        schema:
          type: string
          enum:
          - main
          - featured
          description: Filter by artist role on the track. Omit to return both.
        required: false
        description: Filter by artist role on the track. Omit to return both.
      - name: version_only[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - original
            - re_release
            - edit
            - remix
            - acoustic
            - alt_ver
            - physical_ver
            - cover
            - live
            - feat_or_collab
            - dub
            - remaster
            - bonus
            - arrangement
            - commentary
            - lofi
            - component
            - karaoke
            - compilation_rerelease
            - explicit
            - clean
            - other
          description: Return only tracks matching ALL of these version types (AND logic). CANNOT be combined with version_and, version_or, or version_not.
        required: false
        description: Return only tracks matching ALL of these version types (AND logic). CANNOT be combined with version_and, version_or, or version_not.
      - name: version_and[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - original
            - re_release
