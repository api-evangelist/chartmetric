  /api/artist/{id}/tiktok-influencer-stats:
    get:
      summary: 💎 Premium — Get Influencer Breakdown for an Artist
      tags:
      - Artist
      operationId: getArtistTikTokInfluencerStats
      description: 'Distribution of the TikTok creators who used the artist''s sounds, one axis per call. `dimension` selects the axis: `country`, `category` (broad content categories), `subcategory` (the granular creator tags beneath them), `age-gender`, or `language`. Aggregates only — the endpoint reports how many creators fall in each bucket, not who they are. A creator holds exactly one country, age/gender bucket and language, so those shares sum to 1 and `total` is the creator count; a creator can hold several categories, so `category` and `subcategory` return counts with `share` and `total` null and `multi_label` true. Distinct from `tiktok-audience-stats`, which describes the artist''s own TikTok followers rather than the creators using their sounds.'
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 2
          maximum: 2147483647
          not:
            enum:
            - 1
          description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        required: true
        description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        examples:
          default:
            value: 2
      - name: dimension
        in: query
        schema:
          type: string
          enum:
          - country
          - category
          - subcategory
          - age-gender
          - language
          description: Which breakdown to return. `category` is the broad creator-content layer, `subcategory` the granular one; a creator can hold several of either, so those two report counts without a share.
          default: country
        required: false
        description: Which breakdown to return. `category` is the broad creator-content layer, `subcategory` the granular one; a creator can hold several of either, so those two report counts without a share.
      - name: periodDays
        in: query
        schema:
          type: number
          format: float
          enum:
          - 0
          - 7
          - 30
          - 90
          description: Rolling window, in days, over the date creators last posted with the artist's sounds. `0` covers all time.
        required: false
        description: Rolling window, in days, over the date creators last posted with the artist's sounds. `0` covers all time.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      dimension:
                        type: string
                        enum:
                        - country
                        - category
                        - subcategory
                        - age-gender
                        - language
                        description: The requested dimension, echoed back.
                      period_days:
                        type: number
                        format: float
                        enum:
                        - 0
                        - 7
                        - 30
                        - 90
                        description: The requested rolling window in days, echoed back. `0` covers all time.
                      total:
                        type:
                        - integer
                        - 'null'
                        minimum: 0
                        description: Creators the distribution covers. Null on the multi-label dimensions, where counts cannot be summed into a creator total.
                      multi_label:
                        type: boolean
                        description: True when a creator can appear in more than one bucket — `category` and `subcategory`. Those dimensions report counts without a share.
                      available_period_days:
                        type:
                        - array
                        - 'null'
                        items:
                          type: number
                          format: float
                        description: Windows this data is held for. Populated for `age-gender` and `language`; null elsewhere.
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              type: string
                              description: Bucket label — an ISO 3166-1 alpha-2 code for `country`, `age|gender` for `age-gender`, otherwise the category, tag or language name.
                            count:
                              type: integer
                              minimum: 0
                              description: Creators in this bucket.
                            share:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Bucket's fraction of `total`, 0–1. Null on the multi-label dimensions.
                            delta:
                              type:
                              - integer
                              - 'null'
                              description: Change in `count` against the preceding window of the same length. Null where the dimension carries no comparison.
                            age_group:
                              type:
                              - string
                              - 'null'
                              description: Age bracket half of `value`. Present on `age-gender` only; null when the classifier resolved a gender but no age.
                            gender:
                              type:
                              - string
                              - 'null'
                              description: Gender half of `value`. Present on `age-gender` only; null when the classifier resolved an age but no gender.
                          required:
                          - value
                          - count
                        description: Buckets, largest first.
                    required:
                    - dimension
                    - period_days
                    - multi_label
                    - data
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      dimension: age-gender
                      period_days: 30
                      total: 91
                      multi_label: false
                      available_period_days:
                      - 0
                      - 7
                      - 30
                      - 90
                      data:
                      - value: 25-34|female
                        age_group: 25-34
                        gender: female
                        count: 31
                        share: 0.340659
                        delta: 6
                      - value: 18-24|female
                        age_group: 18-24
                        gender: female
                        count: 30
                        share: 0.32967
                        delta: -6
