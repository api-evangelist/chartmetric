  /api/artist/{id}/{status}/events:
    get:
      summary: Live Events
      tags:
      - Artist
      operationId: listArtistEvents
      description: Live events (concerts, festivals, performances) for an artist. The required `fromDaysAgo` / `toDaysAgo` pair is the filter that decides what comes back — `status` (`current` or `past`) only sets the sort direction, so widen the window rather than switching `status` when a call returns fewer events than expected. `type` (`concert` or `festival`) takes a single value and defaults to `concert` when omitted, for backward compatibility; a festival-heavy artist therefore reads as empty unless `type=festival` is passed, and covering both types takes one call each. `GET /api/artist/{id}/venues` applies neither a date window nor a type filter, which is why its counts are routinely higher than a default call here. Events come from the ES `cm_live_event` index, hydrated with jambase/songkick/seatgeek/ticketmaster URLs, venue details, and pricing (when available from seatgeek or ticketmaster). `price_trend` is a seatgeek-only 28-day average-price series; non-seatgeek sources return `[]`. `event_name` suffix (e.g. ` (cancelled)`) reflects the event status.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 2
          maximum: 2147483647
          not:
            enum:
            - 1
          description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        required: true
        description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        examples:
          default:
            value: 2
      - name: status
        in: path
        schema:
          type: string
          enum:
          - current
          - past
          description: Sort direction, not a filter. One of `current`, `past` — `current` sorts ascending, `past` descending. The date range comes from `fromDaysAgo` / `toDaysAgo`.
        required: true
        description: Sort direction, not a filter. One of `current`, `past` — `current` sorts ascending, `past` descending. The date range comes from `fromDaysAgo` / `toDaysAgo`.
        examples:
