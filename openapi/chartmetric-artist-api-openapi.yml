  /api/artist/{id}/cmStats:
    get:
      summary: Artist Cached Stats & Trends
      tags:
      - Artist
      operationId: getArtistCmStats
      description: Cached artist stats snapshot with latest values plus weekly / monthly / bimonthly diffs and diff-percents. `latest` combines platform metrics (followers, listeners, playlist reach, ...) with rank fields (`sp_popularity_rank`, `fan_base_rank`, ...). `weekly_diff`, `monthly_diff`, and `bimonthly_diff` buckets carry only the platform metrics (no ranks). Field names are drawn from `CONSTANTS.ARTIST.CM_STATS.PLATFORM` / `.RANK`; the map is sparse (only populated for platforms where the artist has data). All values are `number | null`.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 2
          maximum: 2147483647
          not:
            enum:
            - 1
          description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        required: true
