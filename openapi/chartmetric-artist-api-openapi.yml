      description: 'Social media and streaming service URLs belonging to this artist. `url` is typically a string but can legally be an array of strings (per SNS record shape) or an empty value. Domains seen in production include `spotify`, `amazon`, `youtubeforartist`, `tvmaze`, `shazam`, `soundcloud`, `genius`, `website`, `lastfm`, `itunes`, `deezer`, `bandsintown`, `instagram`, `songkick`, `gtrends`, `discogs`, `wikipedia`, `twitter`, `youtube`, `facebook`. When the artist has no SNS record the response is `{ obj: {} }` (object instead of array). Note: the `musicbrainz` domain is deprecated and will be removed after August 1st, 2026 — existing values are still echoed in the response until then, but new MusicBrainz URLs are no longer accepted.'
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 2
          maximum: 2147483647
          not:
            enum:
            - 1
          description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        required: true
        description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        examples:
          default:
            value: 2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    anyOf:
                    - type: array
                      items:
                        type: object
                        properties:
                          domain:
                            type:
                            - string
                            - 'null'
                            description: Source domain (e.g. `spotify`, `instagram`, `youtube`, `tvmaze`, `wikipedia`).
                          url:
                            anyOf:
                            - type: string
                            - type: array
                              items:
                                type: string
                            nullable: true
                            description: Profile URL on the domain. Usually a string; may be an array of strings or empty.
                    - type: object
                      properties: {}
                required:
                - obj
                additionalProperties: false
              examples:
