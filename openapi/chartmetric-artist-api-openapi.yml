openapi: 3.2.0
info:
  title: Chartmetric Developer Artist API
  description: 'Public API documentation for the Chartmetric Developer API.


    ## Credit consumption


    On the Prepaid API plan every request consumes API credits. Most endpoints cost

    **1 credit** per request. Premium endpoints — labelled `💎 Premium` in their title —

    return higher-cost audience and playlist data and consume **2 credits** per request:


    - `GET /api/artist/{id}/instagram-audience-stats`

    - `GET /api/artist/{id}/instagram-audience-stats/dates`

    - `GET /api/artist/{id}/social-audience-stats`

    - `GET /api/artist/{id}/tiktok-audience-stats`

    - `GET /api/artist/{id}/tiktok-influencer-stats`

    - `GET /api/artist/{id}/tiktok-top-influencers`

    - `GET /api/artist/{id}/tiktok-top-videos`

    - `GET /api/artist/{id}/where-people-listen`

    - `GET /api/artist/{id}/youtube-audience-stats`

    - `GET /api/artist/{id}/{platform}/{status}/playlists`

    - `GET /api/brand/v2/{brandId}/audience`

    - `GET /api/track/{id}/tiktok-influencer-stats`

    - `GET /api/track/{id}/tiktok-top-influencers`

    - `GET /api/track/{id}/tiktok-top-sounds`

    - `GET /api/track/{id}/topVideos`


    Credits are deducted when the request is received, regardless of the number of rows

    returned. Your remaining balance and the current per-endpoint costs are shown in your

    Chartmetric account under Settings → API Usage. Fixed-rate monthly API plans are not

    billed per request; they are limited by their request rate instead.'
  version: 1.0.1589
  contact:
    name: Chartmetric API Support
    email: backend-engineering@chartmetric.com
servers:
- url: https://api.chartmetric.com
  description: Production
security:
- BearerAuth: []
tags:
- name: Artist
  description: Artists, the core entity in Chartmetric, identified by a Chartmetric artist ID. Endpoints cover metadata and platform URLs, cross-platform ID lookup, fan metrics and cached stat trends, artist rank and Cross-Platform Performance (CPP), catalog data (tracks, albums, chart appearances, playlists), audience demographics for Instagram, TikTok and YouTube plus Spotify listener geography, discovery lists (A&R, similar, related and neighboring artists), and career context such as milestones, news, live events, venues and TV appearances.
paths:
  /api/artist/anr/by/playlists:
    get:
      summary: A&R Artists by Playlists
      tags:
      - Artist
      operationId: listArtistsByPlaylistsANR
      description: A&R-oriented artist snapshot sorted by Spotify playlist-count growth. Hydrated from the `cm_artist_cache` ES index; per-artist releases come from the earliest/latest album query.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 100
          description: Maximum number of artists to return. Defaults to 10, max 100.
          default: 10
        required: false
        description: Maximum number of artists to return. Defaults to 10, max 100.
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - followers_total_reach_diff_week_percent
          - followers_total_reach_diff_week
          description: Column to sort by. One of `followers_total_reach_diff_week_percent`, `followers_total_reach_diff_week`.
        required: true
        description: Column to sort by. One of `followers_total_reach_diff_week_percent`, `followers_total_reach_diff_week`.
        examples:
          default:
            value: followers_total_reach_diff_week_percent
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        rank:
                          anyOf:
                          - type: integer
                          - type: string
                          nullable: true
                          description: 1-based position of the artist within the sorted result set.
                        id:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          maximum: 2147483647
                          description: Chartmetric artist ID.
                        name:
                          type:
                          - string
                          - 'null'
                          description: Artist name.
                        image_url:
                          type:
                          - string
                          - 'null'
                          description: Artist image URL.
                        code2:
                          type:
                          - string
                          - 'null'
                          description: Artist country (ISO 3166-1 alpha-2).
                        sp_followers:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          description: Spotify follower count.
                        sp_popularity:
                          type:
                          - integer
                          - 'null'
                          description: Spotify popularity score (0–100).
                        sp_monthly_listeners:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          description: Spotify monthly listener count.
                        deezer_fans:
                          anyOf:
                          - type: number
                            format: float
                          - type: string
                          nullable: true
                          description: Deezer fan count. May arrive as string (uncast aggregate).
                        tags:
                          type:
                          - array
                          - 'null'
                          items: {}
                          description: List of artist genre tags.
                        spotify_artist_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: Spotify artist IDs linked to this Chartmetric artist.
                        cm_artist_rank:
                          type:
                          - integer
                          - 'null'
                          description: Chartmetric overall artist rank.
                        cm_artist_score:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Chartmetric artist score (0–100).
                        num_tracks:
                          type:
                          - integer
                          - 'null'
                          description: Number of tracks featured in playlists for this artist.
                        num_playlists:
                          type:
                          - integer
                          - 'null'
                          description: Number of playlists featuring this artist.
                        num_playlists_diff_week:
                          type:
                          - integer
                          - 'null'
                          description: Weekly change in playlist count (vs 7 days ago).
                        num_playlists_diff_week_percent:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Weekly percentage change in playlist count.
                        followers_total_reach:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          description: Sum of follower counts across all playlists featuring this artist.
                        followers_total_reach_diff_week:
                          type:
                          - integer
                          - 'null'
                          description: Weekly change in total playlist follower reach.
                        followers_total_reach_diff_week_percent:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Weekly percentage change in total playlist follower reach.
                        popularity:
                          type:
                          - integer
                          - 'null'
                          description: Spotify popularity score (0–100, higher is more popular).
                        popularity_diff_week:
                          type:
                          - integer
                          - 'null'
                          description: Weekly change in Spotify popularity.
                        popularity_diff_week_percent:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Weekly percentage change in Spotify popularity.
                        followers:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          description: Spotify follower count.
                        followers_diff_week:
                          type:
                          - integer
                          - 'null'
                          description: Weekly change in Spotify follower count.
                        followers_diff_week_percent:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Weekly percentage change in Spotify follower count.
                        listeners:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          description: Spotify monthly listener count.
                        listeners_diff_week:
                          type:
                          - integer
                          - 'null'
                          description: Weekly change in Spotify monthly listeners.
                        listeners_diff_week_percent:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Weekly percentage change in Spotify monthly listeners.
                        timestp:
                          anyOf:
                          - type: string
                          - type: string
                            format: date-time
                          nullable: true
                          description: Timestamp for the snapshot (ISO 8601).
                        releases:
                          type:
                          - array
                          - 'null'
                          items:
                            type: object
                            properties:
                              cm_album:
                                type:
                                - integer
                                - 'null'
                                minimum: 0
                                maximum: 2147483647
                                description: Chartmetric album ID.
                              album_name:
                                type:
                                - string
                                - 'null'
                                description: Album name.
                              release_date:
                                anyOf:
                                - type: string
                                - type: string
                                  format: date-time
                                nullable: true
                                description: Album release date (ISO 8601).
                              upc:
                                type:
                                - string
                                - 'null'
                                description: Universal Product Code identifying the release.
                              label:
                                type:
                                - string
                                - 'null'
                                description: Record label that released the album.
                              image_url:
                                type:
                                - string
                                - 'null'
                                description: Album cover image URL.
                          description: List of the artist's earliest and latest album releases.
                        genres:
                          type:
                          - array
                          - 'null'
                          items: {}
                          description: List of genres for the artist.
                        authenticity_risk:
                          description: Authenticity-risk signals for the artist (shape varies).
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - rank: 1
                      id: 53722
                      num_playlists: 17
                      num_tracks: 1
                      followers_total_reach: 1596657
                      followers_total_reach_diff_week: 236916
                      followers_total_reach_diff_week_percent: 0.1742
                      popularity: 43
                      popularity_diff_week: 0
                      popularity_diff_week_percent: 0
                      followers: 2570
                      followers_diff_week: 2
                      followers_diff_week_percent: 0.0008
                      listeners: 182354
                      listeners_diff_week: 1829
                      listeners_diff_week_percent: 0.0101
                      timestp: '2020-02-05T08:00:00.000Z'
                      name: Tharyk
                      image_url: https://i.scdn.co/image/481216e68d8cdc2dad2ba9c64e4d9fcc98b5192a
                      code2: null
                      sp_followers: 2570
                      sp_popularity: 43
                      sp_monthly_listeners: 182354
                      deezer_fans: 173
                      tags: null
                      spotify_artist_ids:
                      - 0l4NszHlXslt1dBt4Y28f7
                      cm_artist_rank: 31792
                      cm_artist_score: 54.2
                      releases:
                      - cm_album: 469946
                        album_name: Mi Destino
                        release_date: '2015-12-04T08:00:00.000Z'
                        upc: '859716151359'
                        label: G+T Music
                        image_url: https://i.scdn.co/image/b08d575f8af8f5b3ccff6250103f878163be7cf7
                      genres: []
  /api/artist/{id}/riaa:
    get:
      summary: RIAA Certifications for Artist Albums
      tags:
      - Artist
      operationId: getArtistRiaaCertifications
      description: RIAA award certifications for albums on which this artist appears. `format` is lower-cased in the query (matches Chartmetric FE preference). Albums are resolved via `l_cm_album_cm_artist` → UPC join → `riaa_album_award`. Results are sorted by `certification_date` descending.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 2
          maximum: 2147483647
          not:
            enum:
            - 1
          description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        required: true
        description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        examples:
          default:
            value: 2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      riaa_awards:
                        type: array
                        items:
                          type: object
                          properties:
                            award_id:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              maximum: 2147483647
                              description: Chartmetric RIAA award row ID.
                            cm_album:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              maximum: 2147483647
                              description: Chartmetric album ID.
                            upc:
                              type:
                              - string
                              - 'null'
                              description: Universal Product Code identifying the album release.
                            certification_date:
                              anyOf:
                              - type: string
                              - type: string
                                format: date-time
                              nullable: true
                              description: Date the award was certified (`YYYY-MM-DDT00:00:00.000Z`).
                            award:
                              type:
                              - string
                              - 'null'
                              description: Award tier (e.g. `Gold`, `1x Platinum`, `4x Multi-Platinum`).
                            album_title:
                              type:
                              - string
                              - 'null'
                              description: Album title.
                            format:
                              type:
                              - string
                              - 'null'
                              description: Album format (e.g. `single`, `album`, `video single`). Lower-cased.
                            image_url:
                              type:
                              - string
                              - 'null'
                              description: Album cover image URL.
                            label:
                              type:
                              - string
                              - 'null'
                              description: Record label that released the album.
                        description: List of RIAA award rows for albums on which this artist appears.
                    required:
                    - riaa_awards
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      riaa_awards:
                      - cm_album: 9384
                        upc: '602557276077'
                        certification_date: '2018-06-29T00:00:00.000Z'
                        award: 1x Platinum
                        album_title: Fake Love
                        format: single
                        image_url: https://i.scdn.co/image/...
                        label: Cash Money Records/Motown Records
                      - cm_album: 9384
                        upc: '602557276077'
                        certification_date: '2018-03-08T00:00:00.000Z'
                        award: 4x Multi-Platinum
                        album_title: Fake Love
                        format: single
                        image_url: https://i.scdn.co/image/...
                        label: Cash Money Records/Motown Records
  /api/artist/anr/by/social-index:
    get:
      summary: A&R Artists by Social Index
      tags:
      - Artist
      operationId: listArtistsBySocialIndexANR
      description: A&R-oriented artist snapshot sorted by social / streaming growth metric. `sortBy` selects which service-type fields are hydrated and returned alongside `weekInsights` (7-day), `insights` (30-day), and `twoMonthInsights` (60-day) growth objects. External API forces `interval=monthly`.
      parameters:
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          description: Number of items to skip from the start of the result set; capped so `limit + offset` does not exceed 10,000 (Elasticsearch max window).
        required: false
        description: Number of items to skip from the start of the result set; capped so `limit + offset` does not exceed 10,000 (Elasticsearch max window).
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 0
          description: Maximum number of artists to return. Defaults to 10, max 100.
          default: 10
        required: false
        description: Maximum number of artists to return. Defaults to 10, max 100.
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - spotify_popularity
          - spotify_followers
          - spotify_monthly_listeners
          - facebook_likes
          - twitter_followers
          - instagram_followers
          - tiktok_followers
          - wiki_views
          - soundcloud_followers
          - youtube_channel_views
          description: Metric to sort by. One of `spotify_popularity`, `spotify_followers`, `spotify_monthly_listeners`, `facebook_likes`, `twitter_followers`, `instagram_followers`, `tiktok_followers`, `wiki_views`, `soundcloud_followers`, `youtube_channel_views`. `facebook_likes` is internally remapped to `fs_likes`.
        required: true
        description: Metric to sort by. One of `spotify_popularity`, `spotify_followers`, `spotify_monthly_listeners`, `facebook_likes`, `twitter_followers`, `instagram_followers`, `tiktok_followers`, `wiki_views`, `soundcloud_followers`, `youtube_channel_views`. `facebook_likes` is internally remapped to `fs_likes`.
        examples:
          default:
            value: spotify_popularity
      - name: tagIds
        in: query
        schema:
          type: integer
          description: Optional parent genre ID to restrict the result set.
        required: false
        description: Optional parent genre ID to restrict the result set.
      - name: subTagIds
        in: query
        schema:
          type: integer
          description: Optional child genre ID. Deprecated and has no effect on the model — kept for backwards compatibility.
        required: false
        description: Optional child genre ID. Deprecated and has no effect on the model — kept for backwards compatibility.
      - name: code2
        in: query
        schema:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
        required: false
        description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
      - name: sortOrderDesc
        in: query
        schema:
          type: boolean
          description: If true (default), sort descending by `sortBy`.
          default: true
        required: false
        description: If true (default), sort descending by `sortBy`.
      - name: minThirtyDayGrowth
        in: query
        schema:
          type: integer
          description: Minimum 30-day growth threshold for `sortBy`.
        required: false
        description: Minimum 30-day growth threshold for `sortBy`.
      - name: maxThirtyDayGrowth
        in: query
        schema:
          type: integer
          description: Maximum 30-day growth threshold for `sortBy`.
        required: false
        description: Maximum 30-day growth threshold for `sortBy`.
      - name: minSpotifyFollowers
        in: query
        schema:
          type: integer
          description: Minimum Spotify followers filter. Defaults to -1 (no minimum).
          default: -1
        required: false
        description: Minimum Spotify followers filter. Defaults to -1 (no minimum).
      - name: maxSpotifyFollowers
        in: query
        schema:
          type: integer
          description: Maximum Spotify followers filter. Defaults to -1 (no maximum).
          default: -1
        required: false
        description: Maximum Spotify followers filter. Defaults to -1 (no maximum).
      - name: recentReleaseWithin
        in: query
        schema:
          type: integer
          description: Restrict to artists whose first release is within this many days of today. Defaults to 2555 (~7 years).
          default: 2555
        required: false
        description: Restrict to artists whose first release is within this many days of today. Defaults to 2555 (~7 years).
      - name: latestReleaseWithin
        in: query
        schema:
          type: integer
          description: Restrict to artists whose latest release is within this many days of today. Defaults to 60.
          default: 60
        required: false
        description: Restrict to artists whose latest release is within this many days of today. Defaults to 60.
      - name: unsigned
        in: query
        schema:
          type: boolean
          description: If true (default), restrict the result set to unsigned artists.
          default: true
        required: false
        description: If true (default), restrict the result set to unsigned artists.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          anyOf:
                          - type: integer
                            minimum: 0
                            maximum: 2147483647
                          - type: string
                          nullable: true
                          description: Chartmetric artist ID. May arrive as string from ES.
                        name:
                          type:
                          - string
                          - 'null'
                          description: Artist name.
                        code2:
                          type:
                          - string
                          - 'null'
                          description: Artist country (ISO 3166-1 alpha-2).
                        image_url:
                          type:
                          - string
                          - 'null'
                          description: Artist image URL.
                        tags:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: List of artist genre tags.
                        spotify_artist_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: Spotify artist IDs linked to this Chartmetric artist.
                        releases:
                          type:
                          - array
                          - 'null'
                          items:
                            type: object
                            properties:
                              cm_album:
                                type:
                                - integer
                                - 'null'
                                minimum: 0
                                maximum: 2147483647
                                description: Chartmetric album ID.
                              album_name:
                                type:
                                - string
                                - 'null'
                                description: Album name.
                              release_date:
                                anyOf:
                                - type: string
                                - type: string
                                  format: date-time
                                nullable: true
                                description: Album release date (ISO 8601).
                              upc:
                                type:
                                - string
                                - 'null'
                                description: Universal Product Code identifying the release.
                              label:
                                type:
                                - string
                                - 'null'
                                description: Record label that released the album.
                              image_url:
                                type:
                                - string
                                - 'null'
                                description: Album cover image URL.
                          description: List of the artist's recent album releases.
                        insights:
                          type:
                          - object
                          - 'null'
                          properties:
                            fdiff:
                              anyOf:
                              - type: number
                                format: float
                              - type: string
                              nullable: true
                              description: Absolute follower-difference over the window (period-end minus period-start).
                            fdiff_percent:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Percentage follower-difference over the window.
                            sns:
                              type:
                              - string
                              - 'null'
                              description: Social/streaming metric key the diff applies to (e.g. `spotify_m`, `instagram_f`).
                            value:
                              anyOf:
                              - type: number
                                format: float
                              - type: string
                              nullable: true
                              description: Latest absolute value of the metric at the end of the window.
                          description: 30-day growth insight.
                        weekInsights:
                          type:
                          - object
                          - 'null'
                          properties:
                            fdiff:
                              anyOf:
                              - type: number
                                format: float
                              - type: string
                              nullable: true
                              description: Absolute follower-difference over the window (period-end minus period-start).
                            fdiff_percent:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Percentage follower-difference over the window.
                            sns:
                              type:
                              - string
                              - 'null'
                              description: Social/streaming metric key the diff applies to (e.g. `spotify_m`, `instagram_f`).
                            value:
                              anyOf:
                              - type: number
                                format: float
                              - type: string
                              nullable: true
                              description: Latest absolute value of the metric at the end of the window.
                          description: 7-day growth insight.
                        twoMonthInsights:
                          type:
                          - object
                          - 'null'
                          properties:
                            fdiff:
                              anyOf:
                              - type: number
                                format: float
                              - type: string
                              nullable: true
                              description: Absolute follower-difference over the window (period-end minus period-start).
                            fdiff_percent:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Percentage follower-difference over the window.
                            sns:
                              type:
                              - string
                              - 'null'
                              description: Social/streaming metric key the diff applies to (e.g. `spotify_m`, `instagram_f`).
                            value:
                              anyOf:
                              - type: number
                                format: float
                              - type: string
                              nullable: true
                              description: Latest absolute value of the metric at the end of the window.
                          description: 60-day growth insight.
                        sp_followers:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          description: Latest Spotify follower count.
                        signed:
                          type:
                          - boolean
                          - 'null'
                          description: Whether the artist is currently signed to a record label.
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - name: jnhygs
                      code2: null
                      image_url: https://i.scdn.co/image/ab67616100005174e370de7eb3169eeeb57bf5d1
                      tags:
                      - Hip-Hop/Rap
                      - Pop
                      - Electronic
                      spotify_artist_ids:
                      - 0H942IkjXv9bjx5OxoG7kh
                      id: '9995920'
                      releases:
                      - cm_album: 26281529
                        album_name: XTAYALIVE
                        release_date: '2023-02-19T00:00:00.000Z'
                        label: 4990469 Records DK
