  /api/artist/list/filter:
    get:
      summary: List Artists (with filters)
      tags:
      - Artist
      operationId: listArtistsByFilter
      description: 'List artists matching a set of filters on per-period stats (`latest` / `weekly_diff` / `monthly_diff` / `*_percent`) across ~60 supported metrics. `sortColumn` accepts `.`. Response is double-wrapped (`{ obj: { obj: [...], offset, total } }`) for backwards compatibility with legacy clients — inner object contains the result page plus pagination counters. Result set capped at 10,000 (`limit + offset <= 10000`).'
      parameters:
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          description: Number of entries to skip. Capped so `limit + offset` does not exceed 10,000 (Elasticsearch max window).
        required: false
        description: Number of entries to skip. Capped so `limit + offset` does not exceed 10,000 (Elasticsearch max window).
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 0
          description: Maximum number of artists to return. Defaults to 50, max 200.
          default: 50
        required: false
        description: Maximum number of artists to return. Defaults to 50, max 200.
      - name: eventIds[]
        in: query
        schema:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 2147483647
          description: Restrict to artists associated with any of these Chartmetric event IDs (e.g. festival lineups).
        required: false
        description: Restrict to artists associated with any of these Chartmetric event IDs (e.g. festival lineups).
      - name: tagId
        in: query
        schema:
          type: integer
          description: Filter by parent genre (Chartmetric genre ID).
        required: false
        description: Filter by parent genre (Chartmetric genre ID).
      - name: subTagId
        in: query
        schema:
          type: integer
          description: Filter by sub-genre (Chartmetric sub-genre ID).
        required: false
        description: Filter by sub-genre (Chartmetric sub-genre ID).
      - name: code2
        in: query
        schema:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
        required: false
        description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
      - name: firstReleaseDaysAgo
        in: query
        schema:
          type: integer
          description: Restrict to artists whose first release falls within this many days of today. Filters on the artist's debut release date.
        required: false
        description: Restrict to artists whose first release falls within this many days of today. Filters on the artist's debut release date.
      - name: pronoun
        in: query
        schema:
          type: string
          enum:
          - any
          - others
          - notSpecified
          - he/him
          - she/her
          - they/them
          description: Filter by artist pronoun. One of `any`, `others`, `notSpecified`, `he/him`, `she/her`, `they/them`.
        required: false
        description: Filter by artist pronoun. One of `any`, `others`, `notSpecified`, `he/him`, `she/her`, `they/them`.
