        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          anyOf:
                          - type: integer
                            minimum: 0
                            maximum: 2147483647
                          - type: string
                          nullable: true
                          description: News-item ID derived from the underlying milestone aggregate.
