  /api/artist/{id}/cpp:
    get:
      summary: Cross-Platform Performance (CPP)
      tags:
      - Artist
      operationId: getArtistCppScore
      description: Cross-Platform Performance rank or score time-series for the artist. `stat=score` returns `{ score, timestp }` rows, `stat=rank` returns `{ rank, timestp }`; when `stat=rank` is combined with `latest=true`, the response additionally carries `rank_25_75`. Values come from Snowflake and keys are lower-cased in the API layer.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 2
          maximum: 2147483647
          not:
            enum:
            - 1
          description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        required: true
        description: 'Chartmetric artist ID. Note: id=1 (''Various Artists'') is rejected.'
        examples:
          default:
            value: 2
      - name: since
        in: query
        schema:
          type: string
          format: date
          description: Start of the date range in ISO format (e.g. '2025-11-01'). Defaults to 20 days ago. Ignored when `latest=true`.
          default: '2026-09-29'
        required: false
        description: Start of the date range in ISO format (e.g. '2025-11-01'). Defaults to 20 days ago. Ignored when `latest=true`.
      - name: until
        in: query
        schema:
          type: string
          format: date
          description: End of the date range in ISO format (e.g. '2025-11-01'). Defaults to today. Ignored when `latest=true`.
          default: '2026-10-19'
        required: false
        description: End of the date range in ISO format (e.g. '2025-11-01'). Defaults to today. Ignored when `latest=true`.
      - name: stat
        in: query
        schema:
          type: string
          enum:
          - score
          - rank
          description: CPP statistic to return. `rank` is the Chartmetric Cross-Platform Performance rank; `score` is the underlying 0–1 score from which the rank is derived.
        required: true
        description: CPP statistic to return. `rank` is the Chartmetric Cross-Platform Performance rank; `score` is the underlying 0–1 score from which the rank is derived.
        examples:
          default:
            value: score
      - name: latest
        in: query
        schema:
          type: boolean
          description: If true, returns only the most recent data point and ignores `since`/`until`.
        required: false
        description: If true, returns only the most recent data point and ignores `since`/`until`.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        score:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Chartmetric Cross-Platform Performance score (0–1). Present when `stat=score`.
                        rank:
                          type:
                          - integer
                          - 'null'
                          description: Chartmetric Cross-Platform Performance rank. Present when `stat=rank`.
                        rank_25_75:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Deprecated rank field; emitted only when `stat=rank` and `latest=true`. Use `rank` instead.
                        timestp:
                          anyOf:
                          - type: string
                          - type: string
                            format: date-time
                          nullable: true
                          description: Date the statistic was achieved (ISO 8601).
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - score: 0.777289463353648
                      timestp: '2019-12-10T00:00:00.000Z'
                    - score: 0.812443293506014
                      timestp: '2019-12-12T00:00:00.000Z'
                    - score: 0.758845785647956
                      timestp: '2019-12-13T00:00:00.000Z'
