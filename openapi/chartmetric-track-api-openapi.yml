  /api/track/{type}/{id}/get-ids:
    get:
      summary: Get Cross-Platform IDs for a Track
      tags:
      - Track
      operationId: getTrackIds
      description: Resolve cross-platform IDs from any single ID. `type` accepts `chartmetric`, `isrc`, `spotify`, `itunes`, `tiktok`, `genius`. All domain arrays may be `null` if the track has no linked ID in that domain.
      parameters:
      - name: type
        in: path
        schema:
          type: string
          enum:
          - amazon
          - beatport
          - chartmetric
          - deezer
          - genius
          - isrc
          - itunes
          - shazam
          - spotify
          - soundcloud
          - tiktok
          - qq
          - youtube
          description: Domain of the input `id`. One of `chartmetric`, `isrc`, `spotify`, `itunes`, `tiktok`, `genius`, `amazon`, `beatport`, `deezer`, `qq`, `shazam`, `soundcloud`, `youtube`.
        required: true
        description: Domain of the input `id`. One of `chartmetric`, `isrc`, `spotify`, `itunes`, `tiktok`, `genius`, `amazon`, `beatport`, `deezer`, `qq`, `shazam`, `soundcloud`, `youtube`.
        examples:
          default:
            value: amazon
      - name: id
        in: path
        schema:
          type: string
          pattern: ^[a-zA-Z0-9-_]+$
          description: ID for the domain specified by `type` (e.g. a Spotify track ID when `type=spotify`, an ISRC when `type=isrc`, a Chartmetric numeric ID when `type=chartmetric`).
        required: true
        description: ID for the domain specified by `type` (e.g. a Spotify track ID when `type=spotify`, an ISRC when `type=isrc`, a Chartmetric numeric ID when `type=chartmetric`).
