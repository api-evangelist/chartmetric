  /api/track/{id}/tiktok-influencer-stats:
    get:
      summary: 💎 Premium — Get Influencer Breakdown for a Track
      tags:
      - Track
      operationId: getTrackTikTokInfluencerStats
      description: 'Distribution of the TikTok creators who used the track''s sounds, one axis per call. `dimension` selects the axis: `country`, `category` (broad content categories), `subcategory` (the granular creator tags beneath them), `age-gender`, or `language`. Aggregates only — the endpoint reports how many creators fall in each bucket, not who they are. A creator holds exactly one country, age/gender bucket and language, so those shares sum to 1 and `total` is the creator count; a creator can hold several categories, so `category` and `subcategory` return counts with `share` and `total` null and `multi_label` true.'
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric track ID.
        required: true
        description: Chartmetric track ID.
        examples:
          default:
            value: 1
      - name: dimension
        in: query
        schema:
          type: string
          enum:
          - country
          - category
          - subcategory
          - age-gender
          - language
          description: Which breakdown to return. `category` is the broad creator-content layer, `subcategory` the granular one; a creator can hold several of either, so those two report counts without a share.
          default: country
        required: false
        description: Which breakdown to return. `category` is the broad creator-content layer, `subcategory` the granular one; a creator can hold several of either, so those two report counts without a share.
      - name: periodDays
        in: query
        schema:
          type: number
          format: float
          enum:
          - 0
          - 7
          - 30
          - 90
          description: Rolling window, in days, over the date creators last posted with the track's sounds. `0` covers all time.
        required: false
        description: Rolling window, in days, over the date creators last posted with the track's sounds. `0` covers all time.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      dimension:
                        type: string
                        enum:
                        - country
                        - category
                        - subcategory
                        - age-gender
                        - language
                        description: The requested dimension, echoed back.
                      period_days:
                        type: number
                        format: float
                        enum:
                        - 0
                        - 7
                        - 30
                        - 90
                        description: The requested rolling window in days, echoed back. `0` covers all time.
                      total:
                        type:
                        - integer
                        - 'null'
                        minimum: 0
                        description: Creators the distribution covers. Null on the multi-label dimensions, where counts cannot be summed into a creator total.
                      multi_label:
                        type: boolean
                        description: True when a creator can appear in more than one bucket — `category` and `subcategory`. Those dimensions report counts without a share.
                      available_period_days:
                        type:
                        - array
                        - 'null'
                        items:
                          type: number
                          format: float
                        description: Windows this data is held for. Populated for `age-gender` and `language`; null elsewhere.
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              type: string
                              description: Bucket label — an ISO 3166-1 alpha-2 code for `country`, `age|gender` for `age-gender`, otherwise the category, tag or language name.
                            count:
                              type: integer
                              minimum: 0
                              description: Creators in this bucket.
                            share:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Bucket's fraction of `total`, 0–1. Null on the multi-label dimensions.
                            delta:
                              type:
                              - integer
                              - 'null'
                              description: Change in `count` against the preceding window of the same length. Null where the dimension carries no comparison.
                            age_group:
                              type:
                              - string
                              - 'null'
                              description: Age bracket half of `value`. Present on `age-gender` only; null when the classifier resolved a gender but no age.
                            gender:
                              type:
                              - string
                              - 'null'
                              description: Gender half of `value`. Present on `age-gender` only; null when the classifier resolved an age but no gender.
                          required:
                          - value
                          - count
                        description: Buckets, largest first.
                    required:
                    - dimension
                    - period_days
                    - multi_label
                    - data
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      dimension: age-gender
                      period_days: 30
                      total: 91
                      multi_label: false
                      available_period_days:
                      - 0
                      - 7
                      - 30
                      - 90
                      data:
                      - value: 25-34|female
                        age_group: 25-34
                        gender: female
                        count: 31
                        share: 0.340659
                        delta: 6
                      - value: 18-24|female
                        age_group: 18-24
                        gender: female
                        count: 30
                        share: 0.32967
                        delta: -6
  /api/track/{id}/tiktok-top-sounds:
    get:
      summary: 💎 Premium — List Popular TikTok Sounds for a Track
      tags:
      - Track
      operationId: listTrackTikTokTopSounds
      description: 'The TikTok sounds carrying the track''s audio that have been active recently, one row each -- the Top Sounds table on the track''s TikTok page. A track usually has many: one official sound plus the user uploads that spread separately, each with its own video count and reach. This is not every sound we hold: a sound is returned when we have video stats for it inside the seven-day trend window and it is not a de-duplicated entry, so dormant sounds drop out -- on the track behind the example our cache holds 436 and 134 come back, the same set the app''s own table renders. Rows come back ordered by views, highest first, and `video_trend` carries a daily video count reaching seven days back so a caller can tell a sound that is still spreading from one that has stalled.'
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric track ID.
        required: true
        description: Chartmetric track ID.
        examples:
          default:
            value: 1
      - name: official
        in: query
        schema:
          type: boolean
          description: Restrict to sounds TikTok marks official when true, to the rest when false. Omit for both.
        required: false
        description: Restrict to sounds TikTok marks official when true, to the rest when false. Omit for both.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        tiktok:
                          type:
                          - integer
                          - 'null'
                          description: Chartmetric's own ID for the sound.
                        tiktok_track_id:
                          type:
                          - string
                          - 'null'
                          description: TikTok's ID for the sound, as Chartmetric stores it. Many carry an `x-` prefix -- on the track behind the example, all 134 did, official and not alike -- so the prefix is not a marker for anything a caller should branch on.
                        name:
                          type:
                          - string
                          - 'null'
                          description: Sound title as it appears on TikTok.
                        creator_name:
                          type:
                          - string
                          - 'null'
                          description: Who TikTok credits the sound to.
                        views:
                          type:
                          - integer
                          - 'null'
                          description: Views across every video using the sound.
                        posts:
                          type:
                          - integer
                          - 'null'
                          description: Videos using the sound.
                        first_post_date:
                          type:
                          - string
                          - 'null'
                          description: Date the earliest video using the sound was posted, `YYYY-MM-DD`. Null for sounds with no videos in our video history yet.
                        upload_date:
                          type:
                          - string
                          - 'null'
                          description: Date the sound went up on TikTok, `YYYY-MM-DD`.
                        is_official:
                          type: boolean
                          description: Whether the sound is flagged as the track's official sound. Typically one sound per track carries this and the rest are user uploads of the same audio -- 1 of 134 on the track behind the example.
                        is_original:
                          type: boolean
                          description: Whether TikTok marks the sound as original audio.
                        is_ai_generated:
                          type: boolean
                          description: Whether TikTok flags the sound as AI-generated.
                        still_on_tiktok:
                          type: boolean
                          description: Whether the sound is still live on TikTok.
                        thumbnail_url:
                          type:
                          - string
                          - 'null'
                          description: Sound artwork.
                        video_trend:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type:
                                - string
                                - 'null'
                                description: Date of the reading, `YYYY-MM-DD`.
                              videos:
                                type:
                                - integer
                                - 'null'
                                description: Videos using the sound on that date.
                          description: Daily count of videos using the sound, oldest first. The window reaches seven days back, so up to eight dated readings come back. Sounds with no new videos across the window report an empty array.
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - tiktok: 25646255
                      tiktok_track_id: x-7559312683885201425
                      name: Choosin' Texas
                      creator_name: Ella Langley
                      views: 989416726
                      posts: 356929
                      first_post_date: null
                      upload_date: '2025-10-20'
                      is_official: true
                      is_original: false
                      is_ai_generated: false
                      still_on_tiktok: true
                      thumbnail_url: https://p16-common.tiktokcdn-us.com/tos-alisg-v-2774/oIBRCwt8oFHAAtWAIoED2efkIAaSgHxDBQimJZ~tplv-tiktokx-cropcenter:720:720.jpeg
                      video_trend:
                      - date: '2026-08-24'
                        videos: 349649
                      - date: '2026-08-25'
                        videos: 350792
  /api/track/{id}/topVideos:
    get:
      summary: 💎 Premium — List Top TikTok Videos for a Track
      tags:
      - Track
      operationId: listTrackTopTikTokVideos
      description: Return the top TikTok videos associated with a track. When `type=trending` only, returns trending videos; otherwise the top videos by the selected sort. `cm_id` is populated when the poster is linked to a Chartmetric artist. Each row carries the video caption, cumulative engagement counters, the daily history behind them, and change rates over the comparison window. Page with `limit` and `offset`, narrow with `postedWithinDaysAgo` or the `min`/`max` metric bounds, and set `withTotal=true` to receive the rows inside an envelope carrying `total` and `available_count` rather than as a bare array.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric track ID.
        required: true
        description: Chartmetric track ID.
        examples:
          default:
            value: 1
      - name: type
        in: query
        schema:
          type: string
          enum:
          - likes
          - views
          - comments
          - followers
          - created_at
          - trending
          - modified_at
          - saves
          - shares
          description: Sort metric for the returned videos. Defaults to `likes`; allowed values come from TikTok engagement stats.
          default: likes
        required: false
        description: Sort metric for the returned videos. Defaults to `likes`; allowed values come from TikTok engagement stats.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of videos to return. Max 100.
          default: 10
        required: false
        description: Maximum number of videos to return. Max 100.
      - name: byTiktokId
        in: query
        schema:
          type: boolean
          description: If true, treat `id` as a TikTok sound ID (string-internally) rather than a Chartmetric track ID. Defaults to false.
          default: false
        required: false
        description: If true, treat `id` as a TikTok sound ID (string-internally) rather than a Chartmetric track ID. Defaults to false.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
