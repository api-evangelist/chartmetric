      - name: type
        in: query
        schema:
          type: string
          enum:
          - likes
          - views
          - comments
          - trending
          - created_at
          description: Sort metric for the returned Shorts. Defaults to `likes`; allowed values come from YouTube engagement stats.
          default: likes
        required: false
