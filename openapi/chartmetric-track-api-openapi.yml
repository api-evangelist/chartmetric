  /api/track/{id}/milestones:
    get:
      summary: List Milestones for a Track
      tags:
      - Track
      operationId: listTrackMilestones
      description: Return milestone events (chart adds, playlist adds, threshold crossings, etc.) for a track, ranked by star count by default. Use `grouped=true` or `group=` to paginate within categories.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric track ID.
        required: true
        description: Chartmetric track ID.
        examples:
          default:
            value: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          description: Maximum number of milestones to return. Defaults to 100.
          default: 100
        required: false
        description: Maximum number of milestones to return. Defaults to 100.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
        required: false
        description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
      - name: stars[]
        in: query
        schema:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 5
          description: Restrict to milestones with star counts in this set (e.g. `[1, 2, 3]`). Each value is between 1 and 5.
        required: false
        description: Restrict to milestones with star counts in this set (e.g. `[1, 2, 3]`). Each value is between 1 and 5.
      - name: fromDaysAgo
        in: query
        schema:
          type: integer
          description: Restrict to milestones from the last N days, counted from today.
        required: false
        description: Restrict to milestones from the last N days, counted from today.
      - name: sortColumn
        in: query
        schema:
          type: string
          enum:
          - date
          - stars
          description: Column to sort milestones by. One of `date`, `stars`. Defaults to `date`.
          default: date
        required: false
        description: Column to sort milestones by. One of `date`, `stars`. Defaults to `date`.
      - name: sortOrderDesc
        in: query
        schema:
          type: boolean
          description: If true, sort descending by `sortColumn`. Defaults to true.
          default: true
        required: false
        description: If true, sort descending by `sortColumn`. Defaults to true.
      - name: platforms[]
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - amazon
            - apple_music
            - beatport
            - chartmetric
            - deezer
            - instagram
            - itunes
            - pandora
            - shazam
            - soundcloud
            - spotify
            - tiktok
            - youtube
            title: Platform name
          description: Restrict to milestones from these platforms (e.g. `Spotify`, `YouTube`).
        required: false
        description: Restrict to milestones from these platforms (e.g. `Spotify`, `YouTube`).
      - name: grouped
        in: query
        schema:
          type: boolean
          description: If true, return only the top milestone per group (e.g. one per chart). Defaults to false.
        required: false
        description: If true, return only the top milestone per group (e.g. one per chart). Defaults to false.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      insights:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              anyOf:
                              - type: number
                                format: float
                              - type: string
                              description: Milestone ID. May arrive as numeric or string.
                            date:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Date the milestone was achieved.
                            summary:
                              type:
                              - string
                              - 'null'
                              description: Human-readable description of the milestone, matching the artist profile UI.
                            artist_name:
                              type:
                              - string
                              - 'null'
                              description: Display name of the artist credited on the milestone.
                            track_name:
                              type:
                              - string
                              - 'null'
                              description: Track title associated with the milestone.
                            platform:
                              type:
                              - string
                              - 'null'
                              description: Platform that triggered the milestone (e.g. 'Spotify', 'YouTube').
                            stars:
                              type:
                              - integer
                              - 'null'
                              description: Importance score (1–5; higher is more notable).
                        description: Milestone events for the track, ranked by importance and date.
                      count:
                        type:
