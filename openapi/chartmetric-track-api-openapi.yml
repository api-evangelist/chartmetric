  /api/track/{id}/tiktok-top-influencers:
    get:
      summary: 💎 Premium — List Top TikTok Influencers for a Track
      tags:
      - Track
      operationId: listTrackTikTokTopInfluencers
      description: The TikTok creators who used the track's sound, one row each -- the table the app shows on its TikTok page. Where the breakdown endpoint reports how the group splits by country or language, this reports who the creators are. Paged and filterable on every column the app's own filters use; `total` counts what matches the current filters rather than the whole set.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric track ID.
        required: true
        description: Chartmetric track ID.
        examples:
          default:
            value: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Influencers per page. Defaults to 25, max 100.
          default: 25
        required: false
        description: Influencers per page. Defaults to 25, max 100.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          description: Influencers to skip, for paging past the first `limit` rows. Defaults to 0, max 10,000.
        required: false
        description: Influencers to skip, for paging past the first `limit` rows. Defaults to 0, max 10,000.
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - rank
          - totalFollowers
          - totalViews
          - totalLikes
          - totalComments
          - engagementRate
          - totalSaves
          - totalShares
          - dateAdded
          - avgViews
          - avgLikes
