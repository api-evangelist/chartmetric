  /api/track/{id}/relatedTracks:
    get:
      summary: List Related Tracks
      tags:
      - Track
      operationId: listTrackRelatedTracks
      description: Return related tracks — remixes, live versions, remasters, and other cluster members. Each entry carries the same basic info shape as `GET /api/track/{id}` plus cluster flags.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric track ID.
        required: true
        description: Chartmetric track ID.
        examples:
          default:
            value: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Related track's Chartmetric track ID.
                        name:
                          type:
                          - string
                          - 'null'
                          description: Related track's title.
                        image_url:
                          type:
                          - string
                          - 'null'
                          description: URL of the related track's artwork.
                        isrc:
                          type:
                          - string
                          - 'null'
                          description: Related track's ISRC.
                        is_most_popular_cm_track:
                          type: boolean
                          description: True if this version is the most popular among all cluster members.
                        is_earliest_cm_track:
                          type: boolean
                          description: True if this version is the earliest ingested among all cluster members.
                        cluster_type:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: Cluster classification flags (e.g. 'remix', 'live', 'remaster'). Empty for the original.
                      required:
                      - id
                      - is_most_popular_cm_track
                      - is_earliest_cm_track
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - id: 31826159
                      name: 34+35
                      image_url: https://i.scdn.co/image/ab67616d0000b273ba23b8f2fcaa9bc762e37865
                      isrc: USUM72020424
                      is_most_popular_cm_track: false
                      is_earliest_cm_track: false
                      cluster_type: []
                    - id: 32564030
                      name: 34+35 (Remix) [feat. Doja Cat & Megan Thee Stallion]
                      image_url: https://is4-ssl.mzstatic.com/image/thumb/Music114/v4/b4/b3/95/b4b39515-3c23-de6f-521e-d5beb3a31d7d/20UM1IM17687.rgb.jpg/160x160bb.jpeg
                      isrc: USUM72024484
                      is_most_popular_cm_track: true
                      is_earliest_cm_track: true
                      cluster_type:
                      - remix
  /api/track/{id}/{platform}/{status}/playlists:
    get:
      summary: List Playlists Containing a Track
      tags:
      - Track
      operationId: listTrackPlaylists
      description: 'Return playlists that currently (or previously) contain a track. `platform` accepts `spotify`, `applemusic` (aliased to `itunes`), `deezer`, `amazon`, `soundcloud`. `status` is `current` or `past`.


        **Allowed `sortColumn` per (`platform`, `status`):**


        | platform | status | Valid `sortColumn` values |

        |---|---|---|

        | spotify | current | `added_at`, `fdiff_month`, `followers` (default), `name`, `position`, `peak_position`, `track`, `code2` |

        | spotify | past | `added_at`, `fdiff_month`, `followers` (default), `name`, `position`, `peak_position`, `removed_at`, `track`, `code2` |

        | applemusic | current | `added_at` (default), `name`, `position`, `peak_position` |

        | applemusic | past | `added_at`, `name`, `position`, `peak_position`, `removed_at` (default) |

        | deezer | current | `added_at` (default), `fdiff_month`, `followers`, `name`, `peak_position` |

        | deezer | past | `added_at`, `fdiff_month`, `followers`, `name`, `peak_position`, `removed_at` (default) |

        | amazon | current | `added_at` (default), `countries`, `name`, `peak_position` |

        | amazon | past | `added_at`, `peak_position`, `removed_at` (default) |

        | soundcloud | current | `added_at`, `fdiff_month`, `likes`, `peak_position` |

        | soundcloud | past | `added_at`, `fdiff_month`, `likes`, `peak_position` |


        **Boolean flag parameters supported per platform:**


        | Flag | spotify | applemusic | deezer | amazon |

        |---|:---:|:---:|:---:|:---:|

        | `editorial` | ✅ | ✅ | ✅ | |

        | `editorialBrand` | | ✅ | | |

        | `personalized` | ✅ | | | |

        | `deezerPartner` | | | ✅ | |

        | `chart` | ✅ | ✅ | ✅ | |

        | `thisIs` | ✅ | | | |

        | `hundredPercent` | | | ✅ | |

        | `newMusicFriday` | ✅ | | | |

        | `radio` | ✅ | ✅ | | |

        | `fullyPersonalized` | ✅ | | | |

        | `brand` | ✅ | | ✅ | |

        | `majorCurator` | ✅ | | ✅ | |

        | `musicBrand` | | ✅ | | |

        | `nonMusicBrand` | | ✅ | | |

        | `popularIndie` | ✅ | | ✅ | |

        | `indie` | ✅ | ✅ | ✅ | |

        | `audiobook` | ✅ | | | |

        | `personalityArtist` | | ✅ | | |


        Amazon does not accept any flags. Flags are not mutually exclusive — pass others as `false` to scope to one. When no flags are specified the API may return an empty array; specify flags explicitly to get data.'
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric track ID.
        required: true
        description: Chartmetric track ID.
        examples:
          default:
            value: 1
      - name: platform
        in: path
        schema:
          type: string
          enum:
          - spotify
          - applemusic
          - deezer
          - amazon
          - soundcloud
          description: Streaming platform. One of `spotify`, `applemusic` (aliased to `itunes`), `deezer`, `amazon`, `soundcloud`.
        required: true
        description: Streaming platform. One of `spotify`, `applemusic` (aliased to `itunes`), `deezer`, `amazon`, `soundcloud`.
        examples:
          default:
            value: spotify
      - name: status
        in: path
        schema:
          type: string
          enum:
          - current
          - past
          description: Whether to return playlists the track is `current`ly on or has been removed from (`past`).
        required: true
        description: Whether to return playlists the track is `current`ly on or has been removed from (`past`).
        examples:
          default:
            value: current
      - name: since
        in: query
        schema:
          type: string
          format: date
          description: Inclusive start of the added/removed-at date range in `YYYY-MM-DD` format. Defaults to 180 days before today.
          default: '2026-04-22'
        required: false
        description: Inclusive start of the added/removed-at date range in `YYYY-MM-DD` format. Defaults to 180 days before today.
      - name: until
        in: query
        schema:
          type: string
          format: date
          description: Inclusive end of the added/removed-at date range in `YYYY-MM-DD` format. Defaults to today.
          default: '2026-10-19'
        required: false
        description: Inclusive end of the added/removed-at date range in `YYYY-MM-DD` format. Defaults to today.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
        required: false
        description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
      - name: limit
        in: query
        schema:
