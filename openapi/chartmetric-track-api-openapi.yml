openapi: 3.2.0
info:
  title: Chartmetric Developer Track API
  description: 'Public API documentation for the Chartmetric Developer API.


    ## Credit consumption


    On the Prepaid API plan every request consumes API credits. Most endpoints cost

    **1 credit** per request. Premium endpoints — labelled `💎 Premium` in their title —

    return higher-cost audience and playlist data and consume **2 credits** per request:


    - `GET /api/artist/{id}/instagram-audience-stats`

    - `GET /api/artist/{id}/instagram-audience-stats/dates`

    - `GET /api/artist/{id}/social-audience-stats`

    - `GET /api/artist/{id}/tiktok-audience-stats`

    - `GET /api/artist/{id}/tiktok-influencer-stats`

    - `GET /api/artist/{id}/tiktok-top-influencers`

    - `GET /api/artist/{id}/tiktok-top-videos`

    - `GET /api/artist/{id}/where-people-listen`

    - `GET /api/artist/{id}/youtube-audience-stats`

    - `GET /api/artist/{id}/{platform}/{status}/playlists`

    - `GET /api/brand/v2/{brandId}/audience`

    - `GET /api/track/{id}/tiktok-influencer-stats`

    - `GET /api/track/{id}/tiktok-top-influencers`

    - `GET /api/track/{id}/tiktok-top-sounds`

    - `GET /api/track/{id}/topVideos`


    Credits are deducted when the request is received, regardless of the number of rows

    returned. Your remaining balance and the current per-endpoint costs are shown in your

    Chartmetric account under Settings → API Usage. Fixed-rate monthly API plans are not

    billed per request; they are limited by their request rate instead.'
  version: 1.0.1589
  contact:
    name: Chartmetric API Support
    email: backend-engineering@chartmetric.com
servers:
- url: https://api.chartmetric.com
  description: Production
security:
- BearerAuth: []
tags:
- name: Track
  description: Tracks (recordings), identified by a Chartmetric track ID or a platform ID such as an ISRC or Spotify ID. Endpoints cover track metadata, cross-platform ID lookup, per-platform stats, chart appearances, playlist placements and dated snapshots, playlist stream estimates (single and batch), related tracks, milestones, filtered track lists, and TikTok video and YouTube Shorts performance.
paths:
  /api/track/playlist-stream-estimates:
    post:
      summary: Get Batch Playlist Stream Estimates
      tags:
      - Track
      operationId: getBatchPlaylistStreamEstimates
      description: 'Return per-track availability and playlist stream estimates for a batch of track IDs. Missing tracks are returned with `status: "not_found"` rather than failing the whole request.'
      parameters:
      - name: date
        in: query
        schema:
          type: string
          format: date
          description: Snapshot date in YYYY-MM-DD format. Mutually exclusive with `since`/`until`. Omit all of `date`/`since`/`until` to get the latest available snapshot.
        required: false
        description: Snapshot date in YYYY-MM-DD format. Mutually exclusive with `since`/`until`. Omit all of `date`/`since`/`until` to get the latest available snapshot.
      - name: since
        in: query
        schema:
          type: string
          format: date
          description: Start of the weekly snapshot history range in YYYY-MM-DD format.
        required: false
        description: Start of the weekly snapshot history range in YYYY-MM-DD format.
      - name: until
        in: query
        schema:
          type: string
          format: date
          description: End of the weekly snapshot history range in YYYY-MM-DD format.
        required: false
        description: End of the weekly snapshot history range in YYYY-MM-DD format.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 2147483647
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  description: One or more Chartmetric track IDs.
                  examples:
                  - - 1
              required:
              - ids
              additionalProperties: false
              examples:
              - ids:
                - 1
            examples:
              default:
                value:
                  ids:
                  - 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        cm_track:
                          type: integer
                          minimum: 0
                          maximum: 2147483647
                        status:
                          type: string
                          enum:
                          - available
                          - not_found
                        estimates:
                          type: array
                          items:
                            type: object
                            properties:
                              cm_track:
                                type: integer
                                minimum: 0
                                maximum: 2147483647
                                description: Chartmetric track ID.
                              timestp:
                                type: string
                                description: Weekly snapshot date in YYYY-MM-DD format.
                              playlist_stream_pct:
                                type: number
                                format: float
                                minimum: 0
                                maximum: 100
                                description: Estimated percentage of streams generated by playlists.
                              playlist_count:
                                type: integer
                                minimum: 0
                                description: Number of playlists contributing.
                              expected_playlist_streams:
                                type: number
                                format: float
                                minimum: 0
                                description: Estimated streams generated by playlists.
                              streams_gained_in_period:
                                type: number
                                format: float
                                minimum: 0
                                description: Spotify streams gained during the trailing 28-day model window.
                              expected_editorial:
                                type: number
                                format: float
                                minimum: 0
                                description: Estimated editorial playlist streams.
                              expected_chart:
                                type: number
                                format: float
                                minimum: 0
                                description: Estimated chart playlist streams.
                              expected_user_other:
                                type: number
                                format: float
                                minimum: 0
                                description: Estimated user and other playlist streams.
                            required:
                            - cm_track
                            - timestp
                            - playlist_stream_pct
                            - playlist_count
                            - expected_playlist_streams
                            - streams_gained_in_period
                            - expected_editorial
                            - expected_chart
                            - expected_user_other
                            additionalProperties: false
                      required:
                      - cm_track
                      - status
                      - estimates
                      additionalProperties: false
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - cm_track: 141777092
                      status: available
                      estimates:
                      - cm_track: 141777092
                        timestp: '2026-07-11'
                        playlist_stream_pct: 58.11359808113311
                        playlist_count: 17982
                        expected_playlist_streams: 203672324
                        streams_gained_in_period: 72672055
                        expected_editorial: 113511005
                        expected_chart: 12482763
                        expected_user_other: 77678556
  /api/track/{id}/playlist-stream-estimates:
    get:
      summary: Get Playlist Stream Estimates
      tags:
      - Track
      operationId: getTrackPlaylistStreamEstimates
      description: 'Return the latest weekly snapshot for a track when no query params are supplied, one requested snapshot via `date`, or all weekly snapshots in a `since`/`until` range. Each row describes a trailing 28-day estimate as of its snapshot date. Returns 404 when no matching snapshot exists — this table is populated incrementally, so a 404 here does not necessarily mean the track ID is invalid. The message distinguishes the two cases: an unfiltered request (no `date`/`since`/`until`) reports the track has no estimate computed yet at all, while a filtered request reports only that nothing matches the requested date or range (the track may still have estimates outside it).'
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
        required: true
        examples:
          default:
            value: 1
      - name: date
        in: query
        schema:
          type: string
          format: date
          description: Snapshot date in YYYY-MM-DD format. Mutually exclusive with `since`/`until`. Omit all of `date`/`since`/`until` to get the latest available snapshot.
        required: false
        description: Snapshot date in YYYY-MM-DD format. Mutually exclusive with `since`/`until`. Omit all of `date`/`since`/`until` to get the latest available snapshot.
      - name: since
        in: query
        schema:
          type: string
          format: date
          description: Start of the weekly snapshot history range in YYYY-MM-DD format.
        required: false
        description: Start of the weekly snapshot history range in YYYY-MM-DD format.
      - name: until
        in: query
        schema:
          type: string
          format: date
          description: End of the weekly snapshot history range in YYYY-MM-DD format.
        required: false
        description: End of the weekly snapshot history range in YYYY-MM-DD format.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    anyOf:
                    - type: object
                      properties:
                        cm_track:
                          type: integer
                          minimum: 0
                          maximum: 2147483647
                          description: Chartmetric track ID.
                        timestp:
                          type: string
                          description: Weekly snapshot date in YYYY-MM-DD format.
                        playlist_stream_pct:
                          type: number
                          format: float
                          minimum: 0
                          maximum: 100
                          description: Estimated percentage of streams generated by playlists.
                        playlist_count:
                          type: integer
                          minimum: 0
                          description: Number of playlists contributing.
                        expected_playlist_streams:
                          type: number
                          format: float
                          minimum: 0
                          description: Estimated streams generated by playlists.
                        streams_gained_in_period:
                          type: number
                          format: float
                          minimum: 0
                          description: Spotify streams gained during the trailing 28-day model window.
                        expected_editorial:
                          type: number
                          format: float
                          minimum: 0
                          description: Estimated editorial playlist streams.
                        expected_chart:
                          type: number
                          format: float
                          minimum: 0
                          description: Estimated chart playlist streams.
                        expected_user_other:
                          type: number
                          format: float
                          minimum: 0
                          description: Estimated user and other playlist streams.
                      required:
                      - cm_track
                      - timestp
                      - playlist_stream_pct
                      - playlist_count
                      - expected_playlist_streams
                      - streams_gained_in_period
                      - expected_editorial
                      - expected_chart
                      - expected_user_other
                      additionalProperties: false
                    - type: array
                      items:
                        type: object
                        properties:
                          cm_track:
                            type: integer
                            minimum: 0
                            maximum: 2147483647
                            description: Chartmetric track ID.
                          timestp:
                            type: string
                            description: Weekly snapshot date in YYYY-MM-DD format.
                          playlist_stream_pct:
                            type: number
                            format: float
                            minimum: 0
                            maximum: 100
                            description: Estimated percentage of streams generated by playlists.
                          playlist_count:
                            type: integer
                            minimum: 0
                            description: Number of playlists contributing.
                          expected_playlist_streams:
                            type: number
                            format: float
                            minimum: 0
                            description: Estimated streams generated by playlists.
                          streams_gained_in_period:
                            type: number
                            format: float
                            minimum: 0
                            description: Spotify streams gained during the trailing 28-day model window.
                          expected_editorial:
                            type: number
                            format: float
                            minimum: 0
                            description: Estimated editorial playlist streams.
                          expected_chart:
                            type: number
                            format: float
                            minimum: 0
                            description: Estimated chart playlist streams.
                          expected_user_other:
                            type: number
                            format: float
                            minimum: 0
                            description: Estimated user and other playlist streams.
                        required:
                        - cm_track
                        - timestp
                        - playlist_stream_pct
                        - playlist_count
                        - expected_playlist_streams
                        - streams_gained_in_period
                        - expected_editorial
                        - expected_chart
                        - expected_user_other
                        additionalProperties: false
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      cm_track: 141777092
                      timestp: '2026-07-11'
                      playlist_stream_pct: 58.11359808113311
                      playlist_count: 17982
                      expected_playlist_streams: 203672324
                      streams_gained_in_period: 72672055
                      expected_editorial: 113511005
                      expected_chart: 12482763
                      expected_user_other: 77678556
  /api/track/{id}/video-trends:
    get:
      summary: Get TikTok Video Trends for a Track
      tags:
      - Track
      operationId: getTrackVideoTrends
      description: Return the history of likes, comments, and views for a TikTok video over time. `id` here is a TikTok video internal ID, not a Chartmetric track ID.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          description: TikTok video internal ID (not a Chartmetric track ID). Identifies the specific video to retrieve trends for.
        required: true
        description: TikTok video internal ID (not a Chartmetric track ID). Identifies the specific video to retrieve trends for.
        examples:
          default:
            value: 1
      - name: fromDaysAgo
        in: query
        schema:
          type: integer
          description: Number of days before today at which the trend window starts. Defaults to 28.
          default: 28
        required: false
        description: Number of days before today at which the trend window starts. Defaults to 28.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        timestp:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Timestamp of the data point in ISO-8601 form.
                        likes:
                          type:
                          - integer
                          - 'null'
                          description: Cumulative likes count at this timestamp.
                        comments:
                          type:
                          - integer
                          - 'null'
                          description: Cumulative comments count at this timestamp.
                        views:
                          type:
                          - integer
                          - 'null'
                          description: Cumulative views count at this timestamp.
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - timestp: '2023-05-30T00:00:00.000Z'
                      likes: 72500
                      comments: 222
                      views: 411800
  /api/track/{id}/{type}/charts:
    get:
      summary: List Chart Appearances for a Track
      tags:
      - Track
      operationId: listTrackCharts
      description: 'Return chart records for this track across the supported platforms: Spotify (`spotify_viral_daily`, `spotify_viral_weekly`, `spotify_top_daily`, `spotify_top_weekly`), Apple Music (`applemusic_top`, `applemusic_daily`, `applemusic_albums`), iTunes (`itunes_top`, `itunes_albums`), Airplay (`airplay_daily`, `airplay_weekly`), Amazon, Shazam, Beatport, and SoundCloud.'
      parameters:
      - name: type
        in: path
        schema:
          type: string
          enum:
          - spotify_viral_daily
          - spotify_viral_weekly
          - spotify_top_daily
          - spotify_top_weekly
          - applemusic_top
          - applemusic_daily
          - applemusic_albums
          - itunes_top
          - itunes_albums
          - shazam
          - beatport
          - youtube
          - youtube_tracks
          - youtube_videos
          - youtube_trends
          - amazon
          - soundcloud
          - airplay_weekly
          - airplay_daily
          description: Chart variant to fetch. Combines platform with chart family/duration (e.g. `spotify_top_daily`, `applemusic_albums`, `airplay_weekly`, `shazam`, `amazon`).
        required: true
        description: Chart variant to fetch. Combines platform with chart family/duration (e.g. `spotify_top_daily`, `applemusic_albums`, `airplay_weekly`, `shazam`, `amazon`).
        examples:
          default:
            value: spotify_viral_daily
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric track ID.
        required: true
        description: Chartmetric track ID.
        examples:
          default:
            value: 1
      - name: since
        in: query
        schema:
          type: string
          format: date
          description: Inclusive start date for the chart window in `YYYY-MM-DD` format. Defaults to 180 days before today.
          default: '2026-04-22'
        required: true
        description: Inclusive start date for the chart window in `YYYY-MM-DD` format. Defaults to 180 days before today.
        examples:
          default:
            value: '2026-04-22'
      - name: until
        in: query
        schema:
          type: string
          format: date
          description: Inclusive end date for the chart window in `YYYY-MM-DD` format. Defaults to today.
          default: '2026-10-19'
        required: false
        description: Inclusive end date for the chart window in `YYYY-MM-DD` format. Defaults to today.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type:
                    - object
                    - 'null'
                    properties:
                      data:
                        type:
                        - array
                        - 'null'
                        items:
                          type: object
                          properties:
                            rank:
                              type:
                              - integer
                              - 'null'
                              description: Chart rank (lower is better; 1 = top of chart).
                            added_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Timestamp of when this chart row was recorded.
                            code2:
                              type:
                              - string
                              - 'null'
                              description: ISO 3166-1 alpha-2 country code of the chart, or 'GLOBAL'.
                            plays:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              description: Plays attributed to the track on the chart day.
                            duration:
                              type:
                              - string
                              - 'null'
                              description: Chart cadence (e.g. 'daily', 'weekly').
                            chart_type:
                              type:
                              - string
                              - 'null'
                              description: Chart family within the platform (e.g. 'regional', 'viral', 'top').
                            gnp:
                              type:
                              - string
                              - 'null'
                              description: Genre/Niche/Period tag identifying the chart slice (platform-specific).
                            pre_rank:
                              type:
                              - integer
                              - 'null'
                              description: Rank on the previous chart period.
                            peak_rank:
                              type:
                              - integer
                              - 'null'
                              description: Best (lowest-numbered) rank achieved across all observed days.
                            peak_date:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Date when `peak_rank` was achieved.
                            peak_plays:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              description: Plays recorded on `peak_date`.
                            total_plays:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              description: Cumulative plays across all observed chart days.
                            id:
                              type: integer
                              description: Chartmetric track ID.
                            cm_track:
                              type: integer
                              description: Chartmetric track ID. Same value as `id`.
                            name:
                              type:
                              - string
                              - 'null'
                              description: Track title.
                            isrc:
                              type:
                              - string
                              - 'null'
                              description: International Standard Recording Code identifying the recording.
                            image_url:
                              type:
                              - string
                              - 'null'
                              description: URL of the track artwork.
                            spotify_popularity:
                              type:
                              - integer
                              - 'null'
                              description: Spotify popularity score (0–100, higher is more popular).
                            spotify_duration_ms:
                              type:
                              - integer
                              - 'null'
                              description: Track duration on Spotify in milliseconds.
                            cm_artist:
                              type:
                              - array
                              - 'null'
                              items:
                                type: integer
                                minimum: 0
                                maximum: 2147483647
                              description: Chartmetric artist IDs of the credited artists, ordered by main-artist-first.
                            artist_names:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Display names of the credited artists, aligned with `cm_artist`.
                            spotify_artist_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Spotify artist IDs of the credited artists.
                            spotify_artist_names:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Spotify display names of the credited artists.
                            spotify_track_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Spotify track IDs linked to this Chartmetric track.
                            spotify_album_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Spotify album IDs containing this track.
                            itunes_artist_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: iTunes/Apple Music artist IDs of the credited artists.
                            itunes_artist_names:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: iTunes/Apple Music display names of the credited artists.
                            itunes_track_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: iTunes/Apple Music track IDs linked to this Chartmetric track.
                            itunes_album_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: iTunes/Apple Music album IDs containing this track.
                            code2s:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: ISO 3166-1 alpha-2 country codes associated with the credited artists (e.g. 'US', 'BR').
                            artist_images:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Profile image URLs of the credited artists.
                            artist_covers:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Cover/banner image URLs of the credited artists.
                            album_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - integer
                                - 'null'
                              description: Chartmetric album IDs that contain this track.
                            album_names:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Album titles aligned with `album_ids`.
                            album_upc:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Universal Product Codes for the albums in `album_ids`.
                            album_label:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Record labels for the albums in `album_ids`.
                            release_dates:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Release dates for the albums in `album_ids`, in `YYYY-MM-DD` or ISO-8601 form.
                            storefronts:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Apple Music storefront codes where the track was charted.
                            track_genre:
                              anyOf:
                              - type: string
                              - type: array
                                items: {}
                              nullable: true
                              description: Genre labels for the track. Either a comma-separated string or an array, depending on source.
                        description: Chart rows for the track within the requested date window. Null when the track has no records on the chart.
                      length:
                        type: integer
                        minimum: 0
                        description: Number of entries in `data`.
                    required:
                    - length
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      data:
                      - rank: 104
                        added_at: '2020-03-04T08:00:00.000Z'
                        code2: GLOBAL
                        plays: 1084704
                        duration: daily
                        chart_type: regional
                        gnp: null
                        pre_rank: 105
                        peak_rank: 1
                        peak_date: '2019-02-08T08:00:00.000Z'
                        peak_plays: 10445538
                        total_plays: 1033605669
                        name: 7 rings
