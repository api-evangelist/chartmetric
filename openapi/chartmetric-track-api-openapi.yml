  /api/track/{id}/{platform}/stats/{mode}:
    get:
      summary: Get Track Stats by Platform
      tags:
      - Track
      operationId: getTrackStats
      description: Return historical stats for a track on a platform. `mode` selects the aggregation bucket. `platform` accepts `chartmetric`, `spotify`, `youtube`, `tiktok`, etc. `type` query param selects the stat column (e.g. `streams`, `popularity`). Wrapped in a single-element array under `obj`.
      parameters:
      - name: platform
        in: path
        schema:
          type: string
          enum:
          - shazam
          - spotify
          - youtube
          - tiktok
          - genius
          - soundcloud
          - chartmetric
          - line
          - melon
          - radio
          description: Streaming platform whose stats to retrieve. One of `shazam`, `spotify`, `youtube`, `tiktok`, `genius`, `soundcloud`, `chartmetric`, `line`, `melon`, `radio`.
        required: true
        description: Streaming platform whose stats to retrieve. One of `shazam`, `spotify`, `youtube`, `tiktok`, `genius`, `soundcloud`, `chartmetric`, `line`, `melon`, `radio`.
        examples:
          default:
            value: shazam
      - name: id
        in: path
        schema:
          anyOf:
          - anyOf:
            - type: integer
              x-required: true
            - type: string
              x-required: true
          - type: integer
            minimum: 1
            x-required: true
          description: Track identifier. By default a Chartmetric track ID; if `isDomainId=true`, a platform-native ID (numeric for `shazam`/`genius`, string for others).
        required: true
        description: Track identifier. By default a Chartmetric track ID; if `isDomainId=true`, a platform-native ID (numeric for `shazam`/`genius`, string for others).
        examples:
          default:
            value: 1
      - name: mode
        in: path
        schema:
          type: string
          enum:
          - highest-playcounts
          - most-history
          description: Selection algorithm when multiple platform tracks map to one Chartmetric track. `highest-playcounts` picks the most-played; `most-history` picks the longest-tracked.
        required: true
        description: Selection algorithm when multiple platform tracks map to one Chartmetric track. `highest-playcounts` picks the most-played; `most-history` picks the longest-tracked.
        examples:
          default:
            value: highest-playcounts
      - name: since
        in: query
        schema:
          type: string
          format: date
          description: Inclusive start of the stat date range in `YYYY-MM-DD` format. Defaults to 180 days before today.
          default: '2026-04-22'
        required: false
        description: Inclusive start of the stat date range in `YYYY-MM-DD` format. Defaults to 180 days before today.
      - name: type
        in: query
        schema:
          anyOf:
          - type: string
            enum:
            - total_spins
            default: total_spin
          - type: string
            enum:
            - listen_count
            - artist_likes
            default: listen_count
          - type: string
            enum:
            - likes_melon
            default: likes_melon
          - type: string
            enum:
            - streams
            - popularity
            default: popularity
          - type: string
            enum:
            - score
            - rank
            default: score
          - type: string
            enum:
            - posts
            - views
            - comments
            - sound_posts
            - sound_views
            - sound_likes
            - sound_comments
            default: posts
          - type: string
          description: Stat column to retrieve; allowed values depend on `platform` (e.g. spotify → `streams`/`popularity`; tiktok → `posts`/`views`/`sound_*`). Each platform has a default.
        required: false
        description: Stat column to retrieve; allowed values depend on `platform` (e.g. spotify → `streams`/`popularity`; tiktok → `posts`/`views`/`sound_*`). Each platform has a default.
      - name: until
        in: query
        schema:
          type: string
          format: date
          description: Inclusive end of the stat date range in `YYYY-MM-DD` format. Defaults to today.
          default: '2026-10-19'
        required: false
        description: Inclusive end of the stat date range in `YYYY-MM-DD` format. Defaults to today.
      - name: latest
        in: query
        schema:
          type: boolean
          description: If true, return only the most recent data point regardless of `since`/`until`.
        required: false
        description: If true, return only the most recent data point regardless of `since`/`until`.
      - name: interpolated
        in: query
        schema:
          type: boolean
          description: If true, fill gaps in the time series with interpolated values to produce a smooth curve. Not applicable for Spotify.
        required: false
        description: If true, fill gaps in the time series with interpolated values to produce a smooth curve. Not applicable for Spotify.
      - name: isDomainId
        in: query
        schema:
          type: boolean
          description: If true, treat `id` as a platform-native ID rather than a Chartmetric track ID. Defaults to false.
          default: false
        required: false
        description: If true, treat `id` as a platform-native ID rather than a Chartmetric track ID. Defaults to false.
      - name: extrapolated
        in: query
        schema:
          type: string
          enum:
          - before
          - after
          - both
          description: Extrapolation mode for projecting values outside the observed range. One of `before`, `after`, `both`.
        required: false
        description: Extrapolation mode for projecting values outside the observed range. One of `before`, `after`, `both`.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        domain:
                          type: string
                          description: Streaming platform that produced the stats (e.g. 'spotify', 'youtube').
                        track_domain_id:
                          type:
                          - string
                          - 'null'
                          description: Native track ID on `domain`.
                        type:
                          type:
                          - string
                          - 'null'
                          description: Stat column returned (e.g. 'streams', 'popularity', 'posts').
                        data:
                          type:
                          - array
                          - 'null'
                          items:
                            type: object
                            properties:
                              value:
                                anyOf:
                                - type: number
                                  format: float
                                - type: string
                                nullable: true
                                description: Stat value at the timestamp. May arrive as numeric or string for large counters.
                              timestp:
                                type:
                                - string
                                - 'null'
                                format: date-time
                                description: Timestamp of the data point in ISO-8601 form.
                              daily_diff:
                                type:
                                - number
                                - 'null'
                                format: float
                                description: Day-over-day change in `value`. Not applicable for Spotify.
                              interpolated:
                                type: boolean
                                description: True if `value` was interpolated to fill a gap rather than observed directly. Not applicable for Spotify.
                          description: Time series of stat values for the track on the platform.
                      required:
                      - domain
                    minItems: 1
                    maxItems: 1
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - domain: spotify
                      track_domain_id: 55n9yjI6qqXh5F2mYvUc2y
                      type: streams
                      data:
                      - value: 80
                        timestp: '2022-01-01T00:00:00.000Z'
                      - value: 80
                        timestp: '2022-01-02T00:00:00.000Z'
  /api/track/youtube/{id}/topShorts:
    get:
