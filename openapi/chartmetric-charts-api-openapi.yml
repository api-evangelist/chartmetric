  /api/charts/soundcloud/track/{chartType}:
    get:
      summary: SoundCloud Track Chart
      tags:
      - Charts
      operationId: getSoundcloudTrackCharts
      description: Return the new SoundCloud track chart entries (deprecates the legacy `/charts/soundcloud` endpoint). SoundCloud now only publishes chart data for `US` and `UK`. Rows include `isrc`, `externalId`, `optionalFields` (vs `optionalRows` on other platforms), and `entityGenre`.
      parameters:
      - name: chartType
        in: path
        schema:
          type: string
          enum:
          - top
          description: SoundCloud chart type; only `top` is currently published.
        required: true
        description: SoundCloud chart type; only `top` is currently published.
        examples:
          default:
            value: top
      - name: code2
        in: query
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 2
            description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
          - type: string
            enum:
            - GLOBAL
          description: ISO 3166-1 alpha-2 country code (uppercase, e.g. 'US') or 'GLOBAL'. When omitted, the platform's default chart scope applies.
        required: true
        description: ISO 3166-1 alpha-2 country code (uppercase, e.g. 'US') or 'GLOBAL'. When omitted, the platform's default chart scope applies.
        examples:
          default:
            value: US
      - name: genre
        in: query
        schema:
          type: string
          maxLength: 100
          description: Chart genre. Use `/api/charts/genres/soundcloud?code2={code2}` to retrieve available genres for a country.
        required: true
        description: Chart genre. Use `/api/charts/genres/soundcloud?code2={code2}` to retrieve available genres for a country.
        examples:
          default:
            value: example
      - name: date
        in: query
        schema:
          anyOf:
          - type: string
            format: date-time
            x-required: true
          description: Date for the time-slice (YYYY-MM-DD). Required unless `latest=true`.
        required: false
        description: Date for the time-slice (YYYY-MM-DD). Required unless `latest=true`.
      - name: latest
        in: query
        schema:
          type: boolean
          description: If true, use the most recently available date and ignore `date`.
        required: false
        description: If true, use the most recently available date and ignore `date`.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          description: Maximum number of items to return per request.
          default: 100
        required: false
        description: Maximum number of items to return per request.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
        required: false
        description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
