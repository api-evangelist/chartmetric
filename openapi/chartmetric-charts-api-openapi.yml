openapi: 3.2.0
info:
  title: Chartmetric Developer Charts API
  description: 'Public API documentation for the Chartmetric Developer API.


    ## Credit consumption


    On the Prepaid API plan every request consumes API credits. Most endpoints cost

    **1 credit** per request. Premium endpoints — labelled `💎 Premium` in their title —

    return higher-cost audience and playlist data and consume **2 credits** per request:


    - `GET /api/artist/{id}/instagram-audience-stats`

    - `GET /api/artist/{id}/instagram-audience-stats/dates`

    - `GET /api/artist/{id}/social-audience-stats`

    - `GET /api/artist/{id}/tiktok-audience-stats`

    - `GET /api/artist/{id}/tiktok-influencer-stats`

    - `GET /api/artist/{id}/tiktok-top-influencers`

    - `GET /api/artist/{id}/tiktok-top-videos`

    - `GET /api/artist/{id}/where-people-listen`

    - `GET /api/artist/{id}/youtube-audience-stats`

    - `GET /api/artist/{id}/{platform}/{status}/playlists`

    - `GET /api/brand/v2/{brandId}/audience`

    - `GET /api/track/{id}/tiktok-influencer-stats`

    - `GET /api/track/{id}/tiktok-top-influencers`

    - `GET /api/track/{id}/tiktok-top-sounds`

    - `GET /api/track/{id}/topVideos`


    Credits are deducted when the request is received, regardless of the number of rows

    returned. Your remaining balance and the current per-endpoint costs are shown in your

    Chartmetric account under Settings → API Usage. Fixed-rate monthly API plans are not

    billed per request; they are limited by their request rate instead.'
  version: 1.0.1589
  contact:
    name: Chartmetric API Support
    email: backend-engineering@chartmetric.com
servers:
- url: https://api.chartmetric.com
  description: Production
security:
- BearerAuth: []
tags:
- name: Charts
  description: Charts collected from streaming, social and radio platforms — Spotify, Apple Music, iTunes, Amazon, Deezer, YouTube, TikTok, Shazam, Beatport, SoundCloud, Twitch, Pandora, Anghami, QQ Music and regional charts such as Circle, Hanteo, Melon and Line Music. Endpoints return chart rankings per platform and entity type (artist, track, album, video, sound, user), the Chartmetric score of a charted entity, and the supporting lookups for available chart dates, countries and genres.
paths:
  /api/charts/{byType}/{id}/{chartType}/cm-score:
    get:
      summary: Get Chartmetric Score
      tags:
      - Charts
      operationId: getChartsCmScore
      description: 'Chartmetric Score reflects the overall trend for tracks or albums, computed from weighted chart-rank positions across countries over time. Supported `byType` values are `artist`, `track`, `album` depending on `chartType`. Supported `chartType` values are `spotify-top`, `spotify-viral`, `applemusic-genre`, `applemusic-daily`, `applemusic-albums`, `itunes`, `itunes_albums`, `shazam`. Response carries two parallel views of the score timeline: `overall` (aggregate) and `individual` (per-track/per-album).'
      parameters:
      - name: byType
        in: path
        schema:
          type: string
          enum:
          - artist
          - track
          - album
          description: Entity kind that `:id` refers to (one of `artist | track | album`); must match the chosen `chartType`.
        required: true
        description: Entity kind that `:id` refers to (one of `artist | track | album`); must match the chosen `chartType`.
        examples:
          default:
            value: artist
      - name: chartType
        in: path
        schema:
          type: string
          enum:
          - spotify-top
          - spotify-viral
          - applemusic-genre
          - applemusic-daily
          - applemusic-albums
          - itunes
          - itunes_albums
          - shazam
          description: Chart whose Chartmetric Score is computed. One of `spotify-top`, `spotify-viral`, `applemusic-genre`, `applemusic-daily`, `applemusic-albums`, `itunes`, `itunes_albums`, `shazam`.
        required: true
        description: Chart whose Chartmetric Score is computed. One of `spotify-top`, `spotify-viral`, `applemusic-genre`, `applemusic-daily`, `applemusic-albums`, `itunes`, `itunes_albums`, `shazam`.
        examples:
          default:
            value: spotify-top
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric ID for the entity in `:byType` (artist / track / album ID).
        required: true
        description: Chartmetric ID for the entity in `:byType` (artist / track / album ID).
        examples:
          default:
            value: 1
      - name: since
        in: query
        schema:
          type: string
          format: date
          description: Start of the score time range (ISO date, e.g. `2025-11-01`); defaults to 180 days ago.
          default: '2026-04-22'
        required: false
        description: Start of the score time range (ISO date, e.g. `2025-11-01`); defaults to 180 days ago.
      - name: until
        in: query
        schema:
          type: string
          format: date
          description: End of the score time range (ISO date, e.g. `2025-11-01`); defaults to today.
        required: false
        description: End of the score time range (ISO date, e.g. `2025-11-01`); defaults to today.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      overall:
                        type: array
                        items:
                          type: object
                          properties:
                            x:
                              type:
                              - string
                              - 'null'
                              description: Date for the score sample (`YYYY-MM-DD`).
                            y:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Aggregate Chartmetric Score on that date.
                            count:
                              type:
                              - integer
                              - 'null'
                              description: Number of contributing chart rows aggregated into `y`.
                            details:
                              type:
                              - array
                              - 'null'
                              items:
                                type: object
                                properties:
                                  trackName:
                                    type:
                                    - string
                                    - 'null'
                                    description: Name of the track contributing to the score.
                                  trackId:
                                    type:
                                    - integer
                                    - 'null'
                                    description: Chartmetric track ID of the contributing track.
                                  details:
                                    type:
                                    - array
                                    - 'null'
                                    items:
                                      type: object
                                      properties:
                                        rank:
                                          type:
                                          - integer
                                          - 'null'
                                          description: Rank held by the track in the underlying chart.
                                        country:
                                          type:
                                          - string
                                          - 'null'
                                          description: Country code for the chart row.
                                        score:
                                          type:
                                          - number
                                          - 'null'
                                          format: float
                                          description: Per-row score contribution.
                                        genre:
                                          type:
                                          - string
                                          - 'null'
                                          description: Genre of the underlying chart.
                                    description: Per-country/per-genre breakdown for the contributing track.
                              description: List of tracks contributing to the aggregate score on this date.
                        description: Aggregate score timeline across all contributing chart rows.
                      individual:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type:
                              - integer
                              - 'null'
                              description: Chartmetric ID for the individual entity (track / album / artist).
                            name:
                              type:
                              - string
                              - 'null'
                              description: Entity name.
                            data:
                              type:
                              - array
                              - 'null'
                              items:
                                type: object
                                properties:
                                  timestp:
                                    type:
                                    - string
                                    - 'null'
                                    format: date-time
                                    description: Date of the per-entity score sample.
                                  score:
                                    type:
                                    - number
                                    - 'null'
                                    format: float
                                    description: Score contribution from the entity on `timestp`.
                                  rank_details:
                                    type:
                                    - array
                                    - 'null'
                                    items:
                                      type: object
                                      properties:
                                        rank:
                                          type:
                                          - integer
                                          - 'null'
                                          description: Rank held in the underlying chart.
                                        country:
                                          type:
                                          - string
                                          - 'null'
                                          description: Country code for the chart row.
                                        score:
                                          type:
                                          - number
                                          - 'null'
                                          format: float
                                          description: Per-row score contribution.
                                        genre:
                                          type:
                                          - string
                                          - 'null'
                                          description: Genre of the underlying chart.
                                    description: Per-country/per-genre breakdown of the per-entity score on `timestp`.
                              description: Per-entity score timeline.
                        description: Per-entity score timelines, one entry per contributing track / album / artist.
                    required:
                    - overall
                    - individual
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      overall:
                      - x: '2020-07-01'
                        y: 0.39
                        count: 1
                        details:
                        - trackName: Woke Up Late (feat. Hailee Steinfeld)
                          trackId: 22310714
                          details:
                          - rank: 180
                            country: AU
                            score: 0.39
                      individual:
                      - id: 22310714
                        name: Woke Up Late (feat. Hailee Steinfeld)
                        data:
                        - timestp: '2020-07-01T00:00:00.000Z'
                          score: 0.39
                          rank_details:
                          - rank: 180
                            country: AU
                            score: 0.39
  /api/charts/spotify:
    get:
      summary: Get Spotify Track Charts
      tags:
      - Charts
      operationId: getSpotifyCharts
      description: Return tracks charting on Spotify (Top 50, Viral 50, regional, or official-country charts) for a given date/interval. Each entry combines the chart row (`rank`, `peak_rank`, `rankStats`, etc.) with the track basic info (artists, albums, cross-platform IDs). `current_plays` and `rankStats.plays` are deprecated after 2022-06-02 and will be null for later rows.
      parameters:
      - name: country_code
        in: query
        schema:
          type: string
          minLength: 2
          maxLength: 6
          description: ISO 3166-1 alpha-2 country code (e.g. 'US', 'BR') or 'GLOBAL' for the global chart.
        required: true
        description: ISO 3166-1 alpha-2 country code (e.g. 'US', 'BR') or 'GLOBAL' for the global chart.
        examples:
          default:
            value: US
      - name: interval
        in: query
        schema:
          type: string
          description: Chart interval (e.g. `daily`, `weekly`).
        required: true
        description: Chart interval (e.g. `daily`, `weekly`).
        examples:
          default:
            value: example
      - name: type
        in: query
        schema:
          type: string
          enum:
          - plays
          - popularity
          - playlist_count
          - playlist_reach
          - viral
          - regional
          description: Spotify track chart type (e.g. `regional`, `top200`, `viral50`, `daily_top_tracks`, `weekly_top_tracks`).
        required: true
        description: Spotify track chart type (e.g. `regional`, `top200`, `viral50`, `daily_top_tracks`, `weekly_top_tracks`).
        examples:
          default:
            value: plays
      - name: date
        in: query
        schema:
          anyOf:
          - type: string
            format: date-time
            x-required: true
          description: Date for the time-slice (YYYY-MM-DD). Required unless `latest=true`.
        required: false
        description: Date for the time-slice (YYYY-MM-DD). Required unless `latest=true`.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
        required: false
        description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
      - name: latest
        in: query
        schema:
          type: boolean
          description: If true, use the most recently available date and ignore `date`.
        required: false
        description: If true, use the most recently available date and ignore `date`.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      length:
                        type: integer
                        minimum: 0
                        description: Number of chart rows in `data`.
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            rank:
                              type:
                              - integer
                              - 'null'
                              description: Current chart position (1 = top).
                            pre_rank:
                              type:
                              - integer
                              - 'null'
                              description: Position on the previous chart period.
                            peak_rank:
                              type:
                              - integer
                              - 'null'
                              description: Best (lowest-numbered) rank reached on this chart.
                            peak_date:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Date when `peak_rank` was achieved.
                            rank_1d_change:
                              type:
                              - integer
                              - 'null'
                              description: Rank change vs 1 day ago (negative = moved up).
                            rank_7d_change:
                              type:
                              - integer
                              - 'null'
                              description: Rank change vs 7 days ago (negative = moved up).
                            chart_name:
                              type:
                              - string
                              - 'null'
                              description: Human-readable chart name.
                            chart_type:
                              type:
                              - string
                              - 'null'
                              description: Chart variant (e.g. `regional`, `top`, `viral`).
                            code2:
                              type:
                              - string
                              - 'null'
                              description: Chart country code (ISO 3166-1 alpha-2, or platform-specific value).
                            timestp:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Timestamp of the chart row.
                            duration:
                              type:
                              - string
                              - 'null'
                              description: Chart duration window (e.g. `daily`, `weekly`, `monthly`).
                            added_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Timestamp the row was inserted into the chart cache.
                            velocity:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Rank-velocity signal computed from rank deltas (positive = climbing).
                            time_on_chart:
                              anyOf:
                              - type: string
                              - type: number
                                format: float
                              nullable: true
                              description: Length of time on the chart. Legacy SQL emits a duration string (e.g. `"3 days"`); CCC emits an integer count of periods.
                            country:
                              type:
                              - string
                              - 'null'
                              description: Full country name corresponding to `code2`.
                            genre:
                              type:
                              - string
                              - 'null'
                              description: Chart genre.
                            spotify:
                              type:
                              - integer
                              - 'null'
                              description: Internal Spotify chart row ID.
                            itunes:
                              type:
                              - integer
                              - 'null'
                              description: Internal iTunes chart row ID.
                            current_plays:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              description: Stream count at chart time. Stale on Spotify charts after 2022-06-02 and may be null for later rows.
                            rankStats:
                              type:
                              - array
                              - 'null'
                              items:
                                type: object
                                properties:
                                  timestp:
                                    type:
                                    - string
                                    - 'null'
                                    format: date-time
                                    description: Timestamp at which the rank was recorded.
                                  rank:
                                    type:
                                    - integer
                                    - 'null'
                                    description: Rank at `timestp` (1 = top).
                              description: Per-row historical rank samples.
                            id:
                              type:
                              - integer
                              - 'null'
                              description: Platform-specific row ID echoed back by the chart query (legacy).
                            name:
                              type:
                              - string
                              - 'null'
                              description: Track name.
                            isrc:
                              type:
                              - string
                              - 'null'
                              description: International Standard Recording Code.
                            image_url:
                              type:
                              - string
                              - 'null'
                              description: Track or album cover image URL.
                            cm_track:
                              type:
                              - integer
                              - 'null'
                              description: Chartmetric track ID.
                            track_genre:
                              anyOf:
                              - type: string
                              - type: array
                                items: {}
                              nullable: true
                              description: Track genre(s) — string or array of strings depending on the source.
                            spotify_popularity:
                              type:
                              - integer
                              - 'null'
                              description: Spotify popularity score (0–100).
                            spotify_duration_ms:
                              type:
                              - integer
                              - 'null'
                              description: Track duration on Spotify in milliseconds.
                            spotify_album_id:
                              type:
                              - string
                              - 'null'
                              description: Spotify album ID associated with the track.
                            composer_name:
                              type:
                              - string
                              - 'null'
                              description: Composer name(s).
                            cm_artist:
                              type:
                              - array
                              - 'null'
                              items:
                                type: integer
                                minimum: 0
                                maximum: 2147483647
                              description: Chartmetric artist IDs of the track artists.
                            artist_names:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Track artist names.
                            code2s:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: ISO 3166-1 alpha-2 country codes per artist.
                            artist_images:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Artist profile image URLs.
                            artist_covers:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Artist cover image URLs.
                            spotify_artist_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                anyOf:
                                - type: integer
                                - type: string
                                nullable: true
                              description: Spotify artist IDs of the track artists.
                            spotify_artist_names:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Spotify artist names.
                            spotify_track_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Spotify track IDs.
                            spotify_album_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Spotify album IDs.
                            itunes_artist_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                anyOf:
                                - type: integer
                                - type: string
                                nullable: true
                              description: iTunes artist IDs.
                            itunes_artist_names:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: iTunes artist names.
                            itunes_track_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: iTunes track IDs.
                            itunes_album_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: iTunes album IDs.
                            storefronts:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Apple Music storefront codes (ISO 3166-1 alpha-2 lowercased) where the track is available.
                            album_ids:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - integer
                                - 'null'
                              description: Chartmetric album IDs of the album(s) containing this track.
                            album_names:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Album names.
                            album_upc:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Album UPC (Universal Product Code) values.
                            album_label:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Record labels for the album(s).
                            release_dates:
                              type:
                              - array
                              - 'null'
                              items:
                                type:
                                - string
                                - 'null'
                              description: Album release dates.
                        description: Chart rows ordered by rank (1 = highest).
                    required:
                    - length
                    - data
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      length: 1
                      data:
                      - id: 4445159
                        name: What Ifs (feat. Lauren Alaina)
                        isrc: USRN11600859
                        image_url: https://i.scdn.co/image/3c29df3f40b15
                        cm_track: 15711334
                        rank: 1
                        pre_rank: 2
                        peak_rank: 1
                        peak_date: '2020-06-01T00:00:00.000Z'
                        added_at: '2020-06-01T00:00:00.000Z'
                        chart_type: regional
                        chart_name: Top Tracks
                        code2: US
                        current_plays: 1084704
                        time_on_chart: 3 days
                        spotify: 1
                        velocity: 0.25
                        rankStats:
                        - rank: 1
                          timestp: '2020-06-01T00:00:00.000Z'
                          plays: 1084704
                        spotify_artist_names:
                        - Kane Brown
                        - Lauren Alaina
                        track_genre: contemporary country,country
  /api/charts/spotify/artists:
    get:
      summary: Get Spotify Artist Charts
      tags:
      - Charts
      operationId: getSpotifyArtistCharts
      description: Return artists charting on Spotify (official daily/weekly/monthly artist charts). Each entry carries the artist basic info joined with the current chart position, streak, peak, and a short `rankStats` history. Handler strips the internal `cm_artist` field before returning.
      parameters:
      - name: date
        in: query
        schema:
          anyOf:
          - type: string
            format: date-time
            x-required: true
          description: Date for the time-slice (YYYY-MM-DD). Required unless `latest=true`.
        required: false
        description: Date for the time-slice (YYYY-MM-DD). Required unless `latest=true`.
      - name: interval
        in: query
        schema:
          type: string
          enum:
          - daily
          - weekly
          - monthly
          description: Chart interval (e.g. `daily`, `weekly`, `monthly`).
        required: true
        description: Chart interval (e.g. `daily`, `weekly`, `monthly`).
        examples:
          default:
            value: daily
      - name: type
        in: query
        schema:
          type: string
          enum:
          - monthly_listeners
          - popularity
          - followers
          - playlist_count
          - playlist_reach
          description: Spotify artist chart type (e.g. `top_artists`).
        required: true
        description: Spotify artist chart type (e.g. `top_artists`).
        examples:
          default:
            value: monthly_listeners
      - name: latest
        in: query
        schema:
          type: boolean
          description: If true, use the most recently available date and ignore `date`.
        required: false
        description: If true, use the most recently available date and ignore `date`.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
        required: false
        description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      length:
                        type: integer
                        minimum: 0
                        description: Number of chart rows in `data`.
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type:
                              - integer
                              - 'null'
                              description: Chartmetric artist ID.
                            name:
                              type:
                              - string
                              - 'null'
                              description: Artist name.
                            image_url:
                              type:
                              - string
                              - 'null'
                              description: Artist image URL.
                            isni:
                              type:
                              - string
                              - 'null'
                              description: International Standard Name Identifier (ISNI).
                            code2:
                              type:
                              - string
                              - 'null'
                              description: Artist country code (ISO 3166-1 alpha-2).
