  /api/charts/genres/{platform}:
    get:
      summary: List Chart Genres for Platform
      tags:
      - Charts
      operationId: listChartGenres
      description: 'Return the available chart genres for the given `platform` (optionally filtered by `code2`). Shape is highly platform-dependent — Amazon returns `[{ id, name }]`, Apple Music / iTunes / Beatport return hardcoded string arrays, SoundCloud / Anghami / Siriusxm return DB-backed string arrays, and Melon / Tencent return DB-backed object arrays. The envelope `{ obj: [...] }` is always a list but the element type varies per platform.'
      parameters:
      - name: platform
        in: path
        schema:
          type: string
          enum:
          - amazon
          - amazon_albums
          - apple_music
          - apple_music_albums
          - apple_music_videos
          - beatport
          - itunes
          - itunes_albums
          - itunes_videos
          - line_daily
          - melon_daily
          - melon_monthly
          - melon_weekly
          - melon_yearly
          - shazam_genre
          - soundcloud
          - soundcloud_legacy
          - soundcloud_trending
          - siriusxm
          - tencent_weekly
          - tencent_monthly
          - anghami
          - genius
          description: Chart platform whose genre list is returned (e.g. `amazon`, `applemusic`, `itunes`, `soundcloud`, `melon`).
        required: true
        description: Chart platform whose genre list is returned (e.g. `amazon`, `applemusic`, `itunes`, `soundcloud`, `melon`).
        examples:
          default:
            value: amazon
      - name: code2
        in: query
        schema:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
          default: US
        required: false
        description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type:
                    - array
                    - 'null'
                    items:
                      anyOf:
                      - type: string
                      - type: object
                        properties:
                          id:
                            anyOf:
                            - type: string
                            - type: number
                              format: float
                            nullable: true
                            description: Genre ID (Amazon, Melon, Tencent).
                          name:
                            type:
                            - string
                            - 'null'
                            description: Genre name.
                    description: List of available chart genres. Element is a string on most platforms; `{ id, name }` object on Amazon / Melon / Tencent.
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - all music genres
                    - artist pro
                    - dance
                    - folk
                    - hip hop
                    - indie
                    - new & hot
                    - next pro
                    - pop
                    - r&b
                    - rock
