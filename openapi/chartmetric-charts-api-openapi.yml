                        entityId:
                          type:
                          - integer
                          - 'null'
                          description: Internal Chartmetric entity ID.
                        targetId:
                          anyOf:
                          - type: string
                          - type: number
                            format: float
                          nullable: true
                          description: Platform-side track / album / user ID.
                        duration:
                          type:
                          - string
                          - 'null'
                          description: Chart duration window (e.g. `daily`, `weekly`, `monthly`).
                        country:
