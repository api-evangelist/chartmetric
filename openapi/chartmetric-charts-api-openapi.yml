  /api/charts/anghami/track/{chartType}:
    get:
      summary: Anghami Track Chart
      tags:
      - Charts
      operationId: getAnghamiTrackCharts
      description: Return Anghami track chart entries. `chartType` accepts `play` or `like`. Anghami stores both genre and country charts in a single table, so the handler defaults `code2` to `00` (global) and `genre` to `all genres` when unspecified. A single request may use either `genre` or `code2`, not both.
      parameters:
      - name: chartType
        in: path
        schema:
          type: string
          enum:
          - play
          - like
          description: Anghami track chart type (e.g. `play`, `like`).
        required: true
        description: Anghami track chart type (e.g. `play`, `like`).
        examples:
          default:
            value: play
      - name: date
        in: query
        schema:
          type: string
          format: date
          description: Date for the chart slice (`YYYY-MM-DD`). Required unless `latest=true`.
        required: false
        description: Date for the chart slice (`YYYY-MM-DD`). Required unless `latest=true`.
      - name: latest
        in: query
        schema:
          type: boolean
          description: If true, use the most recently available chart date and ignore `date`.
          default: false
        required: false
        description: If true, use the most recently available chart date and ignore `date`.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          description: Maximum number of items to return per request.
          default: 100
        required: false
        description: Maximum number of items to return per request.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
        required: false
        description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
      - name: code2
        in: query
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 2
            description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
          - type: string
            enum:
            - GLOBAL
          description: ISO 3166-1 alpha-2 country code (uppercase, e.g. 'US') or 'GLOBAL'. When omitted, the platform's default chart scope applies.
        required: true
        description: ISO 3166-1 alpha-2 country code (uppercase, e.g. 'US') or 'GLOBAL'. When omitted, the platform's default chart scope applies.
        examples:
          default:
            value: US
      - name: duration
        in: query
        schema:
          type: string
          enum:
          - daily
          - monthly
          - weekly
          - yearly
          - semi-yearly
          - real-time
          - all_time
          description: Chart duration window. One of `daily`, `monthly`, `weekly`, `yearly`, `semi-yearly`, `real-time`, `all_time`.
        required: false
        description: Chart duration window. One of `daily`, `monthly`, `weekly`, `yearly`, `semi-yearly`, `real-time`, `all_time`.
      - name: genre
        in: query
        schema:
          type: string
          maxLength: 100
          description: Genre filter for the chart slice. Lowercased and trimmed.
        required: true
        description: Genre filter for the chart slice. Lowercased and trimmed.
        examples:
          default:
            value: example
      - name: cityId
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric city ID to scope the chart to a city.
        required: false
        description: Chartmetric city ID to scope the chart to a city.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type:
                    - array
                    - 'null'
                    items:
                      type: object
                      properties:
                        entityId:
                          type:
                          - integer
                          - 'null'
