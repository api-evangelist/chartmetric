  /api/charts/shazam/{country_code}/cities:
    get:
      summary: Shazam Chart Cities
      tags:
      - Charts
      operationId: listShazamChartCities
      description: 'List of cities available for Shazam city-level filtering in a given country. Returns `cities: string[]` on success. When the country has no rows the handler returns `length: -1` and `cities: "Invalid Country or No Cities Found"` (legacy string fallback).'
      parameters:
      - name: country_code
        in: path
        schema:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
        required: true
        description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
        examples:
          default:
            value: US
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      length:
                        type:
                        - integer
                        - 'null'
                        description: Number of cities in `cities` on success; `-1` when the country has no rows.
                      cities:
                        anyOf:
                        - type: array
                          items:
                            type:
                            - string
                            - 'null'
                        - type: string
                        nullable: true
                        description: Array of Shazam city names for the country, or the legacy fallback string `"Invalid Country or No Cities Found"` when no rows match.
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      length: 3
                      cities:
                      - Atlanta
                      - Austin
                      - Baltimore
