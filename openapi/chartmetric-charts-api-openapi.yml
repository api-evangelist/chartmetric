  /api/charts/hanteo/{entityType}/{chartType}:
    get:
      summary: Hanteo Chart
      tags:
      - Charts
      operationId: getHanteoCharts
      description: Return Hanteo chart entries for the given `entityType` (`track` or `album`). Shape matches the generic regional CCC chart row; hydrated rows may also expose `externalId`, `id`, `platform_id`, and a `physicalRecordIndex` inside `optionalRows`.
      parameters:
      - name: entityType
        in: path
        schema:
          type: string
          enum:
          - track
          - album
          - artist
          - video
          description: Chart entity (`track` or `album`).
        required: true
        description: Chart entity (`track` or `album`).
        examples:
          default:
            value: track
      - name: chartType
        in: path
        schema:
          type: string
          enum:
          - digital
          - top
          - music
          - world
          description: Hanteo chart type. Allowed values depend on `entityType`.
        required: true
        description: Hanteo chart type. Allowed values depend on `entityType`.
        examples:
          default:
            value: digital
      - name: date
        in: query
        schema:
          type: string
          format: date
          description: Date for the chart slice (`YYYY-MM-DD`). Required unless `latest=true`.
        required: false
        description: Date for the chart slice (`YYYY-MM-DD`). Required unless `latest=true`.
      - name: latest
        in: query
        schema:
          type: boolean
          description: If true, use the most recently available chart date and ignore `date`.
          default: false
        required: false
        description: If true, use the most recently available chart date and ignore `date`.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          description: Maximum number of items to return per request.
          default: 100
        required: false
        description: Maximum number of items to return per request.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
        required: false
        description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
      - name: code2
        in: query
        schema:
          anyOf:
          - type: string
            minLength: 2
            maxLength: 2
            description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
          - type: string
            enum:
            - GLOBAL
          description: ISO 3166-1 alpha-2 country code (uppercase, e.g. 'US') or 'GLOBAL'. When omitted, the platform's default chart scope applies.
        required: false
        description: ISO 3166-1 alpha-2 country code (uppercase, e.g. 'US') or 'GLOBAL'. When omitted, the platform's default chart scope applies.
      - name: duration
        in: query
        schema:
          type: string
          enum:
          - daily
          - monthly
          - weekly
          - yearly
          - semi-yearly
          - real-time
          - all_time
          description: Chart duration window. One of `daily`, `monthly`, `weekly`, `yearly`, `semi-yearly`, `real-time`, `all_time`.
        required: true
        description: Chart duration window. One of `daily`, `monthly`, `weekly`, `yearly`, `semi-yearly`, `real-time`, `all_time`.
        examples:
