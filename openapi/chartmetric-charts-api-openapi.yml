  /api/charts/{platform}/countries:
    get:
      summary: List Chart Countries for Platform
      tags:
      - Charts
      operationId: listChartCountries
      description: 'Return the country codes with available chart data for the given `platform`. Query params (`chart_type`, `type`, `duration`) are needed for platforms whose chart countries vary by chart type / duration (e.g. Airplay, Amazon, Apple Music, iTunes, Spotify, TikTok, YouTube). Platforms with a single chart type (Deezer, Shazam, SoundCloud) do not need these params. The handler wraps the response in `{ obj: { countries } }` where `countries` depends on the platform — usually an array of ISO 3166-1 alpha-2 codes.'
      parameters:
      - name: platform
        in: path
        schema:
          type: string
          enum:
          - airplay
          - amazon
          - applemusic
          - deezer
          - itunes
          - shazam
          - soundcloud
          - spotify
          - tiktok
          - youtube
          description: Chart platform (e.g. `airplay`, `amazon`, `applemusic`, `deezer`, `itunes`, `shazam`, `soundcloud`, `spotify`, `tiktok`, `youtube`).
        required: true
        description: Chart platform (e.g. `airplay`, `amazon`, `applemusic`, `deezer`, `itunes`, `shazam`, `soundcloud`, `spotify`, `tiktok`, `youtube`).
        examples:
          default:
            value: airplay
      - name: chart_type
        in: query
        schema:
          anyOf:
          - type: string
            enum:
            - tracks
            - artists
            x-required: true
          - type: string
            enum:
            - tracks
            - albums
            x-required: true
          - type: string
            enum:
            - albums
            - tracks
            - videos
            x-required: true
          - type: string
            enum:
            - tracks
            x-required: true
          - type: string
            enum:
            - artists
            - tracks
            - trends
            - videos
            - shorts
            x-required: true
          description: Chart type within the platform. Required for platforms whose country list varies by chart type; rejected for platforms with a single chart type (e.g. Deezer, Shazam, SoundCloud).
        required: false
        description: Chart type within the platform. Required for platforms whose country list varies by chart type; rejected for platforms with a single chart type (e.g. Deezer, Shazam, SoundCloud).
      - name: duration
        in: query
        schema:
          anyOf:
          - type: string
            enum:
            - daily
            - weekly
            x-required: true
          - anyOf:
            - type: string
              enum:
              - daily
              - weekly
              x-required: true
          description: Chart duration. Required for `platform=airplay`, and for `platform=youtube` with `chart_type=shorts`. Forbidden otherwise.
        required: false
        description: Chart duration. Required for `platform=airplay`, and for `platform=youtube` with `chart_type=shorts`. Forbidden otherwise.
      - name: type
        in: query
        schema:
          anyOf:
          - type: string
            enum:
            - popular_track
            - new_track
            - popular_album
            - new_album
            x-required: true
          - anyOf:
            - type: string
              enum:
              - top
              - daily
              x-required: true
          description: Chart sub-type. Required for `platform=amazon` (`new_album`, `new_track`, `popular_album`, `popular_track`) and for `platform=applemusic` with `chart_type=tracks` (`top`, `daily`, `city`).
        required: false
        description: Chart sub-type. Required for `platform=amazon` (`new_album`, `new_track`, `popular_album`, `popular_track`) and for `platform=applemusic` with `chart_type=tracks` (`top`, `daily`, `city`).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type:
                    - object
                    - 'null'
                    properties:
                      countries:
                        anyOf:
                        - type: array
                          items:
                            anyOf:
                            - type: string
                            - type: object
                              properties: {}
                        - type: object
                          properties: {}
                        - type: string
                        nullable: true
                        description: Country codes available for the requested chart. Usually an array of ISO 3166-1 alpha-2 codes; some platforms emit nested maps when chart type / duration do not resolve to a single list.
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      countries:
                      - US
                      - GB
                      - BR
                      - JP
                      - KR
