  /api/album/{id}/{platform}/{stats}:
    get:
      summary: Album Platform Stats
      tags:
      - Album
      operationId: getAlbumStats
      description: Time-series of a platform-specific stat for an album (currently `platform=spotify`, `stat=followers` returns Spotify popularity). Pass `latest=true` to bypass the date window and receive the most recent point.
      parameters:
      - name: platform
        in: path
        schema:
          type: string
          enum:
          - spotify
          description: Streaming platform whose stat is requested. Currently only `spotify` is supported.
        required: true
        description: Streaming platform whose stat is requested. Currently only `spotify` is supported.
        examples:
          default:
            value: spotify
      - name: stats
        in: path
        schema:
          type: string
          enum:
          - followers
          description: Platform stat to retrieve. Currently only `followers` is supported (returns Spotify popularity).
        required: true
        description: Platform stat to retrieve. Currently only `followers` is supported (returns Spotify popularity).
        examples:
          default:
            value: followers
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric album ID.
        required: true
        description: Chartmetric album ID.
        examples:
          default:
            value: 1
      - name: since
        in: query
        schema:
          type: string
          format: date
          description: Start of the date window in ISO format (e.g. '2025-11-01'). Defaults to 180 days ago.
          default: '2026-04-22'
        required: false
        description: Start of the date window in ISO format (e.g. '2025-11-01'). Defaults to 180 days ago.
      - name: until
        in: query
        schema:
          type: string
          format: date
          description: End of the date window in ISO format (e.g. '2025-11-15'). Defaults to today.
          default: '2026-10-19'
        required: false
        description: End of the date window in ISO format (e.g. '2025-11-15'). Defaults to today.
      - name: latest
        in: query
        schema:
          type: boolean
          description: If true, returns only the most recent data point and ignores the `since`/`until` window.
        required: false
        description: If true, returns only the most recent data point and ignores the `since`/`until` window.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        value:
                          type: number
                          format: float
                          description: Stat value at `timestp`. Despite the path slug `followers`, the value returned for `platform=spotify` is the Spotify album popularity (0–100), not a follower count.
                        timestp:
                          type: string
                          format: date-time
                          description: Timestamp the data point was recorded.
                        daily_diff:
                          type: number
                          format: float
                          description: Change in `value` versus the previous day.
                        weekly_diff:
                          type: number
                          format: float
                          description: Change in `value` versus 7 days prior.
                        monthly_diff:
                          type: number
                          format: float
                          description: Change in `value` versus 30 days prior.
                        weekly_diff_percent:
                          type: number
                          format: float
                          description: Percent change in `value` versus 7 days prior.
                        monthly_diff_percent:
                          type: number
                          format: float
                          description: Percent change in `value` versus 30 days prior.
                        flags:
                          type: boolean
                          description: True when this point carries data-quality flags.
                        interpolated:
                          type: boolean
                          description: True when the value was interpolated from neighboring points.
                        extrapolated:
                          type: boolean
                          description: True when the value was extrapolated beyond the source series.
                      required:
                      - value
                      - timestp
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - value: 97
                      timestp: '2020-09-20T07:00:00.000Z'
                    - value: 97
                      timestp: '2020-09-21T07:00:00.000Z'
                    - value: 97
                      timestp: '2020-09-22T07:00:00.000Z'
                    - value: 97
                      timestp: '2020-09-23T07:00:00.000Z'
  /api/album/{id}/{platform}/{status}/playlists:
    get:
      summary: Album Playlists
      tags:
      - Album
      operationId: listAlbumPlaylists
      description: 'Playlists (`status=current` or `past`) featuring an album on a given streaming platform. Items pair a `playlist` object with the corresponding `track` metadata.


        **Boolean flag parameters supported per platform:**


        | Flag | spotify | applemusic | deezer | amazon |

        |---|:---:|:---:|:---:|:---:|

        | `editorial` | ✅ | ✅ | ✅ | |

        | `editorialBrand` | | ✅ | | |

        | `personalized` | ✅ | | | |

        | `deezerPartner` | | | ✅ | |

        | `chart` | ✅ | ✅ | ✅ | |

        | `thisIs` | ✅ | | | |

        | `hundredPercent` | | | ✅ | |

        | `newMusicFriday` | ✅ | | | |

        | `radio` | ✅ | ✅ | | |

        | `fullyPersonalized` | ✅ | | | |

        | `brand` | ✅ | | ✅ | |

        | `majorCurator` | ✅ | | ✅ | |

        | `musicBrand` | | ✅ | | |

        | `nonMusicBrand` | | ✅ | | |

        | `popularIndie` | ✅ | | ✅ | |

        | `indie` | ✅ | ✅ | ✅ | |

        | `audiobook` | ✅ | | | |

        | `personalityArtist` | | ✅ | | |


        Amazon does not accept any flags. Flags are not mutually exclusive — pass others as `false` to scope to one. When no flags are specified the API may return an empty array; specify flags explicitly to get data.'
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric album ID.
        required: true
        description: Chartmetric album ID.
        examples:
          default:
            value: 1
      - name: platform
        in: path
        schema:
          type: string
          enum:
          - cm
          - spotify
          - itunes
          - applemusic
          - deezer
          - shazam
          - beatport
          - amazon
          - youtube
          - tunefind
          - soundcloud
          description: Streaming platform. One of `spotify`, `applemusic`, `deezer`, or `amazon`; supported boolean filters vary by platform.
        required: true
        description: Streaming platform. One of `spotify`, `applemusic`, `deezer`, or `amazon`; supported boolean filters vary by platform.
        examples:
          default:
            value: cm
      - name: status
        in: path
        schema:
          type: string
          enum:
          - current
          - past
          description: Playlist status relative to the album. `current` returns playlists currently containing a track from the album; `past` returns playlists that previously contained one.
        required: true
        description: Playlist status relative to the album. `current` returns playlists currently containing a track from the album; `past` returns playlists that previously contained one.
        examples:
          default:
            value: current
      - name: since
        in: query
        schema:
          type: string
          format: date
          description: Start of the added/removed date window in ISO format (e.g. '2025-11-01'). Defaults to 180 days ago.
          default: '2026-04-22'
        required: false
        description: Start of the added/removed date window in ISO format (e.g. '2025-11-01'). Defaults to 180 days ago.
      - name: until
        in: query
        schema:
          type: string
          format: date
          description: End of the added/removed date window in ISO format (e.g. '2025-11-15'). Defaults to today.
          default: '2026-10-19'
        required: false
        description: End of the added/removed date window in ISO format (e.g. '2025-11-15'). Defaults to today.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
        required: false
        description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of items to return per request.
          default: 10
        required: false
        description: Maximum number of items to return per request.
      - name: indie
        in: query
        schema:
          type: boolean
          description: Filter to only playlists tagged as indie (independently curated).
        required: false
        description: Filter to only playlists tagged as indie (independently curated).
      - name: majorCurator
        in: query
        schema:
          type: boolean
          description: Filter to only playlists owned by a major-label curator (Sony, Universal, Warner, etc.).
        required: false
        description: Filter to only playlists owned by a major-label curator (Sony, Universal, Warner, etc.).
      - name: editorial
        in: query
        schema:
          type: boolean
          description: Filter to only editorial playlists curated by the platform (e.g. Spotify-owned). Defaults to true; pass `false` to include user-curated playlists.
          default: true
        required: false
        description: Filter to only editorial playlists curated by the platform (e.g. Spotify-owned). Defaults to true; pass `false` to include user-curated playlists.
      - name: newMusicFriday
        in: query
        schema:
          type: boolean
          description: Filter to only New Music Friday-style new-release playlists.
        required: false
        description: Filter to only New Music Friday-style new-release playlists.
      - name: editorialBrand
        in: query
        schema:
          type: boolean
          description: Filter to only editorial playlists operated by a brand (e.g. retailer or media outlet).
        required: false
        description: Filter to only editorial playlists operated by a brand (e.g. retailer or media outlet).
      - name: personalized
        in: query
        schema:
          type: boolean
          description: Filter to only personalized playlists (e.g. Discover Weekly, Release Radar). May vary per listener.
        required: false
        description: Filter to only personalized playlists (e.g. Discover Weekly, Release Radar). May vary per listener.
      - name: deezerPartner
        in: query
        schema:
          type: boolean
          description: Filter to only Deezer partner-curated playlists.
