openapi: 3.2.0
info:
  title: Chartmetric Developer Album API
  description: 'Public API documentation for the Chartmetric Developer API.


    ## Credit consumption


    On the Prepaid API plan every request consumes API credits. Most endpoints cost

    **1 credit** per request. Premium endpoints — labelled `💎 Premium` in their title —

    return higher-cost audience and playlist data and consume **2 credits** per request:


    - `GET /api/artist/{id}/instagram-audience-stats`

    - `GET /api/artist/{id}/instagram-audience-stats/dates`

    - `GET /api/artist/{id}/social-audience-stats`

    - `GET /api/artist/{id}/tiktok-audience-stats`

    - `GET /api/artist/{id}/tiktok-influencer-stats`

    - `GET /api/artist/{id}/tiktok-top-influencers`

    - `GET /api/artist/{id}/tiktok-top-videos`

    - `GET /api/artist/{id}/where-people-listen`

    - `GET /api/artist/{id}/youtube-audience-stats`

    - `GET /api/artist/{id}/{platform}/{status}/playlists`

    - `GET /api/brand/v2/{brandId}/audience`

    - `GET /api/track/{id}/tiktok-influencer-stats`

    - `GET /api/track/{id}/tiktok-top-influencers`

    - `GET /api/track/{id}/tiktok-top-sounds`

    - `GET /api/track/{id}/topVideos`


    Credits are deducted when the request is received, regardless of the number of rows

    returned. Your remaining balance and the current per-endpoint costs are shown in your

    Chartmetric account under Settings → API Usage. Fixed-rate monthly API plans are not

    billed per request; they are limited by their request rate instead.'
  version: 1.0.1589
  contact:
    name: Chartmetric API Support
    email: backend-engineering@chartmetric.com
servers:
- url: https://api.chartmetric.com
  description: Production
security:
- BearerAuth: []
tags:
- name: Album
  description: Albums, EPs and singles as released on streaming platforms, identified by a Chartmetric album ID. Endpoints cover album metadata, cross-platform ID lookup, the tracklist, per-platform stats, chart appearances, and the playlists the album is featured on.
paths:
  /api/album/{id}/{type}/charts:
    get:
      summary: Album Charts
      tags:
      - Album
      operationId: getAlbumCharts
      description: Chart history for an album on a platform (`applemusic`, `itunes`, or `amazon`). Date range accepts up to 365 days between `since` and `until`.
      parameters:
      - name: type
        in: path
        schema:
          type: string
          enum:
          - applemusic
          - itunes
          - amazon
          description: Chart source platform. One of `applemusic`, `itunes`, or `amazon`.
        required: true
        description: Chart source platform. One of `applemusic`, `itunes`, or `amazon`.
        examples:
          default:
            value: applemusic
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric album ID.
        required: true
        description: Chartmetric album ID.
        examples:
          default:
            value: 1
      - name: since
        in: query
        schema:
          type: string
          format: date
          description: Start date in ISO format (e.g. '2025-11-01'). Defaults to 180 days ago.
          default: '2026-04-22'
        required: false
        description: Start date in ISO format (e.g. '2025-11-01'). Defaults to 180 days ago.
      - name: until
        in: query
        schema:
          type: string
          format: date
          description: End date in ISO format (e.g. '2025-11-15'). Defaults to today; must be at most 365 days after `since`.
          default: '2026-10-19'
        required: false
        description: End date in ISO format (e.g. '2025-11-15'). Defaults to today; must be at most 365 days after `since`.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      data:
                        type:
                        - array
                        - 'null'
                        items:
                          type: object
                          properties:
                            itunes_album_id:
                              type:
                              - string
                              - 'null'
                              description: iTunes album ID at the time the chart was recorded.
                            rank:
                              type:
                              - integer
                              - 'null'
                              description: Chart position on the recorded date.
                            added_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Date the chart row was recorded.
                            code2:
                              type:
                              - string
                              - 'null'
                              minLength: 2
                              maxLength: 2
                              description: ISO 3166-1 alpha-2 country code of the chart (e.g. 'US').
                            genre:
                              type:
                              - string
                              - 'null'
                              description: Chart genre name.
                            gnp:
                              type:
                              - string
                              - 'null'
                              description: Chart GNP segment value.
                            pre_rank:
                              type:
                              - integer
                              - 'null'
                              description: Chart position on the previous recorded date.
                            peak_rank:
                              type:
                              - integer
                              - 'null'
                              description: Best (lowest-numbered) chart position observed.
                            peak_date:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Date `peak_rank` was achieved.
                            id:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              maximum: 2147483647
                              description: Chartmetric album ID. Same value as `cm_album`.
                            name:
                              type:
                              - string
                              - 'null'
                              description: Album name.
                            release_date:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Album release date.
                            copyright:
                              type:
                              - string
                              - 'null'
                              description: Album copyright statement.
                            num_track:
                              type:
                              - string
                              - 'null'
                              description: Number of tracks on the album, returned as a string.
                            upc:
                              type:
                              - string
                              - 'null'
                              description: Universal Product Code identifying the release.
                            description:
                              type:
                              - string
                              - 'null'
                              description: Album description.
                            is_single:
                              type:
                              - boolean
                              - 'null'
                              description: True when the release is classified as a single.
                            artwork_url:
                              type:
                              - string
                              - 'null'
                              description: Album artwork image URL.
                            label:
                              type:
                              - string
                              - 'null'
                              description: Record label that released the album.
                            genres:
                              type:
                              - string
                              - 'null'
                              description: Comma-separated list of album genres.
                            created_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Date the album row was created in Chartmetric.
                            modified_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Date the album row was last modified in Chartmetric.
                            cm_album:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              maximum: 2147483647
                              description: Chartmetric album ID.
                            storefronts:
                              type: array
                              items:
                                type: string
                              description: ISO 3166-1 alpha-2 country codes where the album is available.
                            itunes_album_ids:
                              type: array
                              items:
                                type: string
                              description: iTunes album IDs associated with this album.
                            artists:
                              type: array
                              items:
                                type: object
                                properties:
                                  itunes_artist_id:
                                    type:
                                    - integer
                                    - 'null'
                                    description: iTunes artist ID.
                                  name:
                                    type:
                                    - string
                                    - 'null'
                                    description: Artist name.
                                  cm_artist:
                                    type:
                                    - integer
                                    - 'null'
                                    minimum: 0
                                    maximum: 2147483647
                                    description: Chartmetric artist ID.
                              description: Artists credited on the album.
                        description: Chart history rows for the album, ordered by `added_at`.
                      length:
                        type: integer
                        minimum: 0
                        description: Total number of rows in `data`.
                    required:
                    - length
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      data:
                      - itunes_album_id: '1450330588'
                        rank: 84
                        added_at: '2020-03-04T08:00:00.000Z'
                        code2: US
                        genre: All Genres
                        gnp: '8510700.00'
                        pre_rank: 80
                        peak_rank: 1
                        peak_date: '2019-02-08T08:00:00.000Z'
                        id: 3058232
                        name: thank u, next
                        release_date: '2019-02-08T08:00:00.000Z'
                        copyright: (P) 2019 Republic Records, a division of UMG Recordings, Inc.
                        num_track: '12'
                        upc: '602577464980'
                        description: null
                        is_single: false
                        artwork_url: https://is5-ssl.mzstatic.com/image/thumb/Music124/v4/4e/26/d5/4e26d5f3-2d62-1b5c-689a-e8de4e6f3797/00602577465284.rgb.jpg/160x160bb.jpeg
                        label: Republic Records
                        genres: Pop,Music
                        created_at: null
                        modified_at: '2020-09-17T03:10:01.823Z'
                        cm_album: 3533190
                        storefronts:
                        - AU
                        - JP
                        - LA
                        - 'NO'
                        - US
                        itunes_album_ids:
                        - '1450330588'
                        artists:
                        - itunes_artist_id: 412778295
                          name: Ariana Grande
                          cm_artist: 3963
                      length: 175
  /api/album/{type}/{id}/get-ids:
    get:
      summary: Get Album IDs
      tags:
      - Album
      operationId: getAlbumIds
      description: Resolve an album across platforms given a source identifier. `type` accepts `chartmetric`, `upc`, `spotify`, `itunes`, `deezer`, or `amazon`. Multiple rows per `cm_album` may be returned when an album has several platform identifiers.
      parameters:
      - name: type
        in: path
        schema:
          type: string
          enum:
          - chartmetric
          - upc
          - spotify
          - itunes
          - deezer
          - amazon
          description: Source identifier type. One of `chartmetric`, `upc`, `spotify`, `itunes`, `deezer`, or `amazon`.
        required: true
        description: Source identifier type. One of `chartmetric`, `upc`, `spotify`, `itunes`, `deezer`, or `amazon`.
        examples:
          default:
            value: chartmetric
      - name: id
        in: path
        schema:
          type: string
          pattern: ^[a-zA-Z0-9-_]+$
          description: Album identifier whose format depends on `type` (numeric Chartmetric ID, UPC string, or platform-specific album ID).
        required: true
        description: Album identifier whose format depends on `type` (numeric Chartmetric ID, UPC string, or platform-specific album ID).
        examples:
          default:
            value: '2762'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        cm_album:
                          type: integer
                          minimum: 0
                          maximum: 2147483647
                          description: Chartmetric album ID.
                        album_name:
                          type:
                          - string
                          - 'null'
                          description: Album name.
                        upc:
                          type:
                          - string
                          - 'null'
                          description: Universal Product Code identifying the release.
                        spotify_album_id:
                          type:
                          - string
                          - 'null'
                          description: Spotify album ID.
                        itunes_album_id:
                          type:
                          - string
                          - 'null'
                          description: iTunes album ID.
                        deezer_album_id:
                          type:
                          - string
                          - 'null'
                          description: Deezer album ID.
                        amazon_album_id:
                          type:
                          - string
                          - 'null'
                          description: Amazon album ID (ASIN).
                      required:
                      - cm_album
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - cm_album: 815685
                      album_name: Deja Fu
                      upc: '3614599568697'
                      spotify_album_id: 3hpphhVJM2QTUMYuXT7nw4
                      itunes_album_id: '1126469777'
                      deezer_album_id: null
                      amazon_album_id: B01HDU9RN0
                    - cm_album: 815685
                      album_name: Deja Fu
                      upc: '3614599568697'
                      spotify_album_id: 3hpphhVJM2QTUMYuXT7nw4
                      itunes_album_id: '1126469777'
                      deezer_album_id: null
                      amazon_album_id: B01HFW1FHW
  /api/album/{id}:
    get:
      summary: Album Metadata
      tags:
      - Album
      operationId: getAlbumMetadata
      description: Album metadata by Chartmetric ID.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric album ID.
        required: true
        description: Chartmetric album ID.
        examples:
          default:
            value: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      id:
                        type:
                        - integer
                        - 'null'
                        minimum: 0
                        maximum: 2147483647
                        description: Chartmetric album ID. Same value as `cm_album`.
                      upc:
                        type:
                        - string
                        - 'null'
                        description: Universal Product Code identifying the release.
                      name:
                        type:
                        - string
                        - 'null'
                        description: Album name.
                      local_name:
                        type:
                        - string
                        - 'null'
                        description: Localized album name, when available.
                      local_name_locale:
                        type:
                        - string
                        - 'null'
                        description: Locale for local_name, when available.
                      image_url:
                        type:
                        - string
                        - 'null'
                        description: Album cover image URL.
                      release_date:
                        type:
                        - string
                        - 'null'
                        description: Album release date (`YYYY-MM-DD`).
                      label:
                        type:
                        - string
                        - 'null'
                        description: Record label that released the album.
                      spotify_popularity:
                        type:
                        - integer
                        - 'null'
                        minimum: 0
                        description: Spotify popularity score (0–100) at the time of caching.
                      cm_label:
                        type:
                        - integer
                        - 'null'
                        minimum: 0
                        maximum: 2147483647
                        description: Chartmetric label ID.
                      description:
                        type:
                        - string
                        - 'null'
                        description: Album description.
                      created_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Date the album row was created in Chartmetric.
                      modified_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                        description: Date the album row was last modified in Chartmetric.
                      cm_album:
                        type: integer
                        minimum: 0
                        maximum: 2147483647
                        description: Chartmetric album ID.
                      num_track:
                        anyOf:
                        - type: string
                        - type: number
                          format: float
                        nullable: true
                        description: Number of tracks on the album.
                      spotify_album_ids:
                        type:
                        - array
                        - 'null'
                        items:
                          type: string
                        description: Spotify album IDs associated with this album.
                      itunes_album_ids:
                        type:
                        - array
                        - 'null'
                        items:
                          type: string
                        description: iTunes album IDs associated with this album.
                      deezer_album_ids:
                        type:
                        - array
                        - 'null'
                        items:
                          type: string
                        description: Deezer album IDs associated with this album.
                      artists:
                        type:
                        - array
                        - 'null'
                        items:
                          type: object
                          properties:
                            cm_artist:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              maximum: 2147483647
                              description: Chartmetric artist ID.
                            name:
                              type:
                              - string
                              - 'null'
                              description: Artist name.
                            image_url:
                              type:
                              - string
                              - 'null'
                              description: Artist image URL.
                        description: Artists credited on the album.
                      cm_statistics:
                        type:
                        - object
                        - 'null'
                        properties:
                          sp_popularity:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Spotify popularity score (0–100).
                          num_sp_editorial_playlists:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Count of Spotify editorial playlists featuring this album.
                          num_sp_playlists:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Count of Spotify playlists featuring this album.
                          sp_playlist_total_reach:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Sum of followers across all Spotify playlists featuring this album.
                          sp_editorial_playlist_total_reach:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Sum of followers across all Spotify editorial playlists featuring this album.
                        description: Cached playlist statistics for the album.
                    required:
                    - cm_album
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      id: null
                      upc: '3614599568697'
                      name: Deja Fu
                      local_name: null
                      local_name_locale: null
                      image_url: https://i.scdn.co/image/250c66bd1cfd8e1177055c998b43feac5a62ed0d
                      release_date: '2016-06-22'
                      label: Ranka Kustannus Oy
                      spotify_popularity: 2
                      cm_label: 44035
                      description: null
                      created_at: null
                      modified_at: null
                      cm_album: 815685
                      num_track: '1'
                      spotify_album_ids:
                      - 3hpphhVJM2QTUMYuXT7nw4
                      itunes_album_ids: null
                      deezer_album_ids: null
                      artists:
                      - cm_artist: 256101
                        name: Blind Channel
                        image_url: https://i.scdn.co/image/99ff63e0299ffe1faa62d90056f6ca59aa2f3443
                      cm_statistics:
                        sp_popularity: 2
                        num_sp_editorial_playlists: 1
                        num_sp_playlists: 19
                        sp_playlist_total_reach: 10757
                        sp_editorial_playlist_total_reach: 0
  /api/album/{id}/tracks:
    get:
      summary: Album Tracks
      tags:
      - Album
      operationId: listAlbumTracks
      description: Tracks on an album identified by Chartmetric ID. Each track carries cross-platform IDs, artist arrays, and a `cm_statistics` aggregate. Prefer `cm_artists[].{id,name,code2,image_url,cover_url}` over the parallel `cm_artist`, `artist_names`, `code2s`, `artist_images`, `artist_covers` arrays — those are retained for compatibility.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric album ID.
        required: true
        description: Chartmetric album ID.
        examples:
          default:
            value: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          minimum: 0
                          maximum: 2147483647
                          description: Chartmetric track ID.
                        name:
                          type:
                          - string
                          - 'null'
                          description: Track name.
                        local_name:
                          type:
                          - string
                          - 'null'
                          description: Localized track name, when available.
                        local_name_locale:
                          type:
                          - string
                          - 'null'
                          description: Locale for local_name, when available.
                        image_url:
                          type:
                          - string
                          - 'null'
                          description: Track cover image URL.
                        isrc:
                          type:
                          - string
                          - 'null'
                          description: International Standard Recording Code for the track.
                        description:
                          type:
                          - string
                          - 'null'
                          description: Track description.
                        created_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Date the track row was created in Chartmetric.
                        modified_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Date the track row was last modified in Chartmetric.
                        tags:
                          type:
                          - string
                          - 'null'
                          description: Comma-separated list of genres for the track.
                        cm_track:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          maximum: 2147483647
                          description: Chartmetric track ID.
                        cm_artist:
                          type:
                          - array
                          - 'null'
                          items:
                            type: integer
                            minimum: 0
                            maximum: 2147483647
                          description: Chartmetric artist IDs. Index aligns with `artist_names`, `code2s`, `artist_images`, `artist_covers`. Prefer `cm_artists[].id`.
                        artist_names:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: Artist names. Deprecated; prefer `cm_artists[].name`.
                        code2s:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                            minLength: 2
                            maxLength: 2
                            description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
                          description: Artist country codes (ISO 3166-1 alpha-2). Deprecated; prefer `cm_artists[].code2`.
                        artist_images:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Artist image URLs. Deprecated; prefer `cm_artists[].image_url`.
                        artist_covers:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Artist cover image URLs. Deprecated; prefer `cm_artists[].cover_url`.
                        spotify_track_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: Spotify track IDs, sorted by popularity score.
                        spotify_album_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: Spotify album IDs the track appears on.
                        spotify_duration_ms:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          description: Track duration on Spotify in milliseconds.
                        itunes_track_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: iTunes track IDs.
                        itunes_album_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: iTunes album IDs the track appears on.
                        storefronts:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: ISO 3166-1 alpha-2 codes for iTunes storefronts where the track is available.
                        deezer_track_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: Deezer track IDs.
                        deezer_album_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            anyOf:
                            - type: string
                            - type: number
                              format: float
                          description: Deezer album IDs the track appears on.
                        deezer_duration:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          description: Track duration on Deezer in seconds.
                        amazon_track_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: Amazon track IDs.
                        amazon_album_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: Amazon album IDs the track appears on.
                        album_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type: integer
                            minimum: 0
                            maximum: 2147483647
                          description: Chartmetric album IDs the track appears on. Index aligns with `album_names`, `album_upc`, `album_label`, `release_dates`.
                        album_names:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: Album names.
                        album_upc:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: Album UPC codes.
                        album_label:
                          type:
