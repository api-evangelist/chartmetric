  /api/radio/station-list:
    get:
      summary: Get Radio Station List for Country
      tags:
      - Radio
      operationId: listRadioStations
      description: Returns the list of stations along with metadata for a given country (2-letter code). Station social-media counts come from a LEFT JOIN and may be null.
      parameters:
      - name: code2
        in: query
        schema:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
        required: false
        description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          minimum: 0
                          maximum: 2147483647
                          description: Chartmetric radio station ID.
                        name:
                          type:
                          - string
                          - 'null'
                          description: Station callsign or display name.
                        genre:
                          type:
                          - string
                          - 'null'
                          description: Station format / genre (e.g. 'Hot AC', 'News/Talk').
                        frequency:
                          type:
                          - string
                          - 'null'
                          description: Dial position (e.g. `104.3` for FM, `1010` for AM).
                        market:
                          type:
                          - string
                          - 'null'
                          description: Primary broadcast market the station serves.
                        broadcast_area:
                          type:
                          - string
                          - 'null'
                          description: Geographic area covered by the station signal.
                        country:
                          type:
                          - string
                          - 'null'
                          description: Country the station broadcasts from.
                        station_state:
                          type:
                          - string
                          - 'null'
                          description: Two-letter state or province code (e.g. `CA`, `NY`).
                        image_url:
                          type:
                          - string
                          - 'null'
                          description: URL of the station logo or image asset.
                        aqh:
                          type:
                          - integer
                          - 'null'
                          description: 'Average Quarter-Hour persons: unique listeners tuning in for >5 minutes within a 15-minute window. Available for US stations only.'
                        platform:
                          type:
                          - string
                          - 'null'
                          description: Distribution platform of the station (e.g. 'Terrestrial', 'Satellite', 'Online').
                        facebook_followers:
                          type:
                          - integer
                          - 'null'
                          description: Followers on the station's Facebook page. Null when the station has no linked Facebook account.
                        facebook_likes:
                          type:
                          - integer
                          - 'null'
                          description: Likes on the station's Facebook page. Null when the station has no linked Facebook account.
                        instagram_followers:
                          type:
                          - integer
                          - 'null'
                          description: Followers on the station's Instagram account. Null when the station has no linked Instagram account.
                        twitter_followers:
                          type:
                          - integer
                          - 'null'
                          description: Followers on the station's Twitter/X account. Null when the station has no linked Twitter account.
                        wikipedia_views:
                          type:
                          - integer
                          - 'null'
                          description: Pageviews on the station's Wikipedia article. Null when the station has no linked Wikipedia page.
                      required:
                      - id
                      - name
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - id: 214403
