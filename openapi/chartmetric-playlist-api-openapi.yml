  /api/playlist/{platform}/{id}/journey-progression/{type}:
    get:
      summary: Get Playlist Journey / Progression
      tags:
      - Playlist
      operationId: getPlaylistJourneyProgress
      description: Look-back (`journey`) or look-ahead (`progression`) analysis of playlists that share tracks with the target playlist over time.
      parameters:
      - name: platform
        in: path
        schema:
          type: string
          enum:
          - spotify
          - applemusic
          - deezer
          - soundcloud
          description: Streaming platform. One of `spotify`, `applemusic`, `deezer`, `soundcloud`.
        required: true
        description: Streaming platform. One of `spotify`, `applemusic`, `deezer`, `soundcloud`.
        examples:
          default:
            value: spotify
      - name: id
        in: path
        schema:
          anyOf:
          - type: integer
            minimum: 0
            x-required: true
          - type: integer
            minimum: 0
            maximum: 2147483647
            x-required: true
          description: Chartmetric playlist ID. Deezer uses bigInt IDs; other platforms use 32-bit integers.
        required: true
        description: Chartmetric playlist ID. Deezer uses bigInt IDs; other platforms use 32-bit integers.
        examples:
          default:
            value: 1
      - name: type
        in: path
        schema:
          type: string
          enum:
          - journey
          - progression
          description: Look-back (`journey`) or look-ahead (`progression`) analysis of playlists that share tracks with the target.
        required: true
        description: Look-back (`journey`) or look-ahead (`progression`) analysis of playlists that share tracks with the target.
        examples:
          default:
            value: journey
      - name: sortColumn
        in: query
        schema:
          type: string
          enum:
          - overlap
          - followers
          description: Column to sort matched playlists by. One of `overlap` (total percent overlap) or `followers`. Defaults to `overlap`.
        required: false
        description: Column to sort matched playlists by. One of `overlap` (total percent overlap) or `followers`. Defaults to `overlap`.
      - name: sortOrderDesc
        in: query
        schema:
          type: boolean
          description: If true, sort `sortColumn` in descending order. Defaults to true.
          default: true
        required: false
        description: If true, sort `sortColumn` in descending order. Defaults to true.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
        required: false
        description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          description: Maximum number of items to return per request.
          default: 10
        required: false
        description: Maximum number of items to return per request.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      total:
                        anyOf:
                        - type: integer
                        - type: string
                        nullable: true
                        description: Total number of matched playlists before pagination.
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            plid:
                              anyOf:
                              - type: number
                                format: float
                              - type: string
                              nullable: true
                              description: Matched playlist ID (platform-native).
                            name:
                              type:
                              - string
                              - 'null'
                              description: Matched playlist name.
                            followers:
                              type:
                              - integer
                              - 'null'
                              minimum: 0
                              description: Current follower count of the matched playlist.
                            image_url:
                              type:
                              - string
                              - 'null'
                              description: Cover image URL of the matched playlist.
                            total_percent_overlap:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Total track overlap between target and matched playlist as a fraction (0–1).
                            count_distinct_tracks:
                              anyOf:
                              - type: integer
                              - type: string
                              nullable: true
                              description: Number of distinct tracks shared between target and matched playlist.
                            events:
                              type:
                              - array
                              - 'null'
                              items:
                                type: object
                                properties:
                                  days:
                                    type:
                                    - integer
                                    - 'null'
                                    description: Number of days between the matched-playlist event and the target playlist event.
                                  day_percent_overlap:
                                    type:
                                    - number
                                    - 'null'
                                    format: float
                                    description: Track overlap between target and matched playlist on this day, as a fraction (0–1).
                                  tracks_added:
                                    type:
                                    - array
                                    - 'null'
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          type: integer
                                          minimum: 0
                                          maximum: 2147483647
                                          description: Chartmetric track ID for the added track.
                                        name:
                                          type:
                                          - string
                                          - 'null'
                                          description: Track name.
                                        image_url:
                                          type:
                                          - string
                                          - 'null'
                                          description: Album cover image URL.
                                        isrc:
                                          type:
                                          - string
                                          - 'null'
                                          description: International Standard Recording Code (ISRC) of the track.
                                    description: Tracks added during this event window.
                              description: Per-day overlap events between target and matched playlist.
                        description: List of matched playlists with overlap details.
                    required:
                    - data
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      total: '24'
                      data:
                      - plid: '1280262301'
                        name: ''
                        followers: 1022
                        image_url: null
                        total_percent_overlap: 0.055556
                        count_distinct_tracks: '2'
                        events:
                        - days: 16
                          day_percent_overlap: 0.055556
                          tracks_added:
                          - id: 20654220
                            name: Flou
                            image_url: https://is3-ssl.mzstatic.com/image/thumb/Music118/v4/4f/a7/07/4fa707be-69f1-e04a-cf70-164918eb8fb2/source/160x160bb.jpeg
                            isrc: BE8HB1800014
  /api/playlist/{platform}/{id}/updated:
    get:
      summary: Get Playlist Last Updated Time
      tags:
      - Playlist
      operationId: getPlaylistLastUpdated
      description: Return the last time the playlist itself was observed updated by Chartmetric, and the most recent track add/removal events. For Spotify, also includes `tracks_last_updated` from the ClickHouse cache.
      parameters:
      - name: platform
        in: path
        schema:
          type: string
          enum:
          - spotify
          - itunes
          - applemusic
          - deezer
          - amazon
          - youtube
          - boomplay
          - soundcloud
          description: Streaming platform. One of `spotify`, `itunes`/`applemusic`, `deezer`, `amazon`, `youtube`, `boomplay`, `soundcloud`.
        required: true
        description: Streaming platform. One of `spotify`, `itunes`/`applemusic`, `deezer`, `amazon`, `youtube`, `boomplay`, `soundcloud`.
        examples:
          default:
            value: spotify
      - name: id
        in: path
        schema:
          anyOf:
          - type: integer
            x-required: true
          - type: string
            pattern: ^\d+$
            x-required: true
          - type: string
            x-required: true
          description: Chartmetric playlist ID. Numeric for `spotify`/`itunes`/`applemusic`/`boomplay`; numeric string (bigInt) for `deezer`; string for `amazon`/`youtube`.
        required: true
        description: Chartmetric playlist ID. Numeric for `spotify`/`itunes`/`applemusic`/`boomplay`; numeric string (bigInt) for `deezer`; string for `amazon`/`youtube`.
        examples:
          default:
            value: 1
      - name: storefront
        in: query
        schema:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
        required: false
        description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type:
                    - object
                    - 'null'
                    properties:
                      sys_last_updated:
                        anyOf:
                        - type: string
                          format: date-time
                        nullable: true
                        description: Date when Chartmetric last refreshed the playlist and its stats.
                      playlist_last_updated:
                        anyOf:
                        - type: string
                          format: date-time
                        nullable: true
                        description: Date when a track was last added to or removed from the playlist.
                      last_added:
                        anyOf:
                        - type: string
                          format: date-time
                        nullable: true
                        description: Date when a track was last added to the playlist.
                      last_removed:
                        anyOf:
                        - type: string
                          format: date-time
                        nullable: true
                        description: Date when a track was last removed from the playlist.
                      tracks_last_updated:
                        anyOf:
                        - type: string
                          format: date-time
                        nullable: true
                        description: Date the ClickHouse tracks cache was last refreshed for the playlist (Spotify only).
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      sys_last_updated: '2022-07-28T00:00:00.000Z'
                      last_added: '2022-07-22T00:04:38.539Z'
                      last_removed: '2022-07-22T00:04:41.687Z'
