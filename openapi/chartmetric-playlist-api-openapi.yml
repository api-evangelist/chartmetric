  /api/playlist/{platform}/{id}/refresh:
    post:
      summary: Refresh Playlist Stats On Demand
      tags:
      - Playlist
      operationId: refreshPlaylistStats
      description: 'Fetch fresh follower data for a playlist from the platform now, then return `{ refresh, stats }`: how the refresh ended, and the updated follower series. Priced separately from `GET /api/playlist/{platform}/{id}/stats`.


        Supported for `platform=spotify` only; other platforms return 400. The series is the stored history with the refreshed points laid on top by day, so a playlist new to the refresh keeps its past. One refresh per playlist per hour: inside that window nothing is fetched, `refresh.status` is `already_fetched` and the call is not charged. A call that has nothing to refresh (`not_in_catalog`) is not charged either. A refresh that could not run is reported under `refresh`, not as an HTTP error. The request stays open until the refresh finishes, which can take a few minutes.'
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric playlist ID (not the platform-native ID).
        required: true
        description: Chartmetric playlist ID (not the platform-native ID).
        examples:
          default:
            value: 1
      - name: platform
        in: path
        schema:
          type: string
          enum:
          - spotify
          description: Streaming platform. Only `spotify` can be refreshed on demand.
        required: true
        description: Streaming platform. Only `spotify` can be refreshed on demand.
        examples:
          default:
            value: spotify
      - name: since
        in: query
        schema:
          type: string
          format: date
          description: Inclusive start of the follower series returned after the refresh, in `YYYY-MM-DD` format. Defaults to 180 days before today. Does not change what is refreshed.
          default: '2026-04-22'
        required: false
        description: Inclusive start of the follower series returned after the refresh, in `YYYY-MM-DD` format. Defaults to 180 days before today. Does not change what is refreshed.
      - name: until
        in: query
        schema:
          type: string
          format: date
          description: Inclusive end of the follower series returned after the refresh, in `YYYY-MM-DD` format. Defaults to today.
          default: '2026-10-19'
        required: false
        description: Inclusive end of the follower series returned after the refresh, in `YYYY-MM-DD` format. Defaults to today.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      refresh:
                        type: object
                        properties:
                          status:
                            type: string
                            enum:
                            - done
                            - already_fetched
                            - already_refreshing
                            - not_in_catalog
                            - skipped
                            - error
                            description: 'How the refresh ended. `done`: fresh data was fetched and written, and `stats` includes it. `already_fetched`: this playlist was refreshed within the last hour; stored data is returned. `already_refreshing`: another refresh of this playlist is running right now. `not_in_catalog`: the playlist cannot be refreshed. `skipped` / `error`: see `skip_reason` / `error_code`.'
                          run_id:
                            type:
                            - string
                            - 'null'
                            description: Identifier of the refresh run, for support requests.
                          ts:
                            type:
                            - string
                            - 'null'
                            description: When the outcome was reported (ISO 8601).
                          cm_playlist_id:
                            type: integer
                            description: Chartmetric playlist ID that was refreshed.
                          spotify_playlist_id:
                            type:
                            - string
                            - 'null'
                            description: Spotify ID of the refreshed playlist.
                          fetched_at:
                            type:
                            - string
                            - 'null'
                            description: 'On `done`: when the source data was obtained (ISO 8601). Can predate the request when the source served a same-day snapshot.'
                          partial:
                            type: boolean
                            description: 'On `done`: true when some steps of the run did not complete.'
                          steps:
                            type: object
                            properties: {}
                            description: 'On `done`: the pipeline''s own counters and flags for the run.'
                          last_refreshed_at:
                            type:
                            - string
                            - 'null'
                            description: 'On `already_fetched`: when the current refresh window started (ISO 8601).'
                          next_allowed_at:
                            type:
                            - string
                            - 'null'
                            description: 'On `already_fetched`: when the next refresh is allowed (ISO 8601).'
                          skip_reason:
                            type:
                            - string
                            - 'null'
                            description: 'On `skipped` / `already_refreshing`: why nothing was written.'
                          error_code:
                            type:
                            - string
                            - 'null'
                            description: 'On `error`: a short machine-readable cause, e.g. `upstream_unavailable`, `timeout`, `pipeline_error`.'
                        description: Outcome of the on-demand refresh.
                      stats:
                        type: array
                        items:
                          anyOf:
                          - type: object
                            properties:
                              value:
                                type:
                                - integer
                                - 'null'
                                minimum: 0
                                description: Follower count at this timestamp.
                              timestp:
                                anyOf:
                                - type: string
                                - type: string
                                  format: date-time
                                description: Day of the data point. `YYYY-MM-DD` on a refreshed point; a stored point keeps its own form.
                              daily_diff:
                                type:
                                - integer
                                - 'null'
                                description: Change in `value` since the previous point of the merged series; null on the first.
                              interpolated:
                                type: boolean
                                description: Whether `value` was interpolated. Always false on a refreshed point.
                          - type: object
                            properties:
                              id:
                                type: integer
                                minimum: 0
                                maximum: 2147483647
                                description: Internal stat row ID.
                              value:
                                type: integer
                                minimum: 0
                                description: 'Stat value at this timestamp. Meaning varies by platform: Spotify followers, Deezer fans, YouTube views, SoundCloud likes.'
                              timestp:
                                anyOf:
                                - type: string
                                - type: string
                                  format: date-time
                                description: Timestamp of the data point.
                              daily_diff:
                                type:
                                - integer
                                - 'null'
                                description: Day-over-day change in `value`.
                              weekly_diff:
                                type:
                                - integer
                                - 'null'
                                description: Week-over-week change in `value`.
                              weekly_diff_percent:
                                type:
                                - number
                                - 'null'
                                format: float
                                description: Week-over-week change as a fraction of the prior value.
                              monthly_diff:
                                type:
                                - integer
                                - 'null'
                                description: Month-over-month change in `value`.
                              monthly_diff_percent:
                                type:
                                - number
                                - 'null'
                                format: float
                                description: Month-over-month change as a fraction of the prior value.
                              interpolated:
                                type: boolean
                                description: Whether `value` was interpolated to fill a gap in source data.
                              extrapolated:
                                type: boolean
                                description: Whether `value` was extrapolated past the latest source data point.
                              flags:
                                type: boolean
                                description: Whether the stat row is flagged for review.
                            required:
                            - value
                            - timestp
                        description: The follower series, one point per day.
                    required:
                    - refresh
                    - stats
                    additionalProperties: false
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      refresh:
                        status: done
                        run_id: 6f1c0a2e-4b7d-4c1e-9a55-2f0d3c1b8e77
                        cm_playlist_id: 179228
                        spotify_playlist_id: 37i9dQZF1DXcBWIGoYBM5M
                        fetched_at: '2026-10-12T17:02:11.000Z'
                        partial: false
                        steps: {}
                        ts: '2026-10-12T17:02:14.512Z'
                      stats:
                      - value: 6527755
                        timestp: '2026-10-12'
                        daily_diff: 1204
                        interpolated: false
