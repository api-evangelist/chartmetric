  /api/playlist/by/{type}/{id}/evolution:
    get:
      summary: Get Playlist Evolution by Artist, Album, or Track
      tags:
      - Playlist
      operationId: getPlaylistEvolutionByEntity
      description: Daily playlist-count and total-reach time series across six streaming platforms for the given entity (`artist`, `album`, or `track`). iTunes, Amazon, and SoundCloud only expose counts (no reach). Reach numbers can exceed the 32-bit range.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          description: Chartmetric metadata ID for the entity selected by `type` (artist, album, or track ID).
        required: true
        description: Chartmetric metadata ID for the entity selected by `type` (artist, album, or track ID).
        examples:
          default:
            value: 1
      - name: type
        in: path
        schema:
          type: string
          enum:
          - artist
          - track
          - album
          description: Chartmetric metadata type. One of `artist`, `album`, or `track`.
        required: true
        description: Chartmetric metadata type. One of `artist`, `album`, or `track`.
        examples:
          default:
            value: artist
      - name: since
        in: query
        schema:
          type: string
          format: date
          description: Inclusive start of the date range in `YYYY-MM-DD` format. Defaults to 180 days before today.
          default: '2026-04-22'
        required: false
        description: Inclusive start of the date range in `YYYY-MM-DD` format. Defaults to 180 days before today.
      - name: until
        in: query
        schema:
          type: string
          format: date
          description: Inclusive end of the date range in `YYYY-MM-DD` format. Defaults to today.
          default: '2026-10-19'
        required: false
        description: Inclusive end of the date range in `YYYY-MM-DD` format. Defaults to today.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    anyOf:
                    - type: object
                      properties:
                        spotify:
                          type: array
                          items:
                            type: object
                            properties:
                              created_at:
                                anyOf:
                                - type: string
                                - type: string
                                  format: date-time
