openapi: 3.2.0
info:
  title: Chartmetric Developer Playlist API
  description: 'Public API documentation for the Chartmetric Developer API.


    ## Credit consumption


    On the Prepaid API plan every request consumes API credits. Most endpoints cost

    **1 credit** per request. Premium endpoints — labelled `💎 Premium` in their title —

    return higher-cost audience and playlist data and consume **2 credits** per request:


    - `GET /api/artist/{id}/instagram-audience-stats`

    - `GET /api/artist/{id}/instagram-audience-stats/dates`

    - `GET /api/artist/{id}/social-audience-stats`

    - `GET /api/artist/{id}/tiktok-audience-stats`

    - `GET /api/artist/{id}/tiktok-influencer-stats`

    - `GET /api/artist/{id}/tiktok-top-influencers`

    - `GET /api/artist/{id}/tiktok-top-videos`

    - `GET /api/artist/{id}/where-people-listen`

    - `GET /api/artist/{id}/youtube-audience-stats`

    - `GET /api/artist/{id}/{platform}/{status}/playlists`

    - `GET /api/brand/v2/{brandId}/audience`

    - `GET /api/track/{id}/tiktok-influencer-stats`

    - `GET /api/track/{id}/tiktok-top-influencers`

    - `GET /api/track/{id}/tiktok-top-sounds`

    - `GET /api/track/{id}/topVideos`


    Credits are deducted when the request is received, regardless of the number of rows

    returned. Your remaining balance and the current per-endpoint costs are shown in your

    Chartmetric account under Settings → API Usage. Fixed-rate monthly API plans are not

    billed per request; they are limited by their request rate instead.'
  version: 1.0.1589
  contact:
    name: Chartmetric API Support
    email: backend-engineering@chartmetric.com
servers:
- url: https://api.chartmetric.com
  description: Production
security:
- BearerAuth: []
tags:
- name: Playlist
  description: Playlists across Spotify, Apple Music, Amazon, Deezer, YouTube, iTunes and SoundCloud. Endpoints list playlists per platform and return playlist metadata, follower and position history, current or past tracklists, a snapshot for a specific date, similar playlists, the last time the playlist was updated, and the playlist journey of an artist, album or track.
paths:
  /api/playlist/amazon/lists:
    get:
      summary: List Amazon Playlists
      tags:
      - Playlist
      operationId: listPlaylistsAmazon
      description: List amazon playlists with filters (flags, catalogs, tags, moods, activities, etc.), sorting, and pagination. Response shape varies slightly per platform (e.g. Spotify exposes `followers`/`fdiff_*`, YouTube exposes `views`/`vdiff_*`, SoundCloud exposes `latest`/`monthly_diff`). Reach/follower columns may exceed the 32-bit range.
      parameters:
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          description: Number of items to skip from the start of the result set; pair with `limit` to paginate. `offset + limit` must be ≤ 10,000 (Elasticsearch window).
        required: false
        description: Number of items to skip from the start of the result set; pair with `limit` to paginate. `offset + limit` must be ≤ 10,000 (Elasticsearch window).
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 0
          description: Maximum number of playlists to return per request. Defaults to 50; max 10000. `offset + limit` must be ≤ 10,000.
          default: 50
        required: false
        description: Maximum number of playlists to return per request. Defaults to 50; max 10000. `offset + limit` must be ≤ 10,000.
      - name: tagIds[]
        in: query
        schema:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 2147483647
            title: genre ID
          description: Filter by Chartmetric genre/tag IDs the playlist is tagged with.
        required: false
        description: Filter by Chartmetric genre/tag IDs the playlist is tagged with.
      - name: sortColumn
        in: query
        schema:
          type: string
          enum:
          - active_ratio
          - last_updated
          - num_track
          - rank
          description: Column to sort playlists by. Allowed values vary per platform; default also varies per platform.
          default: rank
        required: false
        description: Column to sort playlists by. Allowed values vary per platform; default also varies per platform.
      - name: sortOrderDesc
        in: query
        schema:
          type: boolean
          description: If true, sort `sortColumn` in descending order. Defaults to true.
          default: true
        required: false
        description: If true, sort `sortColumn` in descending order. Defaults to true.
      - name: code2
        in: query
        schema:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
        required: false
        description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
      - name: editorial
        in: query
        schema:
          type: boolean
          description: Filter to only editorial playlists curated by the platform (e.g. Spotify-owned). Defaults to true; pass `false` to include user-curated playlists.
          default: true
        required: false
        description: Filter to only editorial playlists curated by the platform (e.g. Spotify-owned). Defaults to true; pass `false` to include user-curated playlists.
      - name: topPlaylist
        in: query
        schema:
          type: boolean
          description: Filter to only top playlists (high-reach, frequently-updated playlists curated by Chartmetric editors).
        required: false
        description: Filter to only top playlists (high-reach, frequently-updated playlists curated by Chartmetric editors).
      - name: descriptionSearch
        in: query
        schema:
          type: string
          description: Substring match against the playlist description.
        required: false
        description: Substring match against the playlist description.
      - name: userListIds[]
        in: query
        schema:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 2147483647
          uniqueItems: true
          description: Filter by Chartmetric shortlist (user list) IDs the playlist is included on. Public API exposes this as `shortlistIds`.
        required: false
        description: Filter by Chartmetric shortlist (user list) IDs the playlist is included on. Public API exposes this as `shortlistIds`.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        position:
                          type: integer
                          minimum: 0
                          description: Absolute position of the playlist in the result set after filtering and sorting (1-indexed, accounts for `offset`).
                        id:
                          anyOf:
                          - type: integer
                            minimum: 0
                          - type: string
                          description: Chartmetric playlist ID. Numeric for Spotify/iTunes/Deezer; string for Amazon (ASIN) and YouTube (channel/playlist ID).
                        name:
                          type:
                          - string
                          - 'null'
                          description: Playlist name.
                        image_url:
                          type:
                          - string
                          - 'null'
                          description: Cover image URL.
                        description:
                          type:
                          - string
                          - 'null'
                          description: Playlist description as set by the curator.
                        active_ratio:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Ratio (0–1) measuring how actively the playlist is being updated.
                        num_track:
                          anyOf:
                          - type: integer
                          - type: string
                          nullable: true
                          description: Total number of tracks currently on the playlist.
                        last_updated:
                          anyOf:
                          - type: string
                            format: date-time
                          - type: number
                            format: float
                          nullable: true
                          description: Date when Chartmetric last observed an update to the playlist.
                        owner_id:
                          anyOf:
                          - type: integer
                          - type: string
                          nullable: true
                          description: Chartmetric curator (owner) ID for the playlist.
                        owner_name:
                          type:
                          - string
                          - 'null'
                          description: Display name of the playlist owner.
                        code2:
                          type:
                          - string
                          - 'null'
                          description: Country code associated with the playlist as ISO 3166-1 alpha-2 (e.g. 'US').
                        editorial:
                          type: boolean
                          description: Whether the playlist is curated by an official editorial team. Applies mainly to Spotify, Apple Music, and Deezer.
                        genre:
                          type:
                          - string
                          - 'null'
                          description: Comma-separated list of genres associated with the playlist.
                        followers:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          description: Current follower/fan count of the playlist (Spotify followers, Deezer fans). May exceed the 32-bit range.
                        fdiff_week:
                          type:
                          - integer
                          - 'null'
                          description: Difference in followers/likes vs. one week ago (weekly net growth).
                        fdiff_percent_week:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Weekly follower/like growth as a fraction of the prior value (e.g. `0.05` means +5%).
                        fdiff_month:
                          type:
                          - integer
                          - 'null'
                          description: Difference in followers/likes vs. one month ago (monthly net growth).
                        fdiff_percent_month:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Monthly follower/like growth as a fraction of the prior value.
                        playlist_id:
                          anyOf:
                          - type: integer
                            minimum: 0
                          - type: string
                          nullable: true
                          description: Platform-native playlist ID (e.g. Spotify URI suffix).
                        user_id:
                          type:
                          - string
                          - 'null'
                          description: Platform-native owner/user ID (e.g. Spotify user ID).
                        catalog:
                          type:
                          - string
                          - 'null'
                          description: Catalog classification of the playlist tracks (e.g. `frontline`, `catalogue`, `mixed`).
                        personalized:
                          type: boolean
                          description: Whether the playlist is personalized (varies per listener, e.g. Discover Weekly).
                        playlist_updated:
                          anyOf:
                          - type: string
                            format: date-time
                          - type: number
                            format: float
                          nullable: true
                          description: Date when the playlist contents (track list) were last changed.
                        tag_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type: integer
                            minimum: 0
                          description: Chartmetric tag/genre IDs associated with the playlist.
                        suspicion_score:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Score indicating likelihood of suspicious activity on the playlist (0–100). Higher means more suspicious.
                        submithub_url:
                          type:
                          - string
                          - 'null'
                          description: SubmitHub submission URL for the playlist's curator, if available.
                        groover_url:
                          type:
                          - string
                          - 'null'
                          description: Groover submission URL for the playlist's curator, if available.
                        score_100:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Chartmetric's 0–100 quality score for the playlist.
                        views:
                          type:
                          - integer
                          - 'null'
                          minimum: 0
                          description: Current view count of the playlist (YouTube). May exceed the 32-bit range.
                        vdiff_week:
                          type:
                          - integer
                          - 'null'
                          description: Difference in views vs. one week ago (YouTube).
                        vdiff_percent_week:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Weekly view-count growth as a fraction (YouTube).
                        vdiff_month:
                          type:
                          - integer
                          - 'null'
                          description: Difference in views vs. one month ago (YouTube).
                        vdiff_percent_month:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Monthly view-count growth as a fraction (YouTube).
                        youtube_last_updated:
                          anyOf:
                          - type: string
                            format: date-time
                          nullable: true
                          description: Date when the YouTube playlist was last observed updated.
                        permalink:
                          type:
                          - string
                          - 'null'
                          description: SoundCloud playlist permalink slug.
                        artist_permalink:
                          type:
                          - string
                          - 'null'
                          description: SoundCloud permalink slug of the playlist's artist/owner.
                        soundcloud_artist_name:
                          type:
                          - string
                          - 'null'
                          description: Display name of the playlist's artist on SoundCloud.
                        monthly_diff:
                          description: Monthly difference for the platform-specific stat (SoundCloud).
                        monthly_diff_percent:
                          description: Monthly difference percent for the platform-specific stat (SoundCloud).
                        latest:
                          description: Latest value of the platform-specific stat (SoundCloud likes).
                        soundcloud_updated:
                          anyOf:
                          - type: string
                            format: date-time
                          - type: number
                            format: float
                          nullable: true
                          description: Date when the SoundCloud playlist was last observed updated.
                        with_storefronts:
                          type: boolean
                          description: Whether storefront-level data (`code2s`) is attached to this entry (iTunes).
                        code2s:
                          type: array
                          items:
                            type: string
                          description: List of ISO 3166-1 alpha-2 storefronts where the playlist is available (iTunes).
                        chart:
                          type: boolean
                          description: Whether the playlist is a platform chart playlist (e.g. Top 50).
                        radio:
                          type: boolean
                          description: Whether the playlist is an algorithmic radio-style playlist seeded from a track or artist.
                        music_brand_curator:
                          type: boolean
                          description: Whether the curator is a music-industry brand (label or music publication).
                        non_music_brand_curator:
                          type: boolean
                          description: Whether the curator is a non-music-industry brand (retailer, media outlet, lifestyle).
                        editorial_brand:
                          type: boolean
                          description: Whether the playlist is an editorial playlist operated by a brand.
                        indie_curator:
                          type: boolean
                          description: Whether the curator is classified as indie (not editorial / brand / major-label).
                        personality_artist_curator:
                          type: boolean
                          description: Whether the curator is a personality artist (artist with influence beyond their music).
                        curator_id:
                          anyOf:
                          - type: integer
                            minimum: 0
                          - type: string
                          nullable: true
                          description: Chartmetric curator ID for the playlist owner.
                        chart_ranks:
                          type: array
                          items: {}
                          description: Recent chart-rank history of the playlist on the platform (iTunes).
                        rank:
                          type:
                          - integer
                          - 'null'
                          description: Playlist's current rank within Amazon's editorial listing.
                        moods:
                          type:
                          - array
                          - 'null'
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                minimum: 0
                                description: Chartmetric mood ID.
                              name:
                                type:
                                - string
                                - 'null'
                                description: Mood name (e.g. `Chill`, `Energetic`).
                            required:
                            - id
                          description: List of moods associated with the playlist.
                        activities:
                          type:
                          - array
                          - 'null'
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                minimum: 0
                                description: Chartmetric mood ID.
                              name:
                                type:
                                - string
                                - 'null'
                                description: Mood name (e.g. `Chill`, `Energetic`).
                            required:
                            - id
                          description: List of activities associated with the playlist.
                        mood_smart_ordered:
                          type:
                          - array
                          - 'null'
                          items: {}
                          description: Moods sorted by relevance via the smart-ordering algorithm.
                        activity_smart_ordered:
                          type:
                          - array
                          - 'null'
                          items: {}
                          description: Activities sorted by relevance via the smart-ordering algorithm.
                      required:
                      - id
                    description: List of playlists matching the filters and sort.
                  offset:
                    type: integer
                    minimum: 0
                    description: Echo of the request `offset` for client-side pagination tracking.
                  total:
                    type: integer
                    minimum: 0
                    description: Total number of playlists matching the filters before `limit`/`offset` are applied.
                required:
                - obj
                - offset
                - total
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - position: 1
                      id: 1645080
                      code2: null
                      playlist_id: 37i9dQZF1DXcBWIGoYBM5M
                      name: Today's Top Hits
                      image_url: https://i.scdn.co/image/ab67706f00000003a3b1c73cabef96367d1fc553
                      personalized: false
                      followers: 27093574
                      last_updated: '2020-12-21T06:55:23.752Z'
                      owner_name: Spotify
                      owner_id: 2
                      user_id: spotify
                      editorial: true
                      fdiff_week: 15895
                      fdiff_percent_week: 0.05866704777
                      fdiff_month: 56338
                      fdiff_percent_month: 0.2079386057
                      catalog: 'frontline '
                      active_ratio: 1
                      genre: pop, top lists
                    offset: 0
                    total: 1436332
