  /api/city/{id}/{domain}/top-artists:
    get:
      summary: List Top Artists in a City
      tags:
      - City
      operationId: listCityTopArtists
      description: Top artists in a city for a given platform (`domain` in `spotify | youtube | shazam | radio | instagram`). Each item merges per-platform stats (`count`, and `username` when `domain=instagram`) with basic artist info (IDs, audience stats, genre tags, latest release). `count` is surfaced as a string when the underlying aggregate returns a `BIGINT`.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric city ID.
        required: true
        description: Chartmetric city ID.
        examples:
          default:
            value: 1
      - name: domain
        in: path
        schema:
          type: string
          enum:
          - spotify
          - youtube
          - shazam
          - radio
          - instagram
          description: Platform whose audience signal ranks the artists (one of `spotify | youtube | shazam | radio | instagram`).
        required: true
        description: Platform whose audience signal ranks the artists (one of `spotify | youtube | shazam | radio | instagram`).
        examples:
          default:
            value: spotify
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        count:
                          anyOf:
                          - type: integer
                          - type: string
                          nullable: true
                          description: 'Local audience signal: `spotify` → monthly listeners; `youtube` → daily views; `instagram` → followers; `shazam`/`radio` → occurrences. May arrive as a string when the aggregate is `BIGINT`.'
                        username:
                          type:
                          - string
                          - 'null'
                          description: Instagram username of the artist; only populated when `domain=instagram`.
                        id:
                          type: integer
                          minimum: 0
                          maximum: 2147483647
                          description: Chartmetric artist ID.
                        name:
                          type:
                          - string
                          - 'null'
                          description: Artist display name.
                        image_url:
                          type:
                          - string
                          - 'null'
                          description: URL of the artist profile image.
                        isni:
                          type:
                          - string
                          - 'null'
                          description: International Standard Name Identifier (ISNI) of the artist.
                        code2:
                          type:
                          - string
                          - 'null'
                          description: ISO 3166-1 alpha-2 country code of the artist's primary country (2 letters, e.g. 'us', 'br').
                        hometown_city:
                          type:
                          - string
                          - 'null'
                          description: Artist's hometown city.
                        current_city:
                          type:
                          - string
                          - 'null'
                          description: Artist's current city.
                        verified:
                          type:
                          - boolean
                          - 'null'
                          description: Whether the artist is verified on the underlying platform.
                        band:
                          type:
                          - boolean
                          - 'null'
                          description: True when the artist is a band/group rather than a solo act.
                        gender:
                          type:
                          - string
                          - 'null'
                          description: Artist gender label (e.g. 'male', 'female', 'mixed', 'non-binary').
                        sp_followers:
                          type:
                          - integer
                          - 'null'
                          description: Spotify follower count.
                        sp_popularity:
                          type:
                          - integer
                          - 'null'
                          description: Spotify popularity score (0–100).
                        sp_monthly_listeners:
                          type:
                          - integer
                          - 'null'
                          description: Spotify monthly listeners.
                        deezer_fans:
                          type:
                          - integer
                          - 'null'
                          description: Deezer fan count.
                        cm_artist_rank:
                          type:
                          - integer
                          - 'null'
                          description: Global Chartmetric artist rank (1 is highest).
                        cm_artist_score:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Chartmetric artist score (0–100).
                        primary_genre_smart:
                          anyOf:
                          - type: integer
                          - type: string
                          - type: object
                            properties: {}
                          nullable: true
                          description: Primary genre under Chartmetric's smart-genre taxonomy; surfaced as an ID, a name, or a `{id, name}` object depending on the join.
                        tags:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: Genre tags associated with the artist.
                        spotify_artist_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Spotify artist IDs linked to this Chartmetric artist.
                        itunes_artist_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - integer
                            - 'null'
                          description: iTunes/Apple Music artist IDs linked to this Chartmetric artist.
                        deezer_artist_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Deezer artist IDs linked to this Chartmetric artist.
                        amazon_artist_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Amazon Music artist IDs linked to this Chartmetric artist.
                        latest_release:
                          type:
                          - object
                          - 'null'
                          properties:
                            cm_album:
                              type:
                              - integer
                              - 'null'
                              description: Chartmetric album ID of the most recent release.
                            album_name:
                              type:
                              - string
                              - 'null'
                              description: Album title.
                            release_date:
                              type:
                              - string
                              - 'null'
                              format: date-time
                              description: Album release date (ISO 8601).
                            upc:
                              type:
                              - string
                              - 'null'
                              description: Universal Product Code identifying the release.
                            label:
                              type:
                              - string
                              - 'null'
                              description: Record label that released the album.
                            image_url:
                              type:
                              - string
                              - 'null'
                              description: URL of the album cover image.
                          description: Most recent album release attributed to this artist; `null` when the artist has no release on file.
                      required:
                      - id
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - count: '258'
                      id: 1401297
                      name: Pop Smoke
                      image_url: https://i.scdn.co/image/8f0a45ff4868c7868a7996b57da64f2e89042e26
                      isni: null
                      code2: us
                      hometown_city: null
                      current_city: null
                      verified: false
                      band: false
                      gender: null
                      sp_followers: 1374300
                      sp_popularity: 95
                      sp_monthly_listeners: 27687238
                      deezer_fans: 181349
                      cm_artist_rank: 37
                      cm_artist_score: 92.4
                      primary_genre_smart: 501121
                      tags:
                      - rap
                      spotify_artist_ids:
                      - 0eDvMgVFoNV3TpwtrVCoTj
                      itunes_artist_ids:
                      - 1450601383
                      deezer_artist_ids:
                      - '58447102'
                      amazon_artist_ids:
                      - B07N6R3268
                      latest_release:
                        cm_album: 6591557
                        album_name: 今は亡きあの人たち
                        release_date: '2020-08-19T07:00:00.000Z'
                        upc: '602435142609'
                        label: UMG Recordings, Inc.
                        image_url: https://i.scdn.co/image/ab67616d0000b27349066d2258ad2e46955e2381
  /api/city/{id}/{domain}/top-tracks:
    get:
      summary: List Top Tracks in a City
      tags:
      - City
      operationId: listCityTopTracks
      description: Top tracks in a city for a given platform (`domain` in `youtube | shazam | radio`). Each item merges per-platform stats with basic track metadata (cm_track, artists, album info, genre tags). `position_stats` is only populated when `domain=shazam`. `count` is surfaced as a string when the underlying aggregate returns a `BIGINT`.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric city ID.
        required: true
        description: Chartmetric city ID.
        examples:
          default:
            value: 1
      - name: domain
        in: path
        schema:
          type: string
          enum:
          - youtube
          - radio
          - shazam
          description: Platform whose audience signal ranks the tracks (one of `youtube | shazam | radio`).
        required: true
        description: Platform whose audience signal ranks the tracks (one of `youtube | shazam | radio`).
        examples:
          default:
            value: youtube
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        isrc:
                          type: string
                          description: International Standard Recording Code identifying the track.
                        count:
                          anyOf:
                          - type: integer
                          - type: string
                          nullable: true
                          description: 'Local audience signal in this city for the requested `domain`: YouTube daily views or Shazam/radio occurrences. Returned as a string when the underlying aggregate is `BIGINT`.'
                        position_stats:
                          type:
                          - array
                          - 'null'
                          items:
                            type: object
                            properties:
                              timestp:
                                anyOf:
                                - type: string
                                  format: date-time
                                nullable: true
                                description: Timestamp of the chart sample.
                              position:
                                type:
                                - integer
                                - 'null'
                                description: Track position on the chart at this timestamp (1 is highest).
                          description: Chart position history for this track in the city; only populated when `domain=shazam`.
                        id:
                          type:
                          - integer
                          - 'null'
                          description: Chartmetric track ID. Same value as `cm_track`.
                        name:
                          type:
                          - string
                          - 'null'
                          description: Track title.
                        image_url:
                          type:
                          - string
                          - 'null'
                          description: URL of the track artwork.
                        description:
                          type:
                          - string
                          - 'null'
                          description: Free-form description for the track, when available.
                        created_at:
                          anyOf:
                          - type: string
                            format: date-time
                          nullable: true
                          description: Timestamp the track was first ingested into Chartmetric (ISO 8601).
                        modified_at:
                          anyOf:
                          - type: string
                            format: date-time
                          nullable: true
                          description: Timestamp the track metadata was last updated (ISO 8601).
                        tags:
                          anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                          nullable: true
                          description: Genre tags for the track; either a comma-separated string or an array of tag strings depending on the upstream payload.
                        cm_track:
                          type:
                          - integer
                          - 'null'
                          description: Chartmetric track ID.
                        cm_artist:
                          type:
                          - array
                          - 'null'
                          items:
                            type: integer
                          description: Chartmetric artist IDs credited on this track.
                        artist_names:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Display names of the credited artists, aligned with `cm_artist`.
                        code2s:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: ISO 3166-1 alpha-2 country codes of the credited artists, aligned with `cm_artist`.
                        artist_images:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Profile image URLs of the credited artists, aligned with `cm_artist`.
                        artist_covers:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Cover/banner image URLs of the credited artists, aligned with `cm_artist`.
                        artists:
                          type:
                          - array
                          - 'null'
                          items:
                            type: object
                            properties:
                              id:
                                type:
                                - integer
                                - 'null'
                                description: Chartmetric artist ID.
                              name:
                                type:
                                - string
                                - 'null'
                                description: Artist display name.
                          description: Credited artists as `{id, name}` objects; equivalent to zipping `cm_artist` with `artist_names`.
                        spotify_track_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Spotify track IDs linked to this Chartmetric track.
                        spotify_album_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Spotify album IDs the track appears on.
                        spotify_duration_ms:
                          type:
                          - integer
                          - 'null'
                          description: Track duration on Spotify in milliseconds.
                        itunes_track_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: iTunes/Apple Music track IDs linked to this Chartmetric track.
                        itunes_album_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: iTunes/Apple Music album IDs the track appears on.
                        storefronts:
                          type:
                          - array
                          - 'null'
                          items:
                            type: string
                          description: ISO 3166-1 alpha-2 country codes of Apple Music storefronts where the iTunes IDs are valid.
                        deezer_track_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Deezer track IDs linked to this Chartmetric track.
                        deezer_album_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - integer
                            - 'null'
                          description: Deezer album IDs the track appears on.
                        deezer_duration:
                          type:
                          - integer
                          - 'null'
                          description: Track duration on Deezer in seconds.
                        amazon_track_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Amazon Music track IDs linked to this Chartmetric track.
                        amazon_album_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Amazon Music album IDs the track appears on.
                        album_ids:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - integer
                            - 'null'
                          description: Chartmetric album IDs the track appears on.
                        album_names:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Album titles aligned with `album_ids`.
                        album_upc:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Universal Product Codes of the albums the track appears on.
                        album_label:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Record labels of the albums the track appears on.
                        release_dates:
                          type:
                          - array
                          - 'null'
                          items:
                            anyOf:
                            - type: string
                              format: date-time
                            nullable: true
                          description: Release dates of the albums the track appears on (ISO 8601), aligned with `album_ids`.
                      required:
                      - isrc
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - isrc: DEA629252500
                      count: '28'
                      position_stats:
                      - timestp: '2020-08-03'
                        position: 81
                      - timestp: '2020-08-04'
                        position: 58
