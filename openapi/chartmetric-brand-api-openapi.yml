  /api/brand/v2/{brandId}:
    get:
      summary: Get Brand Info (V2)
      tags:
      - Brand
      operationId: getBrandInfoV2
      description: 'Brand profile — identity, categorisation, per-platform follower counts, social handles — plus the artists whose audience best matches the brand.


        Replaces `GET /api/brand/{brandId}`. The two do not share a brand universe, so a `brandId` from V1 is not valid here.


        | V1 | V2 |

        |---|---|

        | Artist list only (`brandName`, `total`, `artists`) | Full brand profile plus the artist list |

        | Instagram followers only | `instagram_followers`, `tiktok_followers`, `youtube_followers` |

        | `affinity`, a ratio around 1.0 | `audience_similarity`, a 0-100 Affinity score |

        | `overlap`, `overlap_percent`, `instagram_likers.*` | no equivalent — the affinity model was rebuilt |


        Returns `null` in `obj` when the brand ID is unknown.'
      parameters:
      - name: brandId
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric brand ID.
        required: true
        description: Chartmetric brand ID.
        examples:
          default:
            value: 1
      - name: sortColumn
        in: query
        schema:
          type: string
          enum:
          - followers
          - name
          - audienceSimilarity
          description: Column used to sort the artist list. One of `followers`, `name`, `audienceSimilarity`. Defaults to `followers`.
          default: followers
        required: false
        description: Column used to sort the artist list. One of `followers`, `name`, `audienceSimilarity`. Defaults to `followers`.
      - name: sortOrderDesc
        in: query
        schema:
          type: boolean
          description: If true (default), sort `sortColumn` in descending order.
          default: true
        required: false
        description: If true (default), sort `sortColumn` in descending order.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of artists to return. Defaults to 10, max 100.
          default: 10
        required: false
        description: Maximum number of artists to return. Defaults to 10, max 100.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
        required: false
        description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
      - name: platform
        in: query
        schema:
          type: string
          enum:
          - instagram
          - tiktok
          - youtube
          description: Platform each artist's `followers` count is reported on, which also determines the `followers` sort order. One of `instagram`, `tiktok`, `youtube`. Defaults to `instagram`. Does not affect `audience_similarity`, which always reflects the strongest platform pair.
          default: instagram
        required: false
        description: Platform each artist's `followers` count is reported on, which also determines the `followers` sort order. One of `instagram`, `tiktok`, `youtube`. Defaults to `instagram`. Does not affect `audience_similarity`, which always reflects the strongest platform pair.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type:
                    - object
                    - 'null'
                    properties:
                      id:
                        type: integer
                        minimum: 0
                        maximum: 2147483647
                        description: Chartmetric brand ID.
                      name:
                        type:
                        - string
                        - 'null'
                        description: Brand name.
                      image_url:
                        type:
                        - string
                        - 'null'
                        description: Brand logo or profile image URL.
                      country:
                        type:
                        - string
                        - 'null'
                        description: Country the brand is based in, as an ISO 3166-1 alpha-2 code (e.g. 'US').
                      category:
                        type:
                        - string
                        - 'null'
                        description: Primary brand category (e.g. `Music`, `Electronics & Computers`).
                      sub_categories:
                        type: array
                        items:
                          type: string
                        description: Finer-grained brand tags. Empty when none are assigned.
                      description:
                        type:
                        - string
                        - 'null'
                        description: Short brand description.
                      instagram_followers:
                        type: integer
                        minimum: 0
                        description: Followers on the brand's own Instagram account. 0 when unavailable.
                      tiktok_followers:
                        type: integer
                        minimum: 0
                        description: Followers on the brand's own TikTok account. 0 when unavailable.
                      youtube_followers:
                        type: integer
                        minimum: 0
                        description: Subscribers on the brand's own YouTube channel. 0 when unavailable.
                      social_links:
                        type: object
                        properties:
                          instagram:
                            type:
                            - string
                            - 'null'
                            description: URL of the brand's Instagram account.
                          tiktok:
                            type:
                            - string
                            - 'null'
                            description: URL of the brand's TikTok account.
                          youtube:
                            type:
                            - string
                            - 'null'
                            description: URL of the brand's YouTube channel.
                        description: Links to the brand's own social accounts. Each entry is null when no account is linked on that platform.
                      artist_count:
                        type: integer
                        minimum: 0
                        description: Total number of artists matched to this brand, ignoring `limit` / `offset`.
                      artists:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              minimum: 0
                              maximum: 2147483647
                              description: Chartmetric artist ID.
                            name:
                              type:
                              - string
                              - 'null'
                              description: Artist name.
                            image_url:
                              type:
                              - string
                              - 'null'
                              description: Artist image URL.
                            country:
                              type:
                              - string
                              - 'null'
                              description: Artist's home country as an ISO 3166-1 alpha-2 code (e.g. 'US').
                            followers:
                              type: integer
                              minimum: 0
                              description: Artist's followers on `platform`.
                            genres:
                              type: array
                              items:
                                type: string
                              description: Genre names for the artist.
                            audience_similarity:
                              type:
                              - number
                              - 'null'
                              format: float
                              description: Affinity between the artist and the brand, 0-100, higher is a stronger match. Always computed from the strongest platform pair, so it does not change with `platform`. Replaces V1 `affinity`, which was a ratio around 1.0 — the scales are not comparable.
                            brand_platform:
                              type:
                              - string
                              - 'null'
                              description: Brand-side platform of the pair that produced `audience_similarity`.
                            best_artist_platform:
                              type:
                              - string
                              - 'null'
                              description: Artist-side platform of the pair that produced `audience_similarity`.
                          required:
                          - id
                          - followers
                          - genres
                        description: Matched artists, sorted and paginated as requested.
                    required:
                    - id
                    - sub_categories
                    - instagram_followers
                    - tiktok_followers
                    - youtube_followers
                    - social_links
                    - artist_count
                    - artists
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      id: 138
                      name: Apple
                      image_url: https://storage.googleapis.com/cm-brand-images/138.jpg
                      country: US
                      category: Electronics & Computers
                      sub_categories:
                      - Smartphones
                      - Computers
                      description: Consumer electronics and software company.
                      instagram_followers: 33500000
                      tiktok_followers: 2100000
                      youtube_followers: 19800000
                      social_links:
                        instagram: https://www.instagram.com/apple
                        tiktok: https://www.tiktok.com/@apple
                        youtube: https://www.youtube.com/@Apple
                      artist_count: 98864
                      artists:
                      - id: 74419
                        name: XXXTENTACION
                        image_url: https://rovimusic.rovicorp.com/image.jpg
                        country: US
                        followers: 20578742
                        genres:
                        - Hip-Hop/Rap
                        - Pop
                        audience_similarity: 87.4
                        brand_platform: instagram
                        best_artist_platform: instagram
