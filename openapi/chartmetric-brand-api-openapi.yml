openapi: 3.2.0
info:
  title: Chartmetric Developer Brand API
  description: 'Public API documentation for the Chartmetric Developer API.


    ## Credit consumption


    On the Prepaid API plan every request consumes API credits. Most endpoints cost

    **1 credit** per request. Premium endpoints — labelled `💎 Premium` in their title —

    return higher-cost audience and playlist data and consume **2 credits** per request:


    - `GET /api/artist/{id}/instagram-audience-stats`

    - `GET /api/artist/{id}/instagram-audience-stats/dates`

    - `GET /api/artist/{id}/social-audience-stats`

    - `GET /api/artist/{id}/tiktok-audience-stats`

    - `GET /api/artist/{id}/tiktok-influencer-stats`

    - `GET /api/artist/{id}/tiktok-top-influencers`

    - `GET /api/artist/{id}/tiktok-top-videos`

    - `GET /api/artist/{id}/where-people-listen`

    - `GET /api/artist/{id}/youtube-audience-stats`

    - `GET /api/artist/{id}/{platform}/{status}/playlists`

    - `GET /api/brand/v2/{brandId}/audience`

    - `GET /api/track/{id}/tiktok-influencer-stats`

    - `GET /api/track/{id}/tiktok-top-influencers`

    - `GET /api/track/{id}/tiktok-top-sounds`

    - `GET /api/track/{id}/topVideos`


    Credits are deducted when the request is received, regardless of the number of rows

    returned. Your remaining balance and the current per-endpoint costs are shown in your

    Chartmetric account under Settings → API Usage. Fixed-rate monthly API plans are not

    billed per request; they are limited by their request rate instead.'
  version: 1.0.1589
  contact:
    name: Chartmetric API Support
    email: backend-engineering@chartmetric.com
servers:
- url: https://api.chartmetric.com
  description: Production
security:
- BearerAuth: []
tags:
- name: Brand
  description: Brands tracked for sponsorship and partnership research. Endpoints list brand names, filter brands by interest category, and return the details of a single brand.
paths:
  /api/brand/list:
    get:
      summary: List Brand Names (deprecated)
      tags:
      - Brand
      operationId: listBrandNames
      description: '**Deprecated — removed after 2026-10-01. Use `GET /api/brand/v2/list` instead.** List all Chartmetric brand IDs and names. Note that V2 reads a different brand universe, so IDs are not interchangeable.'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          minimum: 0
                          maximum: 2147483647
                          description: Chartmetric brand ID.
                        name:
                          type: string
                          description: Brand name.
                      required:
                      - id
                      - name
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - id: 2
                      name: 20th Century Fox
                    - id: 10787
                      name: 24Classics
  /api/brand/list/by/interest:
    get:
      summary: List Brands by Interest Category (deprecated)
      tags:
      - Brand
      operationId: listBrandsByInterest
      description: '**Deprecated — removed after 2026-10-01. Use `GET /api/brand/v2/list/by/category` instead.** Brands grouped by interest category. The response is keyed by interest name (e.g. `Music`, `Electronics & Computers`) with up to 20 brands per category. Note: `sortColumn` is accepted for API compatibility but the handler currently returns a fixed ordering.'
      parameters:
      - name: sortColumn
        in: query
        schema:
          type: string
          enum:
          - followers
          - likers
          description: Column used to order interest groups. One of `followers`, `likers`. Defaults to `followers`.
          default: followers
        required: false
        description: Column used to order interest groups. One of `followers`, `likers`. Defaults to `followers`.
      - name: brandCount
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          description: Maximum number of brands returned per interest category. Defaults to 10, max 50.
          default: 10
        required: false
        description: Maximum number of brands returned per interest category. Defaults to 10, max 50.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties: {}
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          brand_id:
                            type: integer
                            minimum: 0
                            maximum: 2147483647
                            description: Chartmetric brand ID.
                          brand_name:
                            type:
                            - string
                            - 'null'
                            description: Brand name.
                          interest_id:
                            type: integer
                            minimum: 0
                            maximum: 2147483647
                            description: Chartmetric interest category ID.
                          interest_name:
                            type:
                            - string
                            - 'null'
                            description: Interest category name (e.g. `Music`, `Electronics & Computers`).
                          followers:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Sum of Instagram followers across artists whose audience is interested in this brand.
                          artist_count:
                            type:
                            - integer
                            - 'null'
                            minimum: 0
                            description: Number of artists with at least one Instagram follower interested in this brand.
                        required:
                        - brand_id
                        - interest_id
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      Electronics & Computers:
                      - brand_id: 138
                        brand_name: Apple
                        interest_id: 25
                        interest_name: Electronics & Computers
                        followers: 3305301635
                        artist_count: 141435
                      Music: []
  /api/brand/v2/list:
    get:
      summary: List Brand Names (V2)
      tags:
      - Brand
      operationId: listBrandNamesV2
      description: Every Chartmetric brand ID and name. Replaces `GET /api/brand/list`, which reads a different brand universe — IDs are not interchangeable between the two.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          minimum: 0
                          maximum: 2147483647
                          description: Chartmetric brand ID.
                        name:
                          type: string
                          description: Brand name.
                      required:
                      - id
                      - name
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - id: 138
                      name: Apple
                    - id: 2
                      name: 20th Century Fox
  /api/brand/v2/list/by/category:
    get:
      summary: List Brands by Category (V2)
      tags:
      - Brand
      operationId: listBrandsByCategory
      description: 'Brands filtered by category, with the brand’s own follower counts on each supported platform.


        Replaces `GET /api/brand/list/by/interest`. Three differences worth noting when migrating:


        | V1 | V2 |

        |---|---|

        | Response is a map keyed by category name | Response is a flat `data` array with `total` and `facets` |

        | Fixed 20 brands per category, `brandCount` ignored | `limit` / `offset` honored |

        | `followers` = summed Instagram followers of *artists* interested in the brand | `instagram_followers` / `tiktok_followers` = the *brand’s own* account followers |


        The `interest_id` field has no V2 equivalent: categories are derived tags rather than rows with IDs. Use the category name, which `facets.categories` enumerates.'
      parameters:
      - name: category
        in: query
        schema:
          type: string
          maxLength: 200
          description: Restrict results to a single brand category (e.g. `Music`, `Electronics & Computers`). Omit to search across every category. The `facets.categories` block of the response lists every value accepted here.
        required: false
        description: Restrict results to a single brand category (e.g. `Music`, `Electronics & Computers`). Omit to search across every category. The `facets.categories` block of the response lists every value accepted here.
      - name: search
        in: query
        schema:
          type: string
          maxLength: 200
          description: Free-text search over brand names. Omit to search across every brand.
        required: false
        description: Free-text search over brand names. Omit to search across every brand.
      - name: sortColumn
        in: query
        schema:
          type: string
          enum:
          - name
          - artistCount
          - instagramFollowers
          - tiktokFollowers
          description: Column used to sort brands. One of `name`, `artistCount`, `instagramFollowers`, `tiktokFollowers`. Defaults to `instagramFollowers`.
          default: instagramFollowers
        required: false
        description: Column used to sort brands. One of `name`, `artistCount`, `instagramFollowers`, `tiktokFollowers`. Defaults to `instagramFollowers`.
      - name: sortOrderDesc
        in: query
        schema:
          type: boolean
          description: If true (default), sort `sortColumn` in descending order.
          default: true
        required: false
        description: If true (default), sort `sortColumn` in descending order.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          description: Maximum number of brands to return. Defaults to 20, max 100.
          default: 20
        required: false
        description: Maximum number of brands to return. Defaults to 20, max 100.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
        required: false
        description: Number of items to skip from the start of the result set; pair with `limit` to paginate.
      - name: countries[]
        in: query
        schema:
          type: array
          items:
            type: string
            minLength: 2
            maxLength: 2
            description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
          description: Restrict results to brands based in these countries, as ISO 3166-1 alpha-2 codes (e.g. 'US', 'BR').
        required: false
        description: Restrict results to brands based in these countries, as ISO 3166-1 alpha-2 codes (e.g. 'US', 'BR').
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              minimum: 0
                              maximum: 2147483647
                              description: Chartmetric brand ID.
                            name:
                              type: string
                              description: Brand name.
                            image_url:
                              type:
                              - string
                              - 'null'
                              description: Brand logo or profile image URL.
                            category:
                              type:
                              - string
                              - 'null'
                              description: Primary brand category (e.g. `Music`, `Electronics & Computers`).
                            country:
                              type:
                              - string
                              - 'null'
                              description: Country the brand is based in, as an ISO 3166-1 alpha-2 code (e.g. 'US').
                            description:
                              type:
                              - string
                              - 'null'
                              description: Short brand description.
                            instagram_followers:
                              type: integer
                              minimum: 0
                              description: Followers on the brand's own Instagram account. 0 when unavailable.
                            tiktok_followers:
                              type: integer
                              minimum: 0
                              description: Followers on the brand's own TikTok account. 0 when unavailable.
                            youtube_followers:
                              type: integer
                              minimum: 0
                              description: Subscribers on the brand's own YouTube channel. 0 when unavailable.
                            social_links:
                              type: object
                              properties:
                                instagram:
                                  type:
                                  - string
                                  - 'null'
                                  description: URL of the brand's Instagram account.
                                tiktok:
                                  type:
                                  - string
                                  - 'null'
                                  description: URL of the brand's TikTok account.
                                youtube:
                                  type:
                                  - string
                                  - 'null'
                                  description: URL of the brand's YouTube channel.
                              description: Links to the brand's own social accounts. Each entry is null when no account is linked on that platform.
                            artist_count:
                              type: integer
                              minimum: 0
                              description: Number of artists whose audience matches this brand.
                          required:
                          - id
                          - name
                          - instagram_followers
                          - tiktok_followers
                          - youtube_followers
                          - social_links
                          - artist_count
                        description: Brands matching the filters, sorted and paginated as requested.
                      total:
                        type: integer
                        minimum: 0
                        description: Total number of brands matching the filters, ignoring `limit` / `offset`.
                      facets:
                        type: object
                        properties:
                          categories:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  description: Facet value, usable as a filter parameter.
                                count:
                                  type: integer
                                  minimum: 0
                                  description: Number of brands carrying this value.
                              required:
                              - name
                              - count
                            description: Every category present in the unfiltered result set, with brand counts.
                          subcategories:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  description: Facet value, usable as a filter parameter.
                                count:
                                  type: integer
                                  minimum: 0
                                  description: Number of brands carrying this value.
                              required:
                              - name
                              - count
                            description: Every sub-category present in the unfiltered result set, with brand counts.
                          countries:
                            type: array
                            items:
                              type: object
                              properties:
                                code:
                                  type: string
                                  minLength: 2
                                  maxLength: 2
                                  description: ISO 3166-1 alpha-2 country code.
                                count:
                                  type: integer
                                  minimum: 0
                                  description: Number of brands based in this country.
                              required:
                              - code
                              - count
                            description: Every brand country present in the unfiltered result set, with brand counts.
                        required:
                        - categories
                        - subcategories
                        - countries
                        description: Valid values for the filter parameters, with per-value brand counts.
                    required:
                    - data
                    - total
                    - facets
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                      data:
                      - id: 138
                        name: Apple
                        image_url: https://storage.googleapis.com/cm-brand-images/138.jpg
                        category: Electronics & Computers
                        country: US
                        description: Consumer electronics and software company.
                        instagram_followers: 33500000
                        tiktok_followers: 2100000
                        youtube_followers: 19800000
                        social_links:
                          instagram: https://www.instagram.com/apple
                          tiktok: https://www.tiktok.com/@apple
                          youtube: https://www.youtube.com/@Apple
                        artist_count: 141435
                      total: 1
                      facets:
                        categories:
                        - name: Electronics & Computers
                          count: 412
                        subcategories:
                        - name: Smartphones
                          count: 37
                        countries:
                        - code: US
                          count: 288
