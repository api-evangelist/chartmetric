  /api/brand/v2/{brandId}/audience:
    get:
      summary: 💎 Premium — Brand Audience
      tags:
      - Brand
      operationId: getBrandAudienceV2
      description: 'The brand''s own audience breakdown on a given platform — gender and age split, plus the countries, languages and ethnicities its followers skew toward.


        Sourced from the brand''s own account rather than from the artists matched to it. Mirrors the artist audience endpoints; the brand profile at `GET /api/brand/v2/{brandId}` does not carry this data.


        Every weight is a `0`-`1` fraction. `top_ethnicities` is Instagram-only and comes back empty when `platform` is `tiktok` or `youtube`. When no report exists for the brand on the requested platform, `source_platform` is `null` and the lists are empty.'
      parameters:
      - name: brandId
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric brand ID.
        required: true
        description: Chartmetric brand ID.
        examples:
          default:
            value: 1
      - name: platform
        in: query
        schema:
          type: string
          enum:
          - instagram
          - tiktok
          - youtube
          description: Platform the audience breakdown is sourced from. One of `instagram`, `tiktok`, `youtube`. Defaults to `instagram`. Ethnicity data exists on Instagram only, so `top_ethnicities` is empty for the other platforms.
          default: instagram
        required: false
        description: Platform the audience breakdown is sourced from. One of `instagram`, `tiktok`, `youtube`. Defaults to `instagram`. Ethnicity data exists on Instagram only, so `top_ethnicities` is empty for the other platforms.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: object
                    properties:
                      source_platform:
                        type:
                        - string
                        - 'null'
                        description: Platform the breakdown was sourced from. Null when no report was available.
                      demographics:
                        type:
                        - object
                        - 'null'
                        properties:
                          male_percent:
                            type:
                            - number
                            - 'null'
                            format: float
                            description: Share of the audience that is male, 0-1.
                          female_percent:
                            type:
                            - number
                            - 'null'
                            format: float
                            description: Share of the audience that is female, 0-1.
                          age_groups:
                            type: object
                            properties: {}
                            additionalProperties:
                              type: number
                              format: float
                            description: Share of the audience per age bracket, keyed by bracket, 0-1.
                        description: Age and gender split. Null when unavailable.
                      top_countries:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type:
                              - string
                              - 'null'
                              description: Code identifying the country.
                            name:
                              type:
                              - string
                              - 'null'
                              description: Display name of the country.
                            weight:
                              type:
                              - number
                              - 'null'
                              format: float
