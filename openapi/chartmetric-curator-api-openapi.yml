  /api/curator/{platform}/{id}/urls:
    get:
      summary: List Curator Social / Streaming URLs
      tags:
      - Curator
      operationId: listCuratorSocialUrls
      description: Get social media and streaming service URLs belonging to this curator. `url` is a string when a URL is known; the handler emits an empty array `[]` when SNS data has no URL for the domain.
      parameters:
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric curator ID.
        required: true
        description: Chartmetric curator ID.
        examples:
          default:
            value: 1
      - name: platform
        in: path
        schema:
          type: string
          enum:
          - spotify
          - applemusic
          - deezer
          description: Streaming platform. Social URLs are supported on `spotify`, `applemusic`, `deezer`.
        required: true
        description: Streaming platform. Social URLs are supported on `spotify`, `applemusic`, `deezer`.
        examples:
          default:
            value: spotify
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        domain:
                          type: string
                          description: Social or streaming domain key (e.g. 'youtube', 'facebook', 'instagram', 'spotify', 'website').
                        url:
                          anyOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                          nullable: true
                          description: URL string when known. The handler emits an empty array `[]` when the SNS record has no URL for this domain.
                      required:
                      - domain
                    description: List of `{domain, url}` entries for the curator's known social and streaming presence.
                required:
                - obj
                additionalProperties: false
              examples:
                default:
                  value:
                    obj:
                    - domain: youtube
                      url: https://www.youtube.com/channel/UC4sYm9wRMr4uUVln4DywKOg
                    - domain: website
                      url: https://filtr.com/
                    - domain: soundcloud
                      url: https://soundcloud.com/filtr
                    - domain: facebook
                      url: https://www.facebook.com/filtr/
                    - domain: instagram
                      url: https://www.instagram.com/filtr/
                    - domain: tiktok
                      url: https://www.tiktok.com/@filtr.music
                    - domain: spotify
                      url: https://open.spotify.com/user/myplay.com
  /api/curator/{platform}/{id}/stat/{source}:
    get:
      summary: Get Curator Fan Metrics
      tags:
      - Curator
      operationId: getCuratorFanMetrics
      description: 'Time-series fan metrics for a curator from a given `source` (one of `spotify`, `facebook`, `twitter`, `youtube_channel`, `instagram`, `tiktok`). Pass `field` to request a single metric (e.g. `followers`, `likes`), or omit it for source defaults: spotify → `followers`; facebook → `followers`, `likes`, `talks`; twitter → `followers`; youtube_channel → `subscribers`, `views`, `videos`; instagram → `followers`; tiktok → `followers`, `likes`.'
      parameters:
      - name: platform
        in: path
        schema:
          type: string
          enum:
          - spotify
          - itunes
          - applemusic
          - deezer
          description: 'Streaming platform of the curator. Allowed: `spotify`, `itunes`, `applemusic`, `deezer` (`itunes` and `applemusic` return the same data).'
        required: true
        description: 'Streaming platform of the curator. Allowed: `spotify`, `itunes`, `applemusic`, `deezer` (`itunes` and `applemusic` return the same data).'
        examples:
          default:
            value: spotify
      - name: id
        in: path
        schema:
          type: integer
          minimum: 0
          maximum: 2147483647
          description: Chartmetric curator ID.
        required: true
        description: Chartmetric curator ID.
        examples:
          default:
            value: 1
      - name: source
        in: path
        schema:
          type: string
          enum:
          - spotify
          - facebook
          - twitter
          - youtube_channel
          - instagram
          - tiktok
          description: Social/streaming source for the metric. One of `spotify`, `facebook`, `twitter`, `youtube_channel`, `instagram`, `tiktok`. Pair with `field` to request a single metric.
        required: true
        description: Social/streaming source for the metric. One of `spotify`, `facebook`, `twitter`, `youtube_channel`, `instagram`, `tiktok`. Pair with `field` to request a single metric.
        examples:
