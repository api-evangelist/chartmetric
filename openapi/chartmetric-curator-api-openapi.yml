openapi: 3.2.0
info:
  title: Chartmetric Developer Curator API
  description: 'Public API documentation for the Chartmetric Developer API.


    ## Credit consumption


    On the Prepaid API plan every request consumes API credits. Most endpoints cost

    **1 credit** per request. Premium endpoints — labelled `💎 Premium` in their title —

    return higher-cost audience and playlist data and consume **2 credits** per request:


    - `GET /api/artist/{id}/instagram-audience-stats`

    - `GET /api/artist/{id}/instagram-audience-stats/dates`

    - `GET /api/artist/{id}/social-audience-stats`

    - `GET /api/artist/{id}/tiktok-audience-stats`

    - `GET /api/artist/{id}/tiktok-influencer-stats`

    - `GET /api/artist/{id}/tiktok-top-influencers`

    - `GET /api/artist/{id}/tiktok-top-videos`

    - `GET /api/artist/{id}/where-people-listen`

    - `GET /api/artist/{id}/youtube-audience-stats`

    - `GET /api/artist/{id}/{platform}/{status}/playlists`

    - `GET /api/brand/v2/{brandId}/audience`

    - `GET /api/track/{id}/tiktok-influencer-stats`

    - `GET /api/track/{id}/tiktok-top-influencers`

    - `GET /api/track/{id}/tiktok-top-sounds`

    - `GET /api/track/{id}/topVideos`


    Credits are deducted when the request is received, regardless of the number of rows

    returned. Your remaining balance and the current per-endpoint costs are shown in your

    Chartmetric account under Settings → API Usage. Fixed-rate monthly API plans are not

    billed per request; they are limited by their request rate instead.'
  version: 1.0.1589
  contact:
    name: Chartmetric API Support
    email: backend-engineering@chartmetric.com
servers:
- url: https://api.chartmetric.com
  description: Production
security:
- BearerAuth: []
tags:
- name: Curator
  description: Playlist curators — the editorial and user accounts that own playlists on Spotify, Apple Music, Amazon, Deezer, YouTube and iTunes. Endpoints list curators per platform and return a curator's metadata, social and streaming URLs, follower metrics over time, and playlists.
paths:
  /api/curator/deezer/lists:
    get:
      summary: List Deezer Curators
      tags:
      - Curator
      operationId: listCuratorsDeezer
      description: 'List curators by platform. Sort columns vary by platform: `spotify` — `num_playlists` (default), `followers`, `num_updates`, `num_tracks_updated`, `fdiff_month`, `fdiff_percent_month`, `sp_playlist_total_reach`; `applemusic`/`itunes` — `num_playlists` (default); `deezer` — `num_playlists`, `total_reach` (default); `youtube` — `total_playlist_views` (default), `num_playlists`, `channel_views`, `channel_subscribers`; `amazon` — `total_playlists` (default).'
      parameters:
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 10000
          description: Number of items to skip from the start of the result set; pair with `limit` to paginate. `offset + limit` must be ≤ 10,000 (Elasticsearch window).
        required: false
        description: Number of items to skip from the start of the result set; pair with `limit` to paginate. `offset + limit` must be ≤ 10,000 (Elasticsearch window).
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 0
          description: Maximum number of curators to return per request. Defaults to 50; max 10000. `offset + limit` must be ≤ 10,000.
          default: 50
        required: false
        description: Maximum number of curators to return per request. Defaults to 50; max 10000. `offset + limit` must be ≤ 10,000.
      - name: sortColumn
        in: query
        schema:
          type: string
          enum:
          - num_playlists
          - total_reach
          description: Column to sort curators by. Allowed values vary per platform; see the endpoint description for the list. Default also varies per platform.
          default: total_reach
        required: false
        description: Column to sort curators by. Allowed values vary per platform; see the endpoint description for the list. Default also varies per platform.
      - name: sortOrderDesc
        in: query
        schema:
          type: boolean
          description: If true, sort `sortColumn` in descending order. Defaults to true.
          default: true
        required: false
        description: If true, sort `sortColumn` in descending order. Defaults to true.
      - name: userListIds[]
        in: query
        schema:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 2147483647
          uniqueItems: true
          description: Filter by Chartmetric shortlist (user list) IDs the curator is included on. Public API exposes this as `shortlistIds`.
        required: false
        description: Filter by Chartmetric shortlist (user list) IDs the curator is included on. Public API exposes this as `shortlistIds`.
      - name: nameSearch
        in: query
        schema:
          type: string
          description: Substring match against curator name.
        required: false
        description: Substring match against curator name.
      - name: playlistKeywordSearch
        in: query
        schema:
          type: string
          description: Substring match against names of playlists owned by the curator.
        required: false
        description: Substring match against names of playlists owned by the curator.
      - name: code2
        in: query
        schema:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
        required: false
        description: ISO 3166-1 alpha-2 country code (2 letters, e.g. 'US', 'BR', 'GB').
      - name: editorial
        in: query
        schema:
          type: boolean
          description: If true, return only official platform editorial curators. If false, exclude them. Applies to `spotify`, `applemusic`, `amazon`, and `youtube`.
        required: false
        description: If true, return only official platform editorial curators. If false, exclude them. Applies to `spotify`, `applemusic`, `amazon`, and `youtube`.
      - name: majorLabel
        in: query
        schema:
          type: boolean
          description: If true, return only major-label curators (Sony, Universal, Warner). If false, exclude them. Applies to `spotify` and `youtube`.
        required: false
        description: If true, return only major-label curators (Sony, Universal, Warner). If false, exclude them. Applies to `spotify` and `youtube`.
      - name: brand
        in: query
        schema:
          type: boolean
          description: If true, return only curators associated with a brand. If false, exclude them. Applies to `spotify` and `youtube`.
        required: false
        description: If true, return only curators associated with a brand. If false, exclude them. Applies to `spotify` and `youtube`.
      - name: popularIndie
        in: query
        schema:
          type: boolean
          description: If true, return only popular indie curators (not editorial/brand/major-label, with 100K+ reached followers). If false, exclude them. Applies to `spotify` and `youtube`.
        required: false
        description: If true, return only popular indie curators (not editorial/brand/major-label, with 100K+ reached followers). If false, exclude them. Applies to `spotify` and `youtube`.
      - name: indie
        in: query
        schema:
          type: boolean
          description: If true, include curators that are not major-label, editorial, brand, or popular indie. If false, exclude them. Applies to `spotify`, `applemusic`, and `youtube`.
        required: false
        description: If true, include curators that are not major-label, editorial, brand, or popular indie. If false, exclude them. Applies to `spotify`, `applemusic`, and `youtube`.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  obj:
                    type: array
                    items:
                      type: object
                      properties:
                        position:
                          type:
                          - integer
                          - 'null'
                          description: 1-based rank of the curator within the entire sorted result set (i.e. `index + 1 + offset`).
                        owner_id:
                          anyOf:
                          - type: integer
                            minimum: 0
                          - type: string
                          description: Chartmetric curator ID. Numeric for `spotify`, `applemusic`, `itunes`, `deezer`, `amazon`; string for `youtube` (channel ID).
                        owner_name:
                          type:
                          - string
                          - 'null'
                          description: Curator display name.
                        url:
                          type:
                          - string
                          - 'null'
                          description: Image or profile URL for the curator on the platform.
                        code2:
                          type:
                          - string
                          - 'null'
                          description: ISO 3166-1 alpha-2 country code associated with the curator (lowercase, e.g. 'us', 'gb'). Populated for `applemusic`, `itunes`, `deezer`, `youtube`.
                        tags:
                          type:
                          - array
                          - 'null'
                          items:
                            type:
                            - string
                            - 'null'
                          description: Genre tags associated with the curator.
                        num_playlists:
                          type:
                          - integer
                          - 'null'
                          description: Count of the curator's playlists tracked by Chartmetric.
                        user_id:
                          type:
                          - string
                          - 'null'
                          description: Platform-side user ID (Spotify user).
                        sp_playlist_total_reach:
                          type:
                          - integer
                          - 'null'
                          description: Sum of followers across all of this Spotify curator's playlists (total playlist reach). Spotify only.
                        followers:
                          type:
                          - integer
                          - 'null'
                          description: Curator's follower count on the platform.
                        fdiff_month:
                          type:
                          - integer
                          - 'null'
                          description: Net change in followers vs. 28 days ago. Spotify only.
                        fdiff_percent_month:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Percentage change in followers vs. 28 days ago, expressed as a fraction (e.g. 0.0139 = +1.39%). Spotify only.
                        num_updates:
                          type:
                          - integer
                          - 'null'
                          description: Number of updates the curator has made across their playlists. Spotify only.
                        num_tracks_updated:
                          type:
                          - integer
                          - 'null'
                          description: Number of tracks added/removed across the curator's recent playlist updates. Spotify only.
                        editorial:
                          type:
                          - boolean
                          - 'null'
                          description: True if this is an official platform editorial curator.
                        major_label:
                          type:
                          - boolean
                          - 'null'
                          description: True if the curator is operated by a major label (Sony, Universal, Warner).
                        brand:
                          type:
                          - boolean
                          - 'null'
                          description: True if the curator is operated by a brand.
                        popular_indie:
                          type:
                          - boolean
                          - 'null'
                          description: True if the curator is a popular indie (not editorial/brand/major-label, with 100K+ reached followers).
                        indie:
                          type:
                          - boolean
                          - 'null'
                          description: True if the curator is independent (not editorial, brand, major-label, or popular indie).
                        audiobook:
                          type:
                          - boolean
                          - 'null'
                          description: True if the curator focuses on audiobook content.
                        suspicion_score:
                          type:
                          - number
                          - 'null'
                          format: float
                          description: Chartmetric suspicion score flagging potentially inauthentic activity (lower is cleaner). Spotify only.
                        total_reach:
                          type:
                          - integer
                          - 'null'
                          description: Sum of followers across all of this curator's Deezer playlists. Deezer only.
                        total_playlists:
                          type:
                          - integer
                          - 'null'
                          description: Total number of playlists owned by this curator on Amazon Music. Amazon only.
                        curator_id:
                          anyOf:
                          - type: integer
                            minimum: 0
                          - type: string
                          nullable: true
                          description: Platform-side curator ID on Apple Music / iTunes.
                        channel_views:
                          type:
                          - integer
                          - 'null'
                          description: Cumulative views across the curator's YouTube channel. YouTube only.
                        channel_subscribers:
                          type:
                          - integer
                          - 'null'
                          description: Subscriber count for the curator's YouTube channel. YouTube only.
                        total_playlist_views:
                          type:
                          - integer
                          - 'null'
                          description: Sum of views across all of the curator's YouTube playlists. YouTube only.
                    description: List of curator entries for the requested platform.
                  offset:
                    type:
                    - integer
                    - 'null'
                    description: Offset of this result page (echoes the `offset` request param).
                  total:
                    anyOf:
                    - type: integer
                    - type: string
                    nullable: true
                    description: Total number of curators matching the filters across all pages.
                required:
                - obj
              examples:
                default:
                  value:
                    obj:
                    - position: 1
                      total_reach: 25973829
                      owner_id: 637006841
                      url: https://api.deezer.com/user/637006841/image
                      owner_name: Deezer Charts
                      code2: gb
                      num_playlists: 66
                      tags:
                      - '''Hip-Hop/Rap'''
                      - '''Latin'''
                      - '''Pop'''
                    offset: 0
                    total: 100
